[project]
name = "fisica-per-medicina"
version = "0.1.0"
description = "Corso LaTeX di Fisica per il semestre filtro di Medicina"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
controllo = "controllo:main"

[build-system]
requires = ["uv_build>=0.9.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "controllo"
module-root = ""
