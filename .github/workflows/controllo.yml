# Su ogni PR: compila e controlla ogni Unità didattica presente e il Libro, lancia i test
# e pubblica i PDF come artifact. È lo stesso comando che si usa in locale.
# Su main pubblica anche le pagine web degli esercizi su GitHub Pages.
name: Controllo

on:
  pull_request:
  push:
    branches: [main]

jobs:
  controllo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      # Solo i pacchetti di tex-packages.txt: se ne manca uno, la compilazione fallisce.
      - name: Cache di TinyTeX
        uses: actions/cache@v4
        with:
          path: ~/.TinyTeX
          key: tinytex-${{ runner.os }}-${{ hashFiles('tex-packages.txt') }}

      - name: Installa TinyTeX e i pacchetti
        run: |
          if [ ! -x ~/.TinyTeX/bin/x86_64-linux/tlmgr ]; then
            wget -qO- "https://yihui.org/tinytex/install-bin-unix.sh" | sh
            ~/.TinyTeX/bin/x86_64-linux/tlmgr update --self
            ~/.TinyTeX/bin/x86_64-linux/tlmgr install $(cat tex-packages.txt)
          fi
          echo "$HOME/.TinyTeX/bin/x86_64-linux" >> "$GITHUB_PATH"

      - name: Controlla le Unità didattiche e il Libro
        run: uv run controllo $(basename -s .tex libro/ud*.tex)

      - name: Test
        if: always()
        run: uv run pytest -v

      - name: Pubblica i PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf
          path: libro/build/*.pdf
          if-no-files-found: warn

      - name: Pubblica le pagine web degli esercizi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: libro/build/web/*.html
          if-no-files-found: warn

      - name: Prepara le pagine web per GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: libro/build/web

  pagine:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: controllo
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pubblica.outputs.page_url }}
    steps:
      - name: Pubblica su GitHub Pages
        id: pubblica
        uses: actions/deploy-pages@v4
