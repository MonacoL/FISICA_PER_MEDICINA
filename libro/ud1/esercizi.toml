[[quesito]]
id = "ud1-notazione-prodotto"
tipo = "multipla"
testo = '''Il prodotto $(2 \cdot 10^{-3}) \cdot (5 \cdot 10^{8})$, scritto in notazione scientifica, vale'''
corretta = "C"
calcolo = "2e-3 * 5e8"
soluzione = '''Si moltiplicano le mantisse e si sommano gli esponenti:
\[
  (2 \cdot 10^{-3}) \cdot (5 \cdot 10^{8}) = (2 \cdot 5) \cdot 10^{-3+8} = 10 \cdot 10^{5}
\]
La mantissa 10 non è minore di 10: si scrive $10 = 1 \cdot 10^{1}$, e il risultato è $1 \cdot 10^{1} \cdot 10^{5} = 1 \cdot 10^{6}$.'''

  [[quesito.opzione]]
  testo = '''$1 \cdot 10^{5}$'''
  commento = '''Trova $10 \cdot 10^{5}$, poi riduce la mantissa da 10 a 1 senza aumentare l'esponente: così il numero diventa 10 volte più piccolo.'''
  [[quesito.opzione]]
  testo = '''$7 \cdot 10^{5}$'''
  commento = '''Somma le mantisse, $2 + 5 = 7$, invece di moltiplicarle. Nel prodotto si moltiplicano le mantisse e si sommano solo gli esponenti.'''
  [[quesito.opzione]]
  testo = '''$1 \cdot 10^{6}$'''
  valore = 1e6
  [[quesito.opzione]]
  testo = '''$1 \cdot 10^{-23}$'''
  commento = '''Moltiplica gli esponenti, $(-3) \cdot 8 = -24$, invece di sommarli: $10 \cdot 10^{-24} = 1 \cdot 10^{-23}$. Gli esponenti si moltiplicano solo quando si eleva a potenza una potenza.'''
  [[quesito.opzione]]
  testo = '''$4 \cdot 10^{-12}$'''
  commento = '''Fa il quoziente invece del prodotto: $2/5 = 0{,}4$ e $10^{-3-8} = 10^{-11}$, quindi $0{,}4 \cdot 10^{-11} = 4 \cdot 10^{-12}$.'''

[[quesito]]
id = "ud1-unita-microgrammi"
tipo = "multipla"
testo = '''Una compressa di levotiroxina, un ormone tiroideo, contiene {{m}} di principio attivo. Quanti microgrammi sono?'''
dati.m = { valore = "0,075", unita = "\\milli\\gram" }
corretta = "A"
calcolo = "m * 1e3"
soluzione = '''Il milli vale $10^{-3}$ e il micro $10^{-6}$: un milligrammo è \num{1000} microgrammi. Quindi
\[
  \SI{0,075}{\milli\gram} = 0{,}075 \cdot \SI{1000}{\micro\gram} = \SI{75}{\micro\gram}
\]
Passando a un'unità più piccola il numero diventa più grande.'''

  [[quesito.opzione]]
  testo = '''\SI{75}{\micro\gram}'''
  valore = 75
  [[quesito.opzione]]
  testo = '''\SI{7,5e-5}{\micro\gram}'''
  commento = '''Divide per \num{1000} invece di moltiplicare: $0{,}075/1000 = \num{7,5e-5}$. Passando a un'unità mille volte più piccola il numero deve diventare mille volte più grande.'''
  [[quesito.opzione]]
  testo = '''\SI{7,5}{\micro\gram}'''
  commento = '''Moltiplica per 100, come se fra milli e micro ci fossero due potenze di 10. Sono tre: $10^{-3}/10^{-6} = 10^{3}$.'''
  [[quesito.opzione]]
  testo = '''\SI{7,5e4}{\micro\gram}'''
  commento = '''Moltiplica per $10^{6}$, come se la massa fosse in grammi: è la conversione da grammi a microgrammi, non da milligrammi.'''
  [[quesito.opzione]]
  testo = '''\SI{0,075}{\micro\gram}'''
  commento = '''Cambia solo il nome dell'unità e lascia il numero: da milligrammi a microgrammi l'unità diventa mille volte più piccola, quindi il numero deve diventare mille volte più grande.'''

[[quesito]]
id = "ud1-unita-ferita"
tipo = "multipla"
testo = '''Una ferita ha una superficie di {{S}}. In metri quadrati la sua superficie è'''
dati.S = { valore = 6, unita = "\\centi\\metre\\squared" }
corretta = "E"
calcolo = "S * 1e-4"
soluzione = '''Un centimetro è \SI{e-2}{\metre}, e per le aree il fattore va al quadrato: $\SI{1}{\centi\metre\squared} = (\SI{e-2}{\metre})^{2} = \SI{e-4}{\metre\squared}$. Quindi $\SI{6}{\centi\metre\squared} = \SI{6e-4}{\metre\squared}$.'''

  [[quesito.opzione]]
  testo = '''\SI{6e-2}{\metre\squared}'''
  commento = '''Usa il fattore delle lunghezze, $10^{-2}$, senza elevarlo al quadrato.'''
  [[quesito.opzione]]
  testo = '''\SI{6e-6}{\metre\squared}'''
  commento = '''Eleva il fattore al cubo, $(10^{-2})^{3} = 10^{-6}$, come per un volume: una superficie ha dimensione $[L^{2}]$, non $[L^{3}]$.'''
  [[quesito.opzione]]
  testo = '''\SI{6e4}{\metre\squared}'''
  commento = '''Usa il fattore giusto, $10^{4}$, ma moltiplica invece di dividere. Il metro quadrato è più grande del centimetro quadrato, quindi il numero deve diventare più piccolo: \SI{6e4}{\metre\squared} sono sei ettari.'''
  [[quesito.opzione]]
  testo = '''\SI{6e2}{\metre\squared}'''
  commento = '''Sbaglia due volte: non eleva al quadrato il fattore 100 e moltiplica invece di dividere.'''
  [[quesito.opzione]]
  testo = '''\SI{6e-4}{\metre\squared}'''
  valore = 6e-4

[[quesito]]
id = "ud1-grandezze-pressione"
tipo = "multipla"
testo = '''La pressione è una forza divisa per una superficie, e la forza si misura in newton: $\SI{1}{\newton} = \SI{1}{\kilo\gram\metre\per\second\squared}$. La dimensione della pressione è'''
corretta = "B"
soluzione = '''La forza ha la dimensione di una massa per una lunghezza diviso un tempo al quadrato, $[M\,L\,T^{-2}]$; una superficie ha dimensione $[L^{2}]$. Quindi
\[
  [\text{pressione}] = \frac{[M\,L\,T^{-2}]}{[L^{2}]} = [M\,L^{1-2}\,T^{-2}] = [M\,L^{-1}\,T^{-2}]
\]
È la dimensione del pascal, $\SI{1}{\pascal} = \SI{1}{\newton\per\metre\squared} = \SI{1}{\kilo\gram\per\metre\per\second\squared}$.'''

  [[quesito.opzione]]
  testo = '''$[M\,L\,T^{-2}]$'''
  commento = '''È la dimensione della forza: dimentica di dividere per la superficie.'''
  [[quesito.opzione]]
  testo = '''$[M\,L^{-1}\,T^{-2}]$'''
  [[quesito.opzione]]
  testo = '''$[M\,L^{-3}]$'''
  commento = '''È la dimensione della densità, massa diviso volume. Nella pressione c'è anche il tempo, che viene dalla forza.'''
  [[quesito.opzione]]
  testo = '''$[M\,L^{3}\,T^{-2}]$'''
  commento = '''Moltiplica la forza per la superficie invece di dividere: $[M\,L\,T^{-2}] \cdot [L^{2}] = [M\,L^{3}\,T^{-2}]$.'''
  [[quesito.opzione]]
  testo = '''$[M\,L^{-2}\,T^{-2}]$'''
  commento = '''Divide la forza per un volume, $[L^{3}]$, invece che per una superficie: $[M\,L\,T^{-2}]/[L^{3}] = [M\,L^{-2}\,T^{-2}]$.'''

[[quesito]]
id = "ud1-grandezze-intensiva"
tipo = "multipla"
testo = '''Quale di queste grandezze è intensiva?'''
corretta = "D"
soluzione = '''Una grandezza intensiva non cambia se si divide il sistema in due parti: dividendo un prelievo di sangue in due provette, la concentrazione di glucosio è la stessa in entrambe. Le altre quattro si dimezzano: sono estensive. La concentrazione è il rapporto fra due grandezze estensive, la massa di glucosio e il volume, e il rapporto fra due grandezze estensive è intensivo.'''

  [[quesito.opzione]]
  testo = '''la massa di sangue contenuta in una sacca'''
  commento = '''Dividendo la sacca in due sacche uguali la massa si dimezza: è estensiva.'''
  [[quesito.opzione]]
  testo = '''il volume di urina raccolto in un giorno'''
  commento = '''Il volume dipende da quanta urina c'è: raccogliendone metà si dimezza. È estensivo.'''
  [[quesito.opzione]]
  testo = '''il numero di globuli rossi contenuti in un prelievo'''
  commento = '''Pensa alla conta come a una proprietà del sangue, ma il numero di cellule dipende da quanto sangue si preleva: è estensivo. Intensivo è il numero di globuli rossi per microlitro.'''
  [[quesito.opzione]]
  testo = '''la concentrazione di glucosio nel sangue'''
  [[quesito.opzione]]
  testo = '''l'energia fornita da un pasto'''
  commento = '''Mangiando metà del pasto si ricava metà dell'energia: l'energia è estensiva.'''

[[quesito]]
id = "ud1-ordine-globuli"
tipo = "multipla"
testo = '''Un globulo rosso ha un diametro di circa {{d}}. L'ordine di grandezza del numero di globuli rossi che, messi in fila, coprono \SI{1}{\centi\metre} è'''
dati.d = { valore = 8, unita = "\\micro\\metre" }
corretta = "D"
calcolo = "10**round(math.log10(1e-2 / (d * 1e-6)))"
soluzione = '''Si portano le due lunghezze in metri: $\SI{1}{\centi\metre} = \SI{e-2}{\metre}$ e $\SI{8}{\micro\metre} = \SI{8e-6}{\metre}$. Il numero di globuli rossi è
\[
  N = \frac{10^{-2}}{8 \cdot 10^{-6}} = \frac{1}{8} \cdot 10^{-2-(-6)} = 0{,}125 \cdot 10^{4} = 1{,}25 \cdot 10^{3}
\]
La mantissa 1,25 è minore di 3, quindi l'ordine di grandezza è $10^{3}$.'''

  [[quesito.opzione]]
  testo = '''$10^{2}$'''
  commento = '''Confonde centi con milli e usa $\SI{1}{\centi\metre} = \SI{e-3}{\metre}$: $10^{-3}/(8 \cdot 10^{-6}) = 125 = 1{,}25 \cdot 10^{2}$.'''
  [[quesito.opzione]]
  testo = '''$10^{6}$'''
  commento = '''Legge micro come nano, $\SI{8e-9}{\metre}$: $10^{-2}/(8 \cdot 10^{-9}) = 1{,}25 \cdot 10^{6}$.'''
  [[quesito.opzione]]
  testo = '''$10^{-3}$'''
  commento = '''Rovescia il rapporto, $8 \cdot 10^{-6}/10^{-2} = 8 \cdot 10^{-4}$, che si arrotonda a $10^{-3}$. Un numero di globuli rossi minore di 1 è già un segnale d'errore.'''
  [[quesito.opzione]]
  testo = '''$10^{3}$'''
  valore = 1000
  [[quesito.opzione]]
  testo = '''$10^{4}$'''
  commento = '''Arrotonda il diametro, \SI{8}{\micro\metre}, a \SI{1}{\micro\metre}: $10^{-2}/10^{-6} = 10^{4}$. Prima di arrotondare il risultato bisogna tenere la mantissa 8, che sposta il risultato di quasi un ordine di grandezza.'''

[[quesito]]
id = "ud1-unita-febbre"
tipo = "multipla"
testo = '''Un paziente ha la febbre a \SI{39}{\celsius}. Durante la notte la temperatura scende di \SI{2}{\celsius}. In kelvin, la temperatura del mattino e la diminuzione valgono'''
corretta = "A"
soluzione = '''Al mattino la temperatura è $39 - 2 = \SI{37}{\celsius}$, cioè $T = 37 + 273 = \SI{310}{\kelvin}$. Una differenza di temperatura ha lo stesso valore nelle due scale: una diminuzione di \SI{2}{\celsius} è una diminuzione di \SI{2}{\kelvin}. Il 273 si aggiunge alle temperature, non alle differenze.'''

  [[quesito.opzione]]
  testo = '''\SI{310}{\kelvin} e \SI{2}{\kelvin}'''
  [[quesito.opzione]]
  testo = '''\SI{312}{\kelvin} e \SI{2}{\kelvin}'''
  commento = '''Converte la temperatura della sera, $39 + 273 = \SI{312}{\kelvin}$, invece di quella del mattino.'''
  [[quesito.opzione]]
  testo = '''\SI{310}{\kelvin} e \SI{275}{\kelvin}'''
  commento = '''Aggiunge 273 anche alla differenza: $2 + 273 = 275$. Una differenza di temperatura è la stessa in gradi Celsius e in kelvin.'''
  [[quesito.opzione]]
  testo = '''\SI{-236}{\kelvin} e \SI{2}{\kelvin}'''
  commento = '''Sottrae 273 invece di aggiungerlo: $37 - 273 = -236$. La temperatura in kelvin non è mai negativa.'''
  [[quesito.opzione]]
  testo = '''\SI{37}{\kelvin} e \SI{2}{\kelvin}'''
  commento = '''Cambia solo il nome dell'unità e lascia i numeri dei gradi Celsius: le due scale hanno lo zero in punti diversi.'''

[[quesito]]
id = "ud1-unita-glicemia"
tipo = "multipla"
testo = '''La glicemia a digiuno di un paziente è {{c}}. In grammi al litro vale'''
dati.c = { valore = 90, unita = "\\milli\\gram\\per\\deci\\litre" }
corretta = "E"
calcolo = "c * 1e-3 / 0.1"
soluzione = '''Si sostituiscono le unità: $\SI{1}{\milli\gram} = \SI{e-3}{\gram}$ e $\SI{1}{\deci\litre} = \SI{e-1}{\litre}$. Quindi
\[
  \SI{90}{\milli\gram\per\deci\litre} = 90 \cdot \frac{\SI{e-3}{\gram}}{\SI{e-1}{\litre}} = 90 \cdot 10^{-3-(-1)}\,\si{\gram\per\litre} = 90 \cdot 10^{-2}\,\si{\gram\per\litre} = \SI{0,90}{\gram\per\litre}
\]'''

  [[quesito.opzione]]
  testo = '''\SI{9,0}{\gram\per\litre}'''
  commento = '''Confonde deci con centi e usa $\SI{1}{\deci\litre} = \SI{e-2}{\litre}$: $90 \cdot 10^{-3}/10^{-2} = 9{,}0$.'''
  [[quesito.opzione]]
  testo = '''\SI{0,090}{\gram\per\litre}'''
  commento = '''Converte i milligrammi in grammi, \SI{0,090}{\gram}, ma tratta il decilitro come un litro.'''
  [[quesito.opzione]]
  testo = '''\SI{9,0e-3}{\gram\per\litre}'''
  commento = '''Moltiplica per 0,1 invece di dividere: $\SI{0,090}{\gram} \cdot 0{,}1 = \SI{9,0e-3}{\gram}$. In un litro, dieci volte più grande di un decilitro, c'è dieci volte più glucosio.'''
  [[quesito.opzione]]
  testo = '''\SI{900}{\gram\per\litre}'''
  commento = '''Passa bene dal decilitro al litro, $\SI{90}{\milli\gram\per\deci\litre} = \SI{900}{\milli\gram\per\litre}$, ma dimentica di convertire i milligrammi in grammi.'''
  [[quesito.opzione]]
  testo = '''\SI{0,90}{\gram\per\litre}'''
  valore = 0.9

[[quesito]]
id = "ud1-grandezze-vettoriali"
tipo = "multipla"
testo = '''Quale di queste coppie contiene solo grandezze vettoriali?'''
corretta = "C"
soluzione = '''Una grandezza è vettoriale quando per descriverla servono, oltre al numero con l'unità, una direzione e un verso. Lo spostamento e la forza sono vettoriali: spostarsi di \SI{100}{\metre} o spingere con una certa forza non dice niente finché non si sa in che direzione. Massa, temperatura, volume e durata sono scalari: basta un numero con la sua unità.'''

  [[quesito.opzione]]
  testo = '''la massa e la forza'''
  commento = '''La forza è vettoriale, ma la massa no: \SI{70}{\kilo\gram} non hanno direzione.'''
  [[quesito.opzione]]
  testo = '''la temperatura e la velocità'''
  commento = '''La velocità è vettoriale, ma la temperatura è scalare: \SI{37}{\celsius} non puntano da nessuna parte.'''
  [[quesito.opzione]]
  testo = '''lo spostamento e la forza'''
  [[quesito.opzione]]
  testo = '''il volume e lo spostamento'''
  commento = '''Lo spostamento è vettoriale, ma il volume è scalare. Il volume ha tre dimensioni nello spazio, $[L^{3}]$, ma non una direzione.'''
  [[quesito.opzione]]
  testo = '''la durata di un esame e l'accelerazione'''
  commento = '''L'accelerazione è vettoriale, ma la durata è scalare. Il tempo scorre in un solo verso, ma questo non ne fa un vettore: basta un numero, \SI{20}{\minute}.'''

[[quesito]]
id = "ud1-unita-rene"
tipo = "multipla"
testo = '''I reni filtrano circa {{V}} di plasma al giorno. In metri cubi sono'''
dati.V = { valore = 180, unita = "\\litre" }
corretta = "B"
calcolo = "V / 1000"
soluzione = '''Un litro è un decimetro cubo, e $\SI{1}{\deci\metre} = \SI{e-1}{\metre}$, quindi $\SI{1}{\litre} = (\SI{e-1}{\metre})^{3} = \SI{e-3}{\metre\cubed}$: un metro cubo contiene \num{1000} litri. Quindi $\SI{180}{\litre} = 180 \cdot \SI{e-3}{\metre\cubed} = \SI{0,18}{\metre\cubed}$.'''

  [[quesito.opzione]]
  testo = '''\SI{1,8e5}{\metre\cubed}'''
  commento = '''Moltiplica per \num{1000} invece di dividere. Il metro cubo è più grande del litro, quindi il numero deve diventare più piccolo.'''
  [[quesito.opzione]]
  testo = '''\SI{0,18}{\metre\cubed}'''
  valore = 0.18
  [[quesito.opzione]]
  testo = '''\SI{1,8}{\metre\cubed}'''
  commento = '''Eleva al quadrato il fattore 10 invece di elevarlo al cubo, e divide per 100: tratta il volume come una superficie.'''
  [[quesito.opzione]]
  testo = '''\SI{18}{\metre\cubed}'''
  commento = '''Sa che $\SI{1}{\litre} = \SI{1}{\deci\metre\cubed}$, ma divide per 10 come per una lunghezza: per un volume il fattore va al cubo, $10^{3}$.'''
  [[quesito.opzione]]
  testo = '''\SI{1,8e-4}{\metre\cubed}'''
  commento = '''Usa $\SI{1}{\litre} = \SI{e-6}{\metre\cubed}$, che è il valore del millilitro, cioè del centimetro cubo.'''

[[quesito]]
id = "ud1-notazione-quadrato"
tipo = "completamento"
testo = '''Il quadrato $(4 \cdot 10^{-6})^{2}$, scritto in notazione scientifica, è $1{,}6 \cdot 10^{n}$ con $n =$ \completa.'''
calcolo = "round(math.log10((4e-6)**2 / 1.6))"
risposta = "-11"
soluzione = '''Si eleva al quadrato la mantissa e la potenza di 10; per la potenza di una potenza gli esponenti si moltiplicano:
\[
  (4 \cdot 10^{-6})^{2} = 4^{2} \cdot 10^{-6 \cdot 2} = 16 \cdot 10^{-12} = 1{,}6 \cdot 10^{1} \cdot 10^{-12} = 1{,}6 \cdot 10^{-11}
\]
Quindi $n = -11$. Chi scrive $-12$ ha ridotto la mantissa da 16 a 1,6 senza correggere l'esponente; chi scrive 36 ha elevato al quadrato l'esponente, $(-6)^{2} = 36$, invece di moltiplicarlo per 2.'''

[[quesito]]
id = "ud1-unita-aorta"
tipo = "completamento"
testo = '''A riposo il sangue scorre nell'aorta a una velocità media di circa {{v}}. In chilometri all'ora questa velocità vale \completa\ \si{\kilo\metre\per\hour}.'''
dati.v = { valore = 20, unita = "\\centi\\metre\\per\\second" }
calcolo = "v / 100 * 3.6"
risposta = "0,72"
soluzione = '''Prima si passa ai metri al secondo: $\SI{20}{\centi\metre\per\second} = \SI{0,20}{\metre\per\second}$. Da \si{\metre\per\second} a \si{\kilo\metre\per\hour} si moltiplica per 3,6:
\[
  \SI{0,20}{\metre\per\second} \cdot 3{,}6 = \SI{0,72}{\kilo\metre\per\hour}
\]
Il fattore 3,6 viene da $\SI{1}{\metre\per\second} = \SI{e-3}{\kilo\metre}/(\SI{1}{\hour}/3600) = 3600 \cdot 10^{-3}\,\si{\kilo\metre\per\hour} = \SI{3,6}{\kilo\metre\per\hour}$. Chi divide per 3,6 trova circa 0,056, un valore che non ha senso: una velocità in \si{\kilo\metre\per\hour} è sempre un numero più grande della stessa velocità in \si{\metre\per\second}.'''

[[quesito]]
id = "ud1-unita-insulina"
tipo = "completamento"
testo = '''Una siringa da insulina contiene {{V}} di soluzione. In millimetri cubi il suo volume vale \completa.'''
dati.V = { valore = "0,50", unita = "\\milli\\litre" }
calcolo = "V * 1000"
risposta = "500"
soluzione = '''Un millilitro è un centimetro cubo, e $\SI{1}{\centi\metre} = \SI{10}{\milli\metre}$. Il fattore va al cubo: $\SI{1}{\centi\metre\cubed} = (\SI{10}{\milli\metre})^{3} = \SI{1000}{\milli\metre\cubed}$. Quindi
\[
  \SI{0,50}{\milli\litre} = 0{,}50 \cdot \SI{1000}{\milli\metre\cubed} = \SI{500}{\milli\metre\cubed}
\]
Chi usa il fattore 10 delle lunghezze trova 5.'''

[[quesito]]
id = "ud1-ordine-leucociti"
tipo = "completamento"
testo = '''Un millimetro cubo di sangue contiene circa {{n}} globuli bianchi. L'ordine di grandezza del numero di globuli bianchi in un litro di sangue è $10^{n}$ con $n =$ \completa.'''
dati.n = { valore = 7000 }
calcolo = "round(math.log10(n * 1e6))"
risposta = "10"
soluzione = '''Un litro è un decimetro cubo, e $\SI{1}{\deci\metre} = \SI{100}{\milli\metre}$, quindi $\SI{1}{\litre} = (\SI{e2}{\milli\metre})^{3} = \SI{e6}{\milli\metre\cubed}$. I globuli bianchi in un litro sono
\[
  N = 7 \cdot 10^{3} \cdot 10^{6} = 7 \cdot 10^{9}
\]
La mantissa 7 è maggiore di 3, quindi l'ordine di grandezza è $10^{9+1} = 10^{10}$: $n = 10$. Chi risponde 9 guarda solo l'esponente e dimentica la mantissa.'''

[[quesito]]
id = "ud1-grandezze-fisiologica"
tipo = "completamento"
testo = '''La soluzione fisiologica contiene {{c}} di cloruro di sodio: la concentrazione è la massa di sostanza disciolta divisa per il volume della soluzione. Si versano in un unico recipiente due sacche di soluzione fisiologica, da \SI{250}{\milli\litre} ciascuna. La concentrazione di cloruro di sodio nel recipiente vale \completa\ \si{\gram\per\litre}.'''
dati.c = { valore = 9, unita = "\\gram\\per\\litre" }
calcolo = "c"
risposta = "9"
soluzione = '''La concentrazione è una grandezza intensiva: non dipende da quanta soluzione c'è, e unendo due soluzioni con la stessa concentrazione resta la stessa. Infatti nel recipiente ci sono $2 \cdot \SI{9}{\gram\per\litre} \cdot \SI{0,250}{\litre} = \SI{4,5}{\gram}$ di sale in $\SI{0,500}{\litre}$, e $\SI{4,5}{\gram}/\SI{0,500}{\litre} = \SI{9}{\gram\per\litre}$. Massa e volume, estensivi, raddoppiano; il loro rapporto no. Chi risponde 18 somma le concentrazioni come se fossero estensive.'''

[[quesito]]
id = "ud1-trig-radianti"
tipo = "multipla"
testo = '''Un fisioterapista misura un'estensione del polso di \ang{60}. Espresso in radianti, questo angolo vale'''
corretta = "B"
calcolo = "60 * math.pi / 180"
soluzione = '''Un angolo piatto, \ang{180}, vale $\pi$ radianti. Per passare da gradi a radianti si moltiplica per $\pi/\ang{180}$:
\[
  \ang{60} = 60 \cdot \frac{\pi}{180}\ \si{\radian} = \frac{\pi}{3}\ \si{\radian}
\]
Controllo: \ang{60} è un terzo di \ang{180}, quindi vale un terzo di $\pi$.'''

  [[quesito.opzione]]
  testo = '''$\pi/6$'''
  commento = '''Usa $\ang{360} = \pi$ invece di $2\pi$: $60\pi/360 = \pi/6$, che corrisponde a \ang{30}.'''
  [[quesito.opzione]]
  testo = '''$\pi/3$'''
  valore = 1.0471975511965976
  [[quesito.opzione]]
  testo = '''$2\pi/3$'''
  commento = '''Usa $\ang{180} = 2\pi$ invece di $\pi$: $60 \cdot 2\pi/180 = 2\pi/3$, che corrisponde a \ang{120}.'''
  [[quesito.opzione]]
  testo = '''$3\pi$'''
  commento = '''Rovescia il rapporto: $180/60 = 3$ invece di $60/180 = 1/3$. Un angolo minore di \ang{180} non può valere più di $\pi$.'''
  [[quesito.opzione]]
  testo = '''$60\pi$'''
  commento = '''Moltiplica per $\pi$ ma dimentica di dividere per 180.'''

[[quesito]]
id = "ud1-trig-supplementare"
tipo = "multipla"
testo = '''Il valore di $\cos\ang{150}$ è'''
corretta = "E"
calcolo = "-cos30"
soluzione = '''\ang{150} e \ang{30} sono supplementari: $\ang{180} - \ang{150} = \ang{30}$. Per gli angoli supplementari il coseno cambia segno:
\[
  \cos\ang{150} = \cos(\ang{180} - \ang{30}) = -\cos\ang{30} = -\frac{\sqrt 3}{2} \approx -0{,}87
\]
Sulla circonferenza goniometrica il punto a \ang{150} sta a sinistra dell'asse $y$: l'ascissa, cioè il coseno, è negativa.'''

  [[quesito.opzione]]
  testo = '''$\dfrac{1}{2}$'''
  commento = '''È $\sin\ang{150} = \sin\ang{30}$: scambia il coseno con il seno.'''
  [[quesito.opzione]]
  testo = '''$\dfrac{\sqrt 3}{2}$'''
  commento = '''Trova l'angolo supplementare giusto ma dimentica il segno: per un angolo fra \ang{90} e \ang{180} il coseno è negativo.'''
  [[quesito.opzione]]
  testo = '''$-\dfrac{1}{2}$'''
  commento = '''Il segno è giusto, ma usa $\cos\ang{60}$: sottrae \ang{90} invece di partire da \ang{180}, $\ang{150} - \ang{90} = \ang{60}$. L'angolo da usare è $\ang{180} - \ang{150} = \ang{30}$.'''
  [[quesito.opzione]]
  testo = '''$-1$'''
  commento = '''È $\cos\ang{180}$: il coseno vale $-1$ solo a \ang{180}, e \ang{150} non è \ang{180}.'''
  [[quesito.opzione]]
  testo = '''$-\dfrac{\sqrt 3}{2}$'''
  valore = -0.87

[[quesito]]
id = "ud1-trig-biopsia"
tipo = "multipla"
testo = '''Un ago da biopsia lungo {{L}} viene inserito in linea retta per tutta la sua lunghezza, inclinato di \ang{60} rispetto alla superficie della pelle. La distanza fra il punto d'ingresso e il punto della pelle che sta proprio sopra la punta dell'ago vale'''
dati.L = { valore = 10, unita = "cm" }
corretta = "A"
calcolo = "L * cos60"
soluzione = '''L'ago è l'ipotenusa di un triangolo rettangolo. La distanza lungo la pelle è il cateto che forma l'angolo di \ang{60} insieme all'ago, cioè il cateto adiacente:
\[
  d = L\cos\ang{60} = \SI{10}{\centi\metre} \cdot \frac{1}{2} = \SI{5}{\centi\metre}
\]
La profondità della punta è invece il cateto opposto, $L\sin\ang{60} \approx \SI{8,7}{\centi\metre}$.'''

  [[quesito.opzione]]
  testo = '''\SI{5}{\centi\metre}'''
  valore = 5
  [[quesito.opzione]]
  testo = '''circa \SI{8,7}{\centi\metre}'''
  commento = '''Usa il seno, $10 \cdot 0{,}87$: questa è la profondità della punta sotto la pelle, il cateto opposto all'angolo.'''
  [[quesito.opzione]]
  testo = '''circa \SI{17}{\centi\metre}'''
  commento = '''Moltiplica per $\tan\ang{60} \approx 1{,}73$. La tangente è il rapporto fra due cateti, non fra un cateto e l'ipotenusa; e un cateto non può essere più lungo dell'ago.'''
  [[quesito.opzione]]
  testo = '''\SI{20}{\centi\metre}'''
  commento = '''Divide per il coseno invece di moltiplicare, $10/0{,}5$: così si troverebbe l'ipotenusa a partire dal cateto. Un cateto non può essere più lungo dell'ipotenusa.'''
  [[quesito.opzione]]
  testo = '''circa \SI{11,5}{\centi\metre}'''
  commento = '''Divide per il seno, $10/0{,}87 \approx 11{,}5$: sbaglia sia la funzione sia l'operazione, e trova un cateto più lungo dell'ago.'''

[[quesito]]
id = "ud1-vett-modulo-spazio"
tipo = "multipla"
testo = '''Il vettore $\vec a = (2, 3, 6)$ ha modulo'''
corretta = "D"
calcolo = "math.sqrt(2**2 + 3**2 + 6**2)"
soluzione = '''Nello spazio il modulo è la radice della somma dei quadrati delle tre componenti:
\[
  a = \sqrt{a_x^2 + a_y^2 + a_z^2} = \sqrt{4 + 9 + 36} = \sqrt{49} = 7
\]'''

  [[quesito.opzione]]
  testo = '''$11$'''
  commento = '''Somma le componenti, $2 + 3 + 6$: il modulo non è la somma delle componenti, come l'ipotenusa non è la somma dei cateti.'''
  [[quesito.opzione]]
  testo = '''$49$'''
  commento = '''Dimentica la radice quadrata: $4 + 9 + 36 = 49$ è il quadrato del modulo.'''
  [[quesito.opzione]]
  testo = '''circa $3{,}6$'''
  commento = '''Usa solo le componenti $x$ e $y$, $\sqrt{4 + 9} = \sqrt{13} \approx 3{,}6$: nello spazio conta anche la componente $z$.'''
  [[quesito.opzione]]
  testo = '''$7$'''
  valore = 7
  [[quesito.opzione]]
  testo = '''circa $3{,}3$'''
  commento = '''Fa la radice della somma delle componenti senza elevarle al quadrato: $\sqrt{2 + 3 + 6} = \sqrt{11} \approx 3{,}3$.'''

[[quesito]]
id = "ud1-vett-versori"
tipo = "multipla"
testo = '''Con la regola della mano destra, il prodotto vettoriale $\hat\jmath \times \hat\imath$ vale'''
corretta = "C"
soluzione = '''I due versori sono perpendicolari e hanno modulo 1, quindi il prodotto ha modulo $1 \cdot 1 \cdot \sin\ang{90} = 1$ ed è diretto come l'asse $z$. Per il verso: pollice lungo il primo fattore, $\hat\jmath$ (asse $y$), indice lungo il secondo, $\hat\imath$ (asse $x$); il medio punta nel verso negativo dell'asse $z$, dentro il foglio. Lo stesso risultato viene da $\hat\imath \times \hat\jmath = \hat k$ e dalla regola dello scambio: $\hat\jmath \times \hat\imath = -\,\hat\imath \times \hat\jmath = -\hat k$.'''

  [[quesito.opzione]]
  testo = '''$\hat k$'''
  commento = '''È $\hat\imath \times \hat\jmath$. Il prodotto vettoriale dipende dall'ordine: scambiando i fattori il verso si inverte.'''
  [[quesito.opzione]]
  testo = '''$0$'''
  commento = '''Confonde con il prodotto scalare, che è nullo per vettori perpendicolari. Il prodotto vettoriale è nullo per vettori paralleli, ed è massimo per vettori perpendicolari.'''
  [[quesito.opzione]]
  testo = '''$-\hat k$'''
  [[quesito.opzione]]
  testo = '''$1$'''
  commento = '''Trova il modulo giusto, $1 \cdot 1 \cdot \sin\ang{90} = 1$, ma lo scrive come un numero: il prodotto vettoriale è un vettore, con una direzione e un verso.'''
  [[quesito.opzione]]
  testo = '''$\hat\imath + \hat\jmath$'''
  commento = '''Confonde il prodotto con la somma. Il prodotto vettoriale è perpendicolare a entrambi i fattori, mentre $\hat\imath + \hat\jmath$ sta nel loro piano.'''

[[quesito]]
id = "ud1-vett-differenza"
tipo = "multipla"
testo = '''Dati i vettori $\vec a = (5, 2)$ e $\vec b = (1, -1)$, il modulo di $\vec a - \vec b$ vale'''
corretta = "E"
calcolo = "math.sqrt((5 - 1)**2 + (2 - (-1))**2)"
soluzione = '''Si sottraggono le componenti una per una, attenti al segno meno davanti a una componente negativa:
\[
  \vec a - \vec b = (5 - 1,\ 2 - (-1)) = (4,\ 3)
  \qquad\qquad
  |\vec a - \vec b| = \sqrt{4^2 + 3^2} = \sqrt{16 + 9} = \sqrt{25} = 5
\]'''

  [[quesito.opzione]]
  testo = '''circa $6{,}1$'''
  commento = '''È il modulo della somma: $\vec a + \vec b = (6, 1)$ e $\sqrt{36 + 1} = \sqrt{37} \approx 6{,}1$.'''
  [[quesito.opzione]]
  testo = '''circa $4{,}1$'''
  commento = '''Sbaglia il segno nella componente $y$: scrive $2 - 1 = 1$ invece di $2 - (-1) = 3$, e trova $\sqrt{16 + 1} = \sqrt{17} \approx 4{,}1$.'''
  [[quesito.opzione]]
  testo = '''$7$'''
  commento = '''Trova le componenti giuste, $(4, 3)$, ma le somma: il modulo si calcola con Pitagora.'''
  [[quesito.opzione]]
  testo = '''$25$'''
  commento = '''Dimentica la radice quadrata: $16 + 9 = 25$ è il quadrato del modulo.'''
  [[quesito.opzione]]
  testo = '''$5$'''
  valore = 5

[[quesito]]
id = "ud1-vett-perpendicolari"
tipo = "multipla"
testo = '''Il prodotto scalare dei vettori $\vec a = (2, -1, 3)$ e $\vec b = (4, 5, -1)$ vale'''
corretta = "B"
calcolo = "2 * 4 + (-1) * 5 + 3 * (-1)"
soluzione = '''Si moltiplicano le componenti omologhe e si sommano i tre prodotti, con il loro segno:
\[
  \vec a \cdot \vec b = a_x b_x + a_y b_y + a_z b_z = 2 \cdot 4 + (-1) \cdot 5 + 3 \cdot (-1) = 8 - 5 - 3 = 0
\]
Il prodotto scalare di due vettori non nulli è zero solo se sono perpendicolari: $\vec a$ e $\vec b$ lo sono.'''

  [[quesito.opzione]]
  testo = '''$16$'''
  commento = '''Ignora i segni delle componenti negative: $8 + 5 + 3 = 16$.'''
  [[quesito.opzione]]
  testo = '''$0$'''
  valore = 0
  [[quesito.opzione]]
  testo = '''$(8, -5, -3)$'''
  commento = '''Moltiplica le componenti ma non somma i prodotti: il prodotto scalare è un numero, non un vettore.'''
  [[quesito.opzione]]
  testo = '''$3$'''
  commento = '''Dimentica la componente $z$: $8 - 5 = 3$.'''
  [[quesito.opzione]]
  testo = '''circa $24$'''
  commento = '''Moltiplica i moduli, $\sqrt{14} \cdot \sqrt{42} = \sqrt{588} \approx 24$: è il prodotto scalare solo per vettori paralleli e concordi.'''

[[quesito]]
id = "ud1-vett-paralleli"
tipo = "multipla"
testo = '''Due vettori non nulli $\vec a$ e $\vec b$ hanno prodotto vettoriale nullo. Allora'''
corretta = "A"
soluzione = '''Il modulo del prodotto vettoriale è $ab\sin\theta$. Con $a$ e $b$ diversi da zero, il prodotto è nullo solo se $\sin\theta = 0$, cioè $\theta = \ang{0}$ oppure $\theta = \ang{180}$: i due vettori hanno la stessa direzione, con lo stesso verso o con versi opposti.'''

  [[quesito.opzione]]
  testo = '''$\vec a$ e $\vec b$ hanno la stessa direzione'''
  [[quesito.opzione]]
  testo = '''$\vec a$ e $\vec b$ sono perpendicolari'''
  commento = '''È il contrario: per vettori perpendicolari $\sin\ang{90} = 1$ e il prodotto vettoriale è massimo. A essere nullo per vettori perpendicolari è il prodotto scalare.'''
  [[quesito.opzione]]
  testo = '''$\vec a$ e $\vec b$ hanno lo stesso modulo'''
  commento = '''Pensa a $\vec a \times \vec a = 0$, ma è nullo perché un vettore è parallelo a sé stesso, non per l'uguaglianza dei moduli: due vettori perpendicolari di modulo uguale hanno prodotto vettoriale diverso da zero.'''
  [[quesito.opzione]]
  testo = '''anche il prodotto scalare $\vec a \cdot \vec b$ è nullo'''
  commento = '''Per vettori paralleli il prodotto scalare vale $ab$ o $-ab$, mai zero. I due prodotti non possono essere nulli insieme, se i vettori non sono nulli.'''
  [[quesito.opzione]]
  testo = '''$\vec a$ e $\vec b$ hanno versi opposti'''
  commento = '''È uno dei due casi possibili, $\theta = \ang{180}$. Anche due vettori con lo stesso verso, $\theta = \ang{0}$, hanno prodotto vettoriale nullo.'''

[[quesito]]
id = "ud1-vett-forze-120"
tipo = "multipla"
testo = '''Due elastici di un tutore tirano lo stesso punto con forze di modulo {{F}} ciascuna. Le due forze formano fra loro un angolo di \ang{120}. Il modulo della forza totale vale'''
dati.F = { valore = 10, unita = "\\newton" }
corretta = "C"
calcolo = "2 * F * cos60"
soluzione = '''Si mette la prima forza lungo l'asse $x$: $\vec F_1 = (10, 0)$, in newton. La seconda forma \ang{120} con l'asse:
\[
  \vec F_2 = (10\cos\ang{120},\ 10\sin\ang{120}) = \left(-10 \cdot \tfrac{1}{2},\ 10 \cdot \tfrac{\sqrt 3}{2}\right) = (-5,\ 5\sqrt 3)
\]
La somma è $(10 - 5,\ 5\sqrt 3) = (5,\ 5\sqrt 3)$, e il suo modulo
\[
  F = \sqrt{25 + 25 \cdot 3}\,\si{\newton} = \sqrt{100}\,\si{\newton} = \SI{10}{\newton}
\]
Due forze uguali a \ang{120} danno una somma dello stesso modulo di ciascuna.'''

  [[quesito.opzione]]
  testo = '''\SI{20}{\newton}'''
  commento = '''Somma i moduli: vale solo per forze con la stessa direzione e lo stesso verso.'''
  [[quesito.opzione]]
  testo = '''circa \SI{17}{\newton}'''
  commento = '''Prende come angolo fra le forze \ang{60} invece di \ang{120}: per due forze a \ang{60} la somma sarebbe $2 \cdot 10 \cdot \cos\ang{30} \approx \SI{17}{\newton}$.'''
  [[quesito.opzione]]
  testo = '''\SI{10}{\newton}'''
  valore = 10
  [[quesito.opzione]]
  testo = '''\SI{0}{\newton}'''
  commento = '''Tratta le forze come opposte: la somma è nulla solo se l'angolo fra le due forze uguali è \ang{180}.'''
  [[quesito.opzione]]
  testo = '''circa \SI{14}{\newton}'''
  commento = '''Usa Pitagora come se le forze fossero perpendicolari: $\sqrt{100 + 100} = 10\sqrt 2 \approx \SI{14}{\newton}$.'''

[[quesito]]
id = "ud1-vett-componenti-ottuso"
tipo = "multipla"
testo = '''Una forza di modulo \SI{6,0}{\newton} forma un angolo di \ang{120} con l'asse $x$, misurato in verso antiorario. Le sue componenti $(F_x;\ F_y)$, in newton, sono'''
corretta = "D"
soluzione = '''Con la circonferenza goniometrica le formule delle componenti valgono per qualunque angolo. Per gli angoli supplementari $\cos\ang{120} = -\cos\ang{60} = -0{,}5$ e $\sin\ang{120} = \sin\ang{60} \approx 0{,}87$:
\[
  F_x = F\cos\ang{120} = 6{,}0 \cdot (-0{,}5) = -3{,}0
  \qquad\qquad
  F_y = F\sin\ang{120} \approx 6{,}0 \cdot 0{,}87 \approx 5{,}2
\]
La forza punta verso sinistra e verso l'alto.'''

  [[quesito.opzione]]
  testo = '''$(3{,}0;\ 5{,}2)$'''
  commento = '''Dimentica il segno del coseno: per un angolo fra \ang{90} e \ang{180} il coseno è negativo e la componente $x$ punta verso sinistra.'''
  [[quesito.opzione]]
  testo = '''$(5{,}2;\ -3{,}0)$'''
  commento = '''Scambia seno e coseno: usa $F\sin\theta$ per la componente $x$ e $F\cos\theta$ per la componente $y$.'''
  [[quesito.opzione]]
  testo = '''$(-3{,}0;\ -5{,}2)$'''
  commento = '''Dà il segno meno anche alla componente $y$: a \ang{120} il punto sulla circonferenza goniometrica è sopra l'asse $x$, e il seno è positivo.'''
  [[quesito.opzione]]
  testo = '''$(-3{,}0;\ 5{,}2)$'''
  [[quesito.opzione]]
  testo = '''$(-0{,}50;\ 0{,}87)$'''
  commento = '''Sono il coseno e il seno di \ang{120}, cioè le componenti del versore: dimentica di moltiplicare per il modulo, \SI{6,0}{\newton}.'''

[[quesito]]
id = "ud1-trig-tutore"
tipo = "completamento"
testo = '''Un tutore esercita una forza di componenti $F_x = \SI{2}{\newton}$ e $F_y = 2\sqrt 3\ \si{\newton}$. L'angolo che la forza forma con l'asse $x$ vale \completa\ gradi.'''
calcolo = "math.degrees(math.atan2(2 * math.sqrt(3), 2))"
risposta = "60"
soluzione = '''La tangente dell'angolo è il rapporto fra le componenti:
\[
  \tan\theta = \frac{F_y}{F_x} = \frac{2\sqrt 3}{2} = \sqrt 3
\]
Dalla tabella dei valori notevoli $\tan\ang{60} = \sqrt 3$. Le due componenti sono positive, quindi il vettore sta fra il verso positivo dell'asse $x$ e quello dell'asse $y$, e l'angolo è \ang{60}. Chi scrive 30 ha rovesciato il rapporto, $F_x/F_y = 1/\sqrt 3 = \tan\ang{30}$.'''

[[quesito]]
id = "ud1-vett-scalare-120"
tipo = "completamento"
testo = '''Due vettori di modulo $a = 4$ e $b = 5$ formano un angolo di \ang{120}. Il prodotto scalare $\vec a \cdot \vec b$ vale \completa.'''
calcolo = "4 * 5 * (-cos60)"
risposta = "-10"
soluzione = '''Per gli angoli supplementari $\cos\ang{120} = -\cos\ang{60} = -1/2$. Quindi
\[
  \vec a \cdot \vec b = ab\cos\ang{120} = 4 \cdot 5 \cdot \left(-\frac{1}{2}\right) = -10
\]
Chi scrive 10 ha dimenticato che il coseno di un angolo ottuso è negativo; chi scrive circa 17 ha usato il seno, $20 \cdot 0{,}87$, che dà il modulo del prodotto vettoriale.'''

[[quesito]]
id = "ud1-vett-per-scalare"
tipo = "completamento"
testo = '''Dato il vettore $\vec a = (2, -1)$, il vettore $-3\vec a$ ha componente $y$ uguale a \completa.'''
calcolo = "-3 * (-1)"
risposta = "3"
soluzione = '''Moltiplicare un vettore per un numero vuol dire moltiplicare per quel numero ogni componente, $k\vec a = (k a_x, k a_y)$, anche quando $k$ è negativo:
\[
  -3\vec a = (-3 \cdot 2,\ -3 \cdot (-1)) = (-6,\ 3)
\]
La componente $y$ è 3: meno per meno dà più. Il vettore $-3\vec a$ ha la stessa direzione di $\vec a$, modulo triplo e verso opposto.'''

[[quesito]]
id = "ud1-vett-vettoriale-150"
tipo = "completamento"
testo = '''Due vettori di modulo $a = 6$ e $b = 4$ formano un angolo di \ang{150}. Il modulo del prodotto vettoriale $\vec a \times \vec b$ vale \completa.'''
calcolo = "6 * 4 * sin30"
risposta = "12"
soluzione = '''Per gli angoli supplementari il seno non cambia: $\sin\ang{150} = \sin\ang{30} = 1/2$. Quindi
\[
  |\vec a \times \vec b| = ab\sin\ang{150} = 6 \cdot 4 \cdot \frac{1}{2} = 12
\]
Il modulo del prodotto vettoriale non è mai negativo: chi scrive $-12$ ha cambiato segno al seno come si fa con il coseno. Chi scrive circa 21 ha usato $\cos\ang{30} \approx 0{,}87$.'''

[[quesito]]
id = "ud1-trig-pitagora"
tipo = "completamento"
testo = '''Per un angolo acuto $\alpha$ si sa che $\sin\alpha = 0{,}6$. Allora $\cos\alpha$ vale \completa.'''
calcolo = "math.sqrt(1 - 0.6**2)"
risposta = "0,8"
soluzione = '''Da $\sin^{2}\alpha + \cos^{2}\alpha = 1$:
\[
  \cos^{2}\alpha = 1 - \sin^{2}\alpha = 1 - 0{,}36 = 0{,}64
  \qquad\Longrightarrow\qquad
  \cos\alpha = \sqrt{0{,}64} = 0{,}8
\]
Per un angolo acuto il coseno è positivo, quindi si prende la radice positiva. È il triangolo rettangolo con cateti 3 e 4 e ipotenusa 5: $\sin\alpha = 3/5$ e $\cos\alpha = 4/5$. Chi scrive 0,4 ha fatto $1 - 0{,}6$, dimenticando i quadrati.'''

# ==================================================================== quesiti lampo, in ordine di dispensa

[[quesito]]
id = "ud1-notazione"
tipo = "completamento"
lampo = true
testo = '''Il quoziente $\dfrac{6 \cdot 10^{-4}}{3 \cdot 10^{-9}}$, scritto in notazione scientifica, è $2 \cdot 10^{n}$ con $n =$ \completa.'''
calcolo = "math.log10((6e-4 / 3e-9) / 2)"
risposta = "5"
soluzione = '''Si dividono fra loro le mantisse e le potenze di 10. Per dividere due potenze di 10 si sottraggono gli esponenti, facendo attenzione al segno meno davanti a un esponente negativo:
\[
  \frac{6 \cdot 10^{-4}}{3 \cdot 10^{-9}} = \frac{6}{3} \cdot 10^{-4-(-9)} = 2 \cdot 10^{-4+9} = 2 \cdot 10^{5}
\]
La mantissa 2 è già fra 1 e 10, quindi $n = 5$. Chi scrive $-13$ ha sommato gli esponenti invece di sottrarli; chi scrive $-5$ ha sbagliato il segno: $-4-(-9) = -4+9 = +5$.'''

[[quesito]]
id = "ud1-conversione"
tipo = "multipla"
lampo = true
testo = '''Un'ambulanza viaggia a {{v}}. La sua velocità in metri al secondo è'''
dati.v = { valore = 36, unita = "\\kilo\\metre\\per\\hour" }
corretta = "C"
calcolo = "v * 1000 / 3600"
soluzione = '''Un chilometro è \SI{1000}{\metre} e un'ora è \SI{3600}{\second}. Si sostituiscono le unità:
\[
  \SI{36}{\kilo\metre\per\hour} = 36 \cdot \frac{\SI{1000}{\metre}}{\SI{3600}{\second}} = \frac{36}{3{,}6}\,\si{\metre\per\second} = \SI{10}{\metre\per\second}
\]
In pratica, da \si{\kilo\metre\per\hour} a \si{\metre\per\second} si divide per 3,6.'''

  [[quesito.opzione]]
  testo = '''\SI{0,01}{\metre\per\second}'''
  commento = '''Divide per i \SI{3600}{\second} dell'ora ma lascia la distanza in chilometri: \SI{0,01}{\kilo\metre\per\second}, non metri al secondo.'''
  [[quesito.opzione]]
  testo = '''\SI{0,6}{\metre\per\second}'''
  commento = '''Divide per 60, come se un'ora avesse 60 secondi, e lascia la distanza in chilometri.'''
  [[quesito.opzione]]
  testo = '''\SI{10}{\metre\per\second}'''
  valore = 10
  [[quesito.opzione]]
  testo = '''\SI{129,6}{\metre\per\second}'''
  commento = '''Moltiplica per 3,6 invece di dividere. Un controllo di buon senso: un metro al secondo è poco, quindi lo stesso valore in metri al secondo deve essere più piccolo che in chilometri all'ora.'''
  [[quesito.opzione]]
  testo = '''\SI{36000}{\metre\per\second}'''
  commento = '''Converte i chilometri in metri ma dimentica di convertire le ore in secondi: \SI{36000}{\metre\per\hour}.'''

[[quesito]]
id = "ud1-ordine"
tipo = "multipla"
lampo = true
testo = '''A riposo il cuore batte circa {{f}} volte al minuto. L'ordine di grandezza del numero di battiti in un giorno è'''
dati.f = { valore = 70 }
corretta = "D"
calcolo = "10**round(math.log10(f * 60 * 24))"
soluzione = '''Un giorno ha 24 ore da 60 minuti. Si arrotonda per fare il conto a mente:
\[
  70 \cdot 60 \cdot 24 = 4200 \cdot 24 \approx 4 \cdot 10^{3} \cdot 2{,}5 \cdot 10^{1} = 10 \cdot 10^{4} = 10^{5}
\]
Il conto esatto dà \num{100800} $\approx 1{,}0 \cdot 10^{5}$: la mantissa è minore di 3, quindi l'ordine di grandezza è $10^{5}$.'''

  [[quesito.opzione]]
  testo = '''$10^{2}$'''
  commento = '''È l'ordine di grandezza dei battiti in un minuto, $70 = 7 \cdot 10^{1}$: dimentica di moltiplicare per i minuti del giorno.'''
  [[quesito.opzione]]
  testo = '''$10^{3}$'''
  commento = '''Moltiplica solo per le 24 ore, $70 \cdot 24 \approx 1{,}7 \cdot 10^{3}$, come se 70 fossero i battiti in un'ora.'''
  [[quesito.opzione]]
  testo = '''$10^{4}$'''
  commento = '''È l'ordine di grandezza dei battiti in un'ora, $70 \cdot 60 = 4200 \approx 4 \cdot 10^{3}$, che si arrotonda a $10^{4}$: dimentica le 24 ore.'''
  [[quesito.opzione]]
  testo = '''$10^{5}$'''
  valore = 1e5
  [[quesito.opzione]]
  testo = '''$10^{7}$'''
  commento = '''Moltiplica ancora per 60, come se 70 fossero i battiti al secondo: $70 \cdot 60 \cdot 60 \cdot 24 \approx 6 \cdot 10^{6}$, che si arrotonda a $10^{7}$.'''

[[quesito]]
id = "ud1-trigonometria"
tipo = "completamento"
lampo = true
testo = '''La scala mobile all'ingresso dell'ospedale è lunga {{c}} e forma con il pavimento un angolo di \ang{30}. Il dislivello che supera, in metri, è \completa.'''
dati.c = { valore = 4, unita = "m" }
calcolo = "c * sin30"
risposta = "2"
soluzione = '''La scala mobile è l'ipotenusa di un triangolo rettangolo; il dislivello è il cateto opposto all'angolo di \ang{30}, quindi si usa il seno:
\[
  h = c \sin\ang{30} = \SI{4}{\metre} \cdot \frac{1}{2} = \SI{2}{\metre}
\]
Chi scrive circa 3,5 ha usato il coseno ($4 \cdot 0{,}87$), che dà invece la distanza percorsa in orizzontale.'''

[[quesito]]
id = "ud1-somma"
tipo = "multipla"
lampo = true
testo = '''Due forze, di modulo {{F1}} e {{F2}}, agiscono sullo stesso punto e sono perpendicolari fra loro. Il modulo della loro somma vale'''
dati.F1 = { valore = 6, unita = "\\newton" }
dati.F2 = { valore = 8, unita = "\\newton" }
corretta = "B"
calcolo = "math.sqrt(F1**2 + F2**2)"
soluzione = '''Le due forze perpendicolari sono i cateti di un triangolo rettangolo, e la loro somma è l'ipotenusa. Per il teorema di Pitagora:
\[
  F = \sqrt{F_1^2 + F_2^2} = \sqrt{(\SI{6}{\newton})^2 + (\SI{8}{\newton})^2} = \sqrt{36 + 64}\,\si{\newton} = \sqrt{100}\,\si{\newton} = \SI{10}{\newton}
\]'''

  [[quesito.opzione]]
  testo = '''\SI{2}{\newton}'''
  commento = '''Sottrae i moduli: vale solo per due forze con la stessa direzione e verso opposto.'''
  [[quesito.opzione]]
  testo = '''\SI{10}{\newton}'''
  valore = 10
  [[quesito.opzione]]
  testo = '''\SI{14}{\newton}'''
  commento = '''Somma i moduli: vale solo per due forze con la stessa direzione e lo stesso verso.'''
  [[quesito.opzione]]
  testo = '''\SI{48}{\newton}'''
  commento = '''Moltiplica i moduli: la somma di due vettori non è un prodotto, e il risultato non sarebbe nemmeno una forza.'''
  [[quesito.opzione]]
  testo = '''\SI{100}{\newton}'''
  commento = '''Applica Pitagora ma dimentica la radice quadrata: $36 + 64 = 100$ è il quadrato del modulo.'''

[[quesito]]
id = "ud1-vettoriale"
tipo = "multipla"
lampo = true
testo = '''Due vettori $\vec a$ e $\vec b$, di modulo $a = 4$ e $b = 3$, formano un angolo di \ang{30}. Il modulo del prodotto vettoriale $\vec a \times \vec b$ vale'''
corretta = "E"
calcolo = "4 * 3 * sin30"
soluzione = '''Il modulo del prodotto vettoriale è $ab\sin\theta$:
\[
  |\vec a \times \vec b| = 4 \cdot 3 \cdot \sin\ang{30} = 12 \cdot \frac{1}{2} = 6
\]'''

  [[quesito.opzione]]
  testo = '''$12$'''
  commento = '''Moltiplica i moduli e dimentica il seno: $ab$ è il modulo del prodotto vettoriale solo se i vettori sono perpendicolari.'''
  [[quesito.opzione]]
  testo = '''circa $10{,}4$'''
  commento = '''Usa il coseno, $12 \cdot 0{,}87 \approx 10{,}4$: questo è il prodotto scalare $\vec a \cdot \vec b$, non il modulo del prodotto vettoriale.'''
  [[quesito.opzione]]
  testo = '''$7$'''
  commento = '''Somma i moduli, $4 + 3$: il prodotto vettoriale è un prodotto, non una somma.'''
  [[quesito.opzione]]
  testo = '''$0$'''
  commento = '''Il prodotto vettoriale è zero solo per vettori paralleli ($\theta = \ang{0}$ o \ang{180}); qui formano \ang{30}.'''
  [[quesito.opzione]]
  testo = '''$6$'''
  valore = 6
