[[problema]]
id = "ud1-notazione-piastrine"
livello = 1
testo = '''Un esame del sangue trova {{n}} piastrine in ogni microlitro (\si{\micro\litre}) di sangue. Quante piastrine ci sono in un litro? Scrivi il risultato in notazione scientifica.'''
dati.n = { valore = "2,5e5" }

  [[problema.parte]]
  calcolo = "n / 1e-6"
  risultato = { valore = 2.5e11, cifre = 2 }
  soluzione = '''Il prefisso micro vale $10^{-6}$: $\SI{1}{\micro\litre} = \SI{e-6}{\litre}$, quindi in un litro ci sono $1/10^{-6} = 10^{6}$ microlitri. Il numero di piastrine in un litro è
\[
  N = 2{,}5 \cdot 10^{5} \cdot 10^{6} = 2{,}5 \cdot 10^{5+6} = \num{2,5e11}
\]
La mantissa 2,5 è già fra 1 e 10: il risultato è in notazione scientifica.'''

[[problema]]
id = "ud1-notazione-capello"
livello = 1
testo = '''Lo spessore di un capello è circa {{d}}, il diametro di un atomo circa {{a}}. Quanti atomi, messi in fila, coprono lo spessore del capello?'''
dati.d = { valore = 80, unita = "\\micro\\metre" }
dati.a = { valore = "1e-10", unita = "m" }

  [[problema.parte]]
  calcolo = "d * 1e-6 / a"
  risultato = { valore = 8.0e5, cifre = 2 }
  soluzione = '''Si porta lo spessore del capello in metri e in notazione scientifica:
\[
  \SI{80}{\micro\metre} = 80 \cdot 10^{-6}\,\si{\metre} = 8{,}0 \cdot 10^{1} \cdot 10^{-6}\,\si{\metre} = \SI{8,0e-5}{\metre}
\]
Il numero di atomi è il rapporto fra le due lunghezze, un numero puro:
\[
  N = \frac{\SI{8,0e-5}{\metre}}{\SI{e-10}{\metre}} = 8{,}0 \cdot 10^{-5-(-10)} = 8{,}0 \cdot 10^{-5+10} = \num{8,0e5}
\]
Quasi un milione di atomi.'''

[[problema]]
id = "ud1-unita-siringa"
livello = 1
testo = '''Una siringa contiene {{V}} di farmaco. Esprimi il volume in metri cubi.'''
dati.V = { valore = "2,5", unita = "\\milli\\litre" }

  [[problema.parte]]
  calcolo = "V * 1e-6"
  risultato = { valore = 2.5e-6, unita = "\\metre\\cubed", cifre = 2 }
  soluzione = '''Un millilitro è un centimetro cubo, e $\SI{1}{\centi\metre} = \SI{e-2}{\metre}$. Il fattore di conversione va elevato al cubo:
\[
  \SI{1}{\milli\litre} = \SI{1}{\centi\metre\cubed} = (\SI{e-2}{\metre})^{3} = 10^{-2 \cdot 3}\,\si{\metre\cubed} = \SI{e-6}{\metre\cubed}
\]
Quindi $V = \SI{2,5}{\milli\litre} = \SI{2,5e-6}{\metre\cubed}$.'''

[[problema]]
id = "ud1-unita-neonato"
livello = 1
testo = '''Un neonato ha {{g}} di vita. Quanti secondi sono? Scrivi il risultato in notazione scientifica, arrotondando la mantissa a una cifra decimale.'''
dati.g = { valore = 30, unita = "giorni" }

  [[problema.parte]]
  calcolo = "g * 24 * 3600"
  risultato = { valore = 2.6e6, unita = "s", cifre = 2 }
  soluzione = '''Un giorno ha 24 ore e un'ora ha \SI{3600}{\second}. Le ore in 30 giorni sono $30 \cdot 24 = 720$, quindi
\[
  t = 720 \cdot \SI{3600}{\second} = \SI{2592000}{\second} = \SI{2,592e6}{\second} \approx \SI{2,6e6}{\second}
\]
Il conto si fa a mano anche così: $720 \cdot 3600 = 72 \cdot 36 \cdot 10^{3} = 2592 \cdot 10^{3}$.'''

[[problema]]
id = "ud1-unita-superficie"
livello = 1
testo = '''La superficie corporea di un adulto è circa {{S}}. Quanto vale in centimetri quadrati?'''
dati.S = { valore = "1,8", unita = "\\metre\\squared" }

  [[problema.parte]]
  calcolo = "S * 1e4"
  risultato = { valore = 1.8e4, unita = "\\centi\\metre\\squared", cifre = 2 }
  soluzione = '''Un metro è $\SI{e2}{\centi\metre}$, e per le aree il fattore va al quadrato:
\[
  \SI{1}{\metre\squared} = (\SI{e2}{\centi\metre})^{2} = \SI{e4}{\centi\metre\squared}
\]
Quindi $S = 1{,}8 \cdot \SI{e4}{\centi\metre\squared} = \SI{18000}{\centi\metre\squared}$. Chi moltiplica solo per 100 trova \SI{180}{\centi\metre\squared}, la superficie di una mano.'''

[[problema]]
id = "ud1-unita-flebo"
livello = 2
testo = '''Una flebo da {{V}} di soluzione fisiologica deve scendere in {{t}}.'''
dati.V = { valore = 480, unita = "\\milli\\litre" }
dati.t = { valore = "4,0", unita = "h" }

  [[problema.parte]]
  domanda = '''Quanti millilitri al minuto devono scendere?'''
  calcolo = "V / (t * 60)"
  risultato = { valore = 2.0, unita = "\\milli\\litre\\per\\minute", cifre = 2 }
  soluzione = '''Il tempo in minuti è $\SI{4,0}{\hour} = 4{,}0 \cdot \SI{60}{\minute} = \SI{240}{\minute}$. La portata è il volume diviso il tempo:
\[
  Q = \frac{\SI{480}{\milli\litre}}{\SI{240}{\minute}} = \SI{2,0}{\milli\litre\per\minute}
\]'''

  [[problema.parte]]
  domanda = '''Quanto vale la stessa portata in unità del SI, cioè in metri cubi al secondo?'''
  calcolo = "V * 1e-6 / (t * 3600)"
  risultato = { valore = 3.3e-8, unita = "\\metre\\cubed\\per\\second", cifre = 2 }
  soluzione = '''Si parte dal risultato del punto (a) e si sostituiscono le unità: $\SI{1}{\milli\litre} = \SI{1}{\centi\metre\cubed} = \SI{e-6}{\metre\cubed}$ e $\SI{1}{\minute} = \SI{60}{\second}$. Quindi
\[
  Q = \frac{2{,}0 \cdot \SI{e-6}{\metre\cubed}}{\SI{60}{\second}} = \frac{2{,}0}{60} \cdot 10^{-6}\,\si{\metre\cubed\per\second} = 3{,}3 \cdot 10^{-2} \cdot 10^{-6}\,\si{\metre\cubed\per\second} = \SI{3,3e-8}{\metre\cubed\per\second}
\]
dove $2{,}0/60 = 1/30 \approx 0{,}033 = 3{,}3 \cdot 10^{-2}$.'''

[[problema]]
id = "ud1-unita-osso"
livello = 2
testo = '''Un campione di osso compatto ha la forma di un cubo di lato {{l}} e ha massa {{m}}.'''
dati.l = { valore = "2,0", unita = "cm" }
dati.m = { valore = "15,2", unita = "\\gram" }

  [[problema.parte]]
  domanda = '''Quanto vale il volume del campione, in centimetri cubi?'''
  calcolo = "l**3"
  risultato = { valore = 8.0, unita = "\\centi\\metre\\cubed", cifre = 2 }
  soluzione = '''Il volume di un cubo è il lato al cubo:
\[
  V = (\SI{2,0}{\centi\metre})^{3} = 2{,}0 \cdot 2{,}0 \cdot 2{,}0\,\si{\centi\metre\cubed} = \SI{8,0}{\centi\metre\cubed}
\]'''

  [[problema.parte]]
  domanda = '''Quanto vale la densità dell'osso in unità del SI?'''
  calcolo = "m / l**3 * 1e3"
  risultato = { valore = 1900, unita = "\\kilo\\gram\\per\\metre\\cubed", cifre = 2 }
  soluzione = '''La densità è la massa divisa per il volume del punto (a):
\[
  \rho = \frac{m}{V} = \frac{\SI{15,2}{\gram}}{\SI{8,0}{\centi\metre\cubed}} = \SI{1,9}{\gram\per\centi\metre\cubed}
\]
Per passare al SI si sostituiscono $\SI{1}{\gram} = \SI{e-3}{\kilo\gram}$ e $\SI{1}{\centi\metre\cubed} = (\SI{e-2}{\metre})^{3} = \SI{e-6}{\metre\cubed}$:
\[
  \rho = 1{,}9 \cdot \frac{\SI{e-3}{\kilo\gram}}{\SI{e-6}{\metre\cubed}} = 1{,}9 \cdot 10^{-3-(-6)}\,\si{\kilo\gram\per\metre\cubed} = \SI{1,9e3}{\kilo\gram\per\metre\cubed} = \SI{1900}{\kilo\gram\per\metre\cubed}
\]
L'osso compatto è quasi due volte più denso dell'acqua, che ha \SI{1000}{\kilo\gram\per\metre\cubed}.'''

[[problema]]
id = "ud1-ordine-cellule"
livello = 2
testo = '''Il corpo di un adulto ha un volume di circa {{V}}. Una cellula tipica si può pensare come un cubo di lato {{l}}.'''
dati.V = { valore = 70, unita = "\\litre" }
dati.l = { valore = 20, unita = "\\micro\\metre" }

  [[problema.parte]]
  domanda = '''Quanto vale il volume di una cellula, in metri cubi?'''
  calcolo = "(l * 1e-6)**3"
  risultato = { valore = 8e-15, unita = "\\metre\\cubed", cifre = 1 }
  soluzione = '''Il lato in metri è $\SI{20}{\micro\metre} = 20 \cdot \SI{e-6}{\metre} = \SI{2e-5}{\metre}$. Il volume del cubo è
\[
  V_c = (2 \cdot 10^{-5}\,\si{\metre})^{3} = 2^{3} \cdot 10^{-5 \cdot 3}\,\si{\metre\cubed} = \SI{8e-15}{\metre\cubed}
\]'''

  [[problema.parte]]
  domanda = '''Stima il numero di cellule del corpo. Qual è il suo ordine di grandezza?'''
  calcolo = "V * 1e-3 / (l * 1e-6)**3"
  risultato = { valore = 9e12, cifre = 1 }
  rapido = '''\num{9e12}, ordine di grandezza $10^{13}$'''
  soluzione = '''Il volume del corpo in metri cubi è $\SI{70}{\litre} = 70 \cdot \SI{e-3}{\metre\cubed} = \SI{7e-2}{\metre\cubed}$, perché un litro è un millesimo di metro cubo. Il numero di cellule è il volume del corpo diviso per il volume di una cellula del punto (a):
\[
  N = \frac{\SI{7e-2}{\metre\cubed}}{\SI{8e-15}{\metre\cubed}} = \frac{7}{8} \cdot 10^{-2-(-15)} = 0{,}875 \cdot 10^{13} \approx \num{9e12}
\]
In notazione scientifica $N \approx 9 \cdot 10^{12}$: la mantissa 9 è maggiore di 3, quindi l'ordine di grandezza è $10^{13}$, una decina di migliaia di miliardi di cellule.'''

[[problema]]
id = "ud1-notazione-glucosio"
livello = 2
testo = '''In una provetta ci sono {{m1}} di glucosio sciolti in acqua. Se ne aggiungono altri {{m2}}, e alla fine la soluzione ha un volume di {{V}}. La concentrazione è la massa di sostanza disciolta divisa per il volume della soluzione.'''
dati.m1 = { valore = "2,0e-3", unita = "\\gram" }
dati.m2 = { valore = "5,0e-4", unita = "\\gram" }
dati.V = { valore = "5,0", unita = "\\milli\\litre" }

  [[problema.parte]]
  domanda = '''Quanto glucosio c'è in tutto nella provetta? Scrivi il risultato in notazione scientifica.'''
  calcolo = "m1 + m2"
  risultato = { valore = 2.5e-3, unita = "\\gram", cifre = 2 }
  soluzione = '''Per sommare due numeri in notazione scientifica bisogna prima scriverli con lo stesso esponente: $5{,}0 \cdot 10^{-4} = 0{,}50 \cdot 10^{-3}$. Poi si sommano le mantisse:
\[
  m = 2{,}0 \cdot 10^{-3}\,\si{\gram} + 0{,}50 \cdot 10^{-3}\,\si{\gram} = (2{,}0 + 0{,}50) \cdot 10^{-3}\,\si{\gram} = \SI{2,5e-3}{\gram}
\]
Gli esponenti non si sommano: $\num{2,0e-3} + \num{5,0e-4}$ non è $\num{7,0e-7}$.'''

  [[problema.parte]]
  domanda = '''Quanto vale la concentrazione del glucosio, in grammi al litro?'''
  calcolo = "(m1 + m2) / (V * 1e-3)"
  risultato = { valore = 0.50, unita = "\\gram\\per\\litre", cifre = 2 }
  soluzione = '''Il volume in litri è $\SI{5,0}{\milli\litre} = \SI{5,0e-3}{\litre}$. La concentrazione è la massa del punto (a) divisa per il volume:
\[
  c = \frac{\SI{2,5e-3}{\gram}}{\SI{5,0e-3}{\litre}} = \frac{2{,}5}{5{,}0} \cdot 10^{-3-(-3)}\,\si{\gram\per\litre} = 0{,}50 \cdot 10^{0}\,\si{\gram\per\litre} = \SI{0,50}{\gram\per\litre}
\]'''

[[problema]]
id = "ud1-grandezze-sacche"
livello = 2
testo = '''Due sacche contengono la stessa sostanza sciolta in acqua. La sacca A ha un volume di {{VA}} e una concentrazione di {{cA}}; la sacca B ha un volume di {{VB}} e una concentrazione di {{cB}}. La concentrazione è la massa di sostanza disciolta divisa per il volume della soluzione. Si versa il contenuto delle due sacche in un unico recipiente.'''
dati.VA = { valore = 300, unita = "\\milli\\litre" }
dati.cA = { valore = "2,0", unita = "\\gram\\per\\litre" }
dati.VB = { valore = 200, unita = "\\milli\\litre" }
dati.cB = { valore = "4,5", unita = "\\gram\\per\\litre" }

  [[problema.parte]]
  domanda = '''Quanta sostanza c'è nel recipiente?'''
  calcolo = "VA * 1e-3 * cA + VB * 1e-3 * cB"
  risultato = { valore = 1.5, unita = "\\gram", cifre = 2 }
  soluzione = '''Dalla definizione di concentrazione, $c = m/V$, la massa in ogni sacca è $m = cV$, con il volume in litri:
\[
  m_A = \SI{2,0}{\gram\per\litre} \cdot \SI{0,300}{\litre} = \SI{0,60}{\gram}
  \qquad
  m_B = \SI{4,5}{\gram\per\litre} \cdot \SI{0,200}{\litre} = \SI{0,90}{\gram}
\]
La massa è una grandezza estensiva: mettendo insieme le due sacche si somma, $m = \SI{0,60}{\gram} + \SI{0,90}{\gram} = \SI{1,5}{\gram}$.'''

  [[problema.parte]]
  domanda = '''Quanto vale la concentrazione nel recipiente?'''
  calcolo = "(VA * cA + VB * cB) / (VA + VB)"
  risultato = { valore = 3.0, unita = "\\gram\\per\\litre", cifre = 2 }
  soluzione = '''Anche il volume è estensivo e si somma: $V = \SI{300}{\milli\litre} + \SI{200}{\milli\litre} = \SI{500}{\milli\litre} = \SI{0,500}{\litre}$. Con la massa del punto (a):
\[
  c = \frac{m}{V} = \frac{\SI{1,5}{\gram}}{\SI{0,500}{\litre}} = \SI{3,0}{\gram\per\litre}
\]
La concentrazione è intensiva e non si somma: non vale $2{,}0 + 4{,}5 = \SI{6,5}{\gram\per\litre}$. Non è nemmeno la media semplice, $(2{,}0 + 4{,}5)/2 = \SI{3,25}{\gram\per\litre}$, perché la sacca A, più grande, pesa di più. Il risultato deve stare fra le due concentrazioni di partenza, e infatti \SI{3,0}{\gram\per\litre} è fra \SI{2,0}{\gram\per\litre} e \SI{4,5}{\gram\per\litre}.'''

[[problema]]
id = "ud1-unita-pediatrico"
livello = 3
testo = '''A un bambino di {{m}} il pediatra prescrive amoxicillina alla dose di {{d}} al giorno, divisa in due somministrazioni uguali. La sospensione orale contiene {{C}} di principio attivo ogni \SI{5}{\milli\litre}, e il flacone ne contiene {{V}}.'''
dati.m = { valore = 16, unita = "\\kilo\\gram" }
dati.d = { valore = 50, unita = "\\milli\\gram\\per\\kilo\\gram" }
dati.C = { valore = 250, unita = "\\milli\\gram" }
dati.V = { valore = 100, unita = "\\milli\\litre" }

  [[problema.parte]]
  domanda = '''Quanti milligrammi di amoxicillina deve prendere il bambino in un giorno?'''
  calcolo = "d * m"
  risultato = { valore = 800, unita = "\\milli\\gram", cifre = 2 }
  soluzione = '''La dose giornaliera è la dose per chilogrammo moltiplicata per la massa del bambino; i chilogrammi si semplificano:
\[
  D = \SI{50}{\milli\gram\per\kilo\gram} \cdot \SI{16}{\kilo\gram} = \SI{800}{\milli\gram}
\]'''

  [[problema.parte]]
  domanda = '''Quanti millilitri di sospensione deve prendere a ogni somministrazione?'''
  calcolo = "d * m / 2 / (C / 5)"
  risultato = { valore = 8.0, unita = "\\milli\\litre", cifre = 2 }
  soluzione = '''Ogni somministrazione è metà della dose del punto (a): $\SI{800}{\milli\gram}/2 = \SI{400}{\milli\gram}$. La concentrazione della sospensione è $\SI{250}{\milli\gram}/\SI{5}{\milli\litre} = \SI{50}{\milli\gram\per\milli\litre}$. Il volume è
\[
  V_1 = \frac{\SI{400}{\milli\gram}}{\SI{50}{\milli\gram\per\milli\litre}} = \SI{8,0}{\milli\litre}
\]
Dividendo milligrammi per milligrammi al millilitro restano millilitri, come deve essere.'''

  [[problema.parte]]
  domanda = '''Per quanti giorni basta il flacone?'''
  calcolo = "V / (2 * d * m / 2 / (C / 5))"
  risultato = { valore = 6.25, unita = "giorni", cifre = 3 }
  soluzione = '''In un giorno il bambino prende due volte il volume del punto (b), $2 \cdot \SI{8,0}{\milli\litre} = \SI{16}{\milli\litre}$. Il flacone basta per
\[
  \frac{\SI{100}{\milli\litre}}{\SI{16}{\milli\litre}/\text{giorno}} = 6{,}25\ \text{giorni}
\]
In pratica copre 6 giorni pieni: dopo 12 somministrazioni ne sono usciti $12 \cdot 8{,}0 = \SI{96}{\milli\litre}$, e i \SI{4}{\milli\litre} che restano non bastano per la tredicesima. Se la terapia dura più di 6 giorni serve un secondo flacone.'''

[[problema]]
id = "ud1-ordine-respiro"
livello = 3
testo = '''A riposo un adulto fa circa {{f}} atti respiratori al minuto, e a ogni atto inspira {{V}} d'aria.'''
dati.f = { valore = 12 }
dati.V = { valore = "0,50", unita = "\\litre" }
dati.rho = { valore = "1,2", unita = "\\kilo\\gram\\per\\metre\\cubed" }

  [[problema.parte]]
  domanda = '''Quanti litri d'aria inspira in un minuto?'''
  calcolo = "f * V"
  risultato = { valore = 6.0, unita = "\\litre", cifre = 2 }
  soluzione = '''Si moltiplica il volume di un atto per il numero di atti in un minuto:
\[
  V_{\text{min}} = 12 \cdot \SI{0,50}{\litre} = \SI{6,0}{\litre}
\]'''

  [[problema.parte]]
  domanda = '''Quanti metri cubi d'aria inspira in un giorno?'''
  calcolo = "f * V * 60 * 24 * 1e-3"
  risultato = { valore = 8.6, unita = "\\metre\\cubed", cifre = 2 }
  soluzione = '''Un giorno ha $24 \cdot 60 = \num{1440}$ minuti. Con il risultato del punto (a):
\[
  V_{\text{giorno}} = \SI{6,0}{\litre} \cdot 1440 = \SI{8640}{\litre}
\]
Un metro cubo contiene \num{1000} litri, quindi $\SI{8640}{\litre} = 8640 \cdot \SI{e-3}{\metre\cubed} = \SI{8,64}{\metre\cubed} \approx \SI{8,6}{\metre\cubed}$.'''

  [[problema.parte]]
  domanda = '''Qual è l'ordine di grandezza di questo volume, in metri cubi? Controlla il risultato con una stima fatta a mente.'''
  calcolo = "10**round(math.log10(f * V * 60 * 24 * 1e-3))"
  risultato = { valore = 10, unita = "\\metre\\cubed", cifre = 1 }
  soluzione = '''In notazione scientifica il volume del punto (b) è $\SI{8,6e0}{\metre\cubed}$: la mantissa 8,6 è maggiore di 3, quindi l'ordine di grandezza è $10^{0+1} = 10^{1}$, cioè \SI{10}{\metre\cubed}.

La stima a mente: si arrotonda $1440 \approx 1{,}5 \cdot 10^{3}$ e si ottiene $\SI{6}{\litre} \cdot 1{,}5 \cdot 10^{3} = 9 \cdot 10^{3}\,\si{\litre} = \SI{9}{\metre\cubed}$, con lo stesso ordine di grandezza. È più o meno il volume d'aria di uno sgabuzzino di $\SI{2}{\metre} \times \SI{2}{\metre} \times \SI{2,5}{\metre}$.'''

  [[problema.parte]]
  domanda = '''La densità dell'aria è circa {{rho}}. Quanti chilogrammi d'aria inspira in un giorno?'''
  calcolo = "f * V * 60 * 24 * 1e-3 * rho"
  risultato = { valore = 10, unita = "\\kilo\\gram", cifre = 2 }
  soluzione = '''La densità è la massa divisa per il volume, $\rho = m/V$, quindi la massa è $m = \rho V$. Con il volume del punto (b):
\[
  m = \SI{1,2}{\kilo\gram\per\metre\cubed} \cdot \SI{8,6}{\metre\cubed} \approx \SI{10,3}{\kilo\gram} \approx \SI{10}{\kilo\gram}
\]
La densità è intensiva e non dipende da quanta aria si considera; la massa, estensiva, cresce con il volume. Ogni giorno si inspirano circa \SI{10}{\kilo\gram} d'aria: più della massa del cibo e dell'acqua di una giornata, che è di qualche chilogrammo.'''

[[problema]]
id = "ud1-unita-gocce"
livello = 3
testo = '''Bisogna infondere {{V}} di soluzione in {{t}}, con un deflussore in cui {{g}} gocce fanno \SI{1}{\milli\litre}.'''
dati.V = { valore = "1,0", unita = "\\litre" }
dati.t = { valore = "8,0", unita = "h" }
dati.g = { valore = 20 }

  [[problema.parte]]
  domanda = '''Quanti millilitri all'ora devono scendere?'''
  calcolo = "V * 1e3 / t"
  risultato = { valore = 125, unita = "\\milli\\litre\\per\\hour", cifre = 3 }
  soluzione = '''Il volume in millilitri è $\SI{1,0}{\litre} = \SI{1000}{\milli\litre}$. La portata è
\[
  Q = \frac{\SI{1000}{\milli\litre}}{\SI{8,0}{\hour}} = \SI{125}{\milli\litre\per\hour}
\]'''

  [[problema.parte]]
  domanda = '''Quante gocce al minuto deve regolare l'infermiere?'''
  calcolo = "V * 1e3 / t / 60 * g"
  risultato = { valore = 42, cifre = 2 }
  soluzione = '''Ogni millilitro sono 20 gocce, quindi in un'ora scendono $125 \cdot 20 = 2500$ gocce. Un'ora ha 60 minuti:
\[
  \frac{2500\ \text{gocce}}{\SI{60}{\minute}} \approx 41{,}7\ \text{gocce al minuto} \approx 42\ \text{gocce al minuto}
\]
Poco meno di una goccia al secondo: un ritmo che si controlla a occhio.'''

  [[problema.parte]]
  domanda = '''Quanto vale il volume di una goccia, in metri cubi?'''
  calcolo = "1 / g * 1e-6"
  risultato = { valore = 5e-8, unita = "\\metre\\cubed", cifre = 1 }
  soluzione = '''Una goccia è un ventesimo di millilitro: $\SI{1}{\milli\litre}/20 = \SI{0,05}{\milli\litre} = \SI{5e-2}{\milli\litre}$. Un millilitro è un centimetro cubo, cioè $(\SI{e-2}{\metre})^{3} = \SI{e-6}{\metre\cubed}$, quindi
\[
  V_g = 5 \cdot 10^{-2} \cdot \SI{e-6}{\metre\cubed} = 5 \cdot 10^{-2+(-6)}\,\si{\metre\cubed} = \SI{5e-8}{\metre\cubed}
\]'''

[[problema]]
id = "ud1-grandezze-spostamento"
livello = 3
testo = '''In un reparto un paziente cammina per {{a}} lungo un corridoio diretto verso est, poi gira a sinistra e cammina per {{b}} verso nord, in un corridoio perpendicolare al primo.'''
dati.a = { valore = 30, unita = "m" }
dati.b = { valore = 40, unita = "m" }
dati.t = { valore = 100, unita = "s" }

  [[problema.parte]]
  domanda = '''Quanta strada ha percorso?'''
  calcolo = "a + b"
  risultato = { valore = 70, unita = "m", cifre = 2 }
  soluzione = '''La strada percorsa, o distanza percorsa, è una grandezza scalare: conta solo quanti metri il paziente ha fatto, non in che direzione. Si sommano i due tratti:
\[
  d = \SI{30}{\metre} + \SI{40}{\metre} = \SI{70}{\metre}
\]'''

  [[problema.parte]]
  domanda = '''Quanto vale il modulo del suo spostamento, cioè la distanza in linea d'aria fra il punto di partenza e quello di arrivo?'''
  calcolo = "math.sqrt(a**2 + b**2)"
  risultato = { valore = 50, unita = "m", cifre = 2 }
  soluzione = '''Lo spostamento è una grandezza vettoriale: va dal punto di partenza a quello di arrivo, con una direzione e un verso. I due tratti sono perpendicolari, quindi sono i cateti di un triangolo rettangolo, e lo spostamento ne è l'ipotenusa. Per il teorema di Pitagora:
\[
  s = \sqrt{(\SI{30}{\metre})^{2} + (\SI{40}{\metre})^{2}} = \sqrt{900 + 1600}\ \si{\metre} = \sqrt{2500}\ \si{\metre} = \SI{50}{\metre}
\]
Lo spostamento è minore della strada percorsa del punto (a): i vettori non si sommano come i numeri.'''

  [[problema.parte]]
  domanda = '''Il paziente torna alla stanza di partenza per la stessa strada. Quanto vale la distanza percorsa in tutto? E il suo spostamento complessivo?'''
  calcolo = "2 * (a + b)"
  risultato = { valore = 140, unita = "m", cifre = 2 }
  rapido = '''\SI{140}{\metre}, spostamento nullo'''
  soluzione = '''All'andata ha percorso \SI{70}{\metre}, al ritorno altri \SI{70}{\metre}. La distanza percorsa, scalare, si somma:
\[
  d_{\text{tot}} = \SI{70}{\metre} + \SI{70}{\metre} = \SI{140}{\metre}
\]
Lo spostamento complessivo invece è nullo: il paziente è tornato nel punto di partenza. Lo spostamento del ritorno ha lo stesso modulo di quello dell'andata, \SI{50}{\metre}, ma verso opposto, e i due si annullano.'''

  [[problema.parte]]
  domanda = '''Il percorso di andata dura {{t}}. Quanto vale, in chilometri all'ora, la strada percorsa all'andata divisa per il tempo? E il modulo dello spostamento diviso per il tempo?'''
  calcolo = "(a + b) / t * 3.6"
  risultato = { valore = 2.5, unita = "\\kilo\\metre\\per\\hour", cifre = 2 }
  rapido = '''\SI{2,5}{\kilo\metre\per\hour}, \SI{1,8}{\kilo\metre\per\hour}'''
  soluzione = '''Con la strada del punto (a) e lo spostamento del punto (b), divisi per il tempo:
\[
  \frac{\SI{70}{\metre}}{\SI{100}{\second}} = \SI{0,70}{\metre\per\second}
  \qquad\qquad
  \frac{\SI{50}{\metre}}{\SI{100}{\second}} = \SI{0,50}{\metre\per\second}
\]
Da \si{\metre\per\second} a \si{\kilo\metre\per\hour} si moltiplica per 3,6:
\[
  0{,}70 \cdot 3{,}6 = \SI{2,52}{\kilo\metre\per\hour} \approx \SI{2,5}{\kilo\metre\per\hour}
  \qquad\qquad
  0{,}50 \cdot 3{,}6 = \SI{1,8}{\kilo\metre\per\hour}
\]
I due rapporti sono diversi per lo stesso motivo per cui sono diversi strada e spostamento: il primo conta tutti i metri percorsi, il secondo solo la distanza in linea d'aria fra partenza e arrivo. Sul percorso di andata e ritorno il secondo sarebbe zero.'''

[[problema]]
id = "ud1-ordine-emoglobina"
livello = 3
testo = '''Un adulto ha circa {{V}} di sangue. Ogni microlitro di sangue contiene circa {{n}} globuli rossi, e ogni globulo rosso contiene circa {{h}} molecole di emoglobina.'''
dati.V = { valore = "5,0", unita = "\\litre" }
dati.n = { valore = "5,0e6" }
dati.h = { valore = "2,8e8" }
dati.mH = { valore = "1,1e-22", unita = "kg" }

  [[problema.parte]]
  domanda = '''Quanti globuli rossi ci sono in tutto il sangue?'''
  calcolo = "V * 1e6 * n"
  risultato = { valore = 2.5e13, cifre = 2 }
  soluzione = '''Un microlitro è \SI{e-6}{\litre}, quindi un litro contiene $10^{6}$ microlitri e il volume del sangue è $V = 5{,}0 \cdot 10^{6}\,\si{\micro\litre}$. Il numero di globuli rossi è
\[
  N = 5{,}0 \cdot 10^{6} \cdot 5{,}0 \cdot 10^{6} = 25 \cdot 10^{6+6} = 25 \cdot 10^{12} = 2{,}5 \cdot 10^{1} \cdot 10^{12} = \num{2,5e13}
\]'''

  [[problema.parte]]
  domanda = '''Quante molecole di emoglobina ci sono in tutto il sangue?'''
  calcolo = "V * 1e6 * n * h"
  risultato = { valore = 7.0e21, cifre = 2 }
  soluzione = '''Si moltiplica il numero di globuli rossi del punto (a) per le molecole in ognuno:
\[
  N_{\text{Hb}} = 2{,}5 \cdot 10^{13} \cdot 2{,}8 \cdot 10^{8} = (2{,}5 \cdot 2{,}8) \cdot 10^{13+8} = \num{7,0e21}
\]
dove $2{,}5 \cdot 2{,}8 = 7{,}0$.'''

  [[problema.parte]]
  domanda = '''Qual è l'ordine di grandezza di questo numero?'''
  calcolo = "10**round(math.log10(V * 1e6 * n * h))"
  risultato = { valore = 1e22, cifre = 1 }
  soluzione = '''Il numero del punto (b) è $7{,}0 \cdot 10^{21}$. La mantissa 7,0 è maggiore di 3, quindi l'ordine di grandezza è $10^{21+1} = 10^{22}$. Chi guarda solo l'esponente e risponde $10^{21}$ sbaglia di un fattore 10: $7 \cdot 10^{21}$ è più vicino a $10^{22}$ che a $10^{21}$.'''

  [[problema.parte]]
  domanda = '''Una molecola di emoglobina ha una massa di circa {{mH}}. Quanto vale la concentrazione di emoglobina nel sangue, in grammi al litro?'''
  calcolo = "V * 1e6 * n * h * mH * 1e3 / V"
  risultato = { valore = 150, unita = "\\gram\\per\\litre", cifre = 2 }
  soluzione = '''La massa di tutta l'emoglobina è il numero di molecole del punto (b) per la massa di una molecola:
\[
  m = 7{,}0 \cdot 10^{21} \cdot \SI{1,1e-22}{\kilo\gram} = (7{,}0 \cdot 1{,}1) \cdot 10^{21-22}\,\si{\kilo\gram} = 7{,}7 \cdot 10^{-1}\,\si{\kilo\gram} = \SI{770}{\gram}
\]
La concentrazione è la massa divisa per il volume del sangue:
\[
  c = \frac{\SI{770}{\gram}}{\SI{5,0}{\litre}} = \SI{154}{\gram\per\litre} \approx \SI{150}{\gram\per\litre}
\]
È il valore che si legge sulle analisi del sangue, dove si scrive \SI{15}{\gram\per\deci\litre}. Il volume del sangue alla fine si semplifica: la concentrazione è intensiva, e si poteva trovare anche partendo da un solo microlitro.'''

[[problema]]
id = "ud1-trig-schienale"
livello = 1
testo = '''Lo schienale di un letto d'ospedale è lungo {{L}}. Per mettere il paziente in posizione semiseduta lo si alza fino a formare un angolo di \ang{45} con il materasso. A che altezza sopra il piano del materasso arriva il bordo superiore dello schienale?'''
dati.L = { valore = "0,80", unita = "m" }

  [[problema.parte]]
  calcolo = "L * sin45"
  risultato = { valore = 0.57, unita = "m", cifre = 2 }
  soluzione = '''Lo schienale è l'ipotenusa di un triangolo rettangolo. L'altezza è il cateto opposto all'angolo di \ang{45}, quindi si usa il seno:
\[
  h = L \sin\ang{45} \approx \SI{0,80}{\metre} \cdot 0{,}71 = \SI{0,568}{\metre} \approx \SI{0,57}{\metre}
\]
A \ang{45} seno e coseno sono uguali: anche la distanza orizzontale fra la cerniera e il bordo dello schienale è circa \SI{0,57}{\metre}.'''

[[problema]]
id = "ud1-trig-trendelenburg"
livello = 1
testo = '''Il piano di un lettino è lungo {{L}}. Per mettere il paziente in posizione di Trendelenburg (testa più in basso dei piedi) si solleva il lato dei piedi finché si trova {{h}} più in alto del lato della testa. Che angolo forma il piano del lettino con l'orizzontale?'''
dati.L = { valore = "1,80", unita = "m" }
dati.h = { valore = "0,90", unita = "m" }

  [[problema.parte]]
  calcolo = "math.degrees(math.asin(h / L))"
  risultato = { valore = 30, unita = "\\degree", cifre = 2 }
  soluzione = '''Il piano del lettino è l'ipotenusa, il dislivello è il cateto opposto all'angolo cercato. Il loro rapporto è il seno dell'angolo:
\[
  \sin\alpha = \frac{h}{L} = \frac{\SI{0,90}{\metre}}{\SI{1,80}{\metre}} = \frac{1}{2} = 0{,}5
\]
Dalla tabella dei valori notevoli, il seno vale $1/2$ per $\alpha = \ang{30}$.'''

[[problema]]
id = "ud1-vett-carrozzina"
livello = 1
testo = '''Un infermiere spinge una carrozzina sulle maniglie con una forza di modulo {{F}}, diretta in avanti e verso il basso, a \ang{30} sotto l'orizzontale. Prendi l'asse $x$ orizzontale, nel verso in cui avanza la carrozzina, e l'asse $y$ verticale verso l'alto.'''
dati.F = { valore = 40, unita = "\\newton" }

  [[problema.parte]]
  domanda = '''Quanto vale la componente orizzontale della forza?'''
  calcolo = "F * cos30"
  risultato = { valore = 35, unita = "\\newton", cifre = 2 }
  soluzione = '''La forza è l'ipotenusa del triangolo rettangolo che ha le componenti come cateti. La componente orizzontale è il cateto adiacente all'angolo di \ang{30}, che è misurato rispetto all'orizzontale:
\[
  F_x = F \cos\ang{30} \approx \SI{40}{\newton} \cdot 0{,}87 = \SI{34,8}{\newton} \approx \SI{35}{\newton}
\]'''

  [[problema.parte]]
  domanda = '''Quanto vale la componente verticale?'''
  calcolo = "-F * sin30"
  risultato = { valore = -20, unita = "\\newton", cifre = 2 }
  soluzione = '''La componente verticale è il cateto opposto all'angolo di \ang{30}. La forza punta verso il basso e l'asse $y$ verso l'alto, quindi la componente è negativa:
\[
  F_y = -F \sin\ang{30} = -\SI{40}{\newton} \cdot 0{,}5 = -\SI{20}{\newton}
\]
Solo la componente orizzontale spinge avanti la carrozzina; quella verticale la preme contro il pavimento.'''

[[problema]]
id = "ud1-vett-corridoio"
livello = 1
testo = '''In un ospedale un barelliere percorre {{dx}} verso est lungo un corridoio, poi {{dy}} verso nord lungo un altro corridoio, perpendicolare al primo. Quanto vale il modulo del suo spostamento?'''
dati.dx = { valore = 24, unita = "m" }
dati.dy = { valore = 7, unita = "m" }

  [[problema.parte]]
  calcolo = "math.sqrt(dx**2 + dy**2)"
  risultato = { valore = 25, unita = "m", cifre = 2 }
  soluzione = '''I due spostamenti sono perpendicolari: sono i cateti di un triangolo rettangolo, e lo spostamento totale è l'ipotenusa. Per il teorema di Pitagora:
\[
  s = \sqrt{(\SI{24}{\metre})^2 + (\SI{7}{\metre})^2} = \sqrt{576 + 49}\,\si{\metre} = \sqrt{625}\,\si{\metre} = \SI{25}{\metre}
\]
Il barelliere ha camminato per $24 + 7 = \SI{31}{\metre}$, ma si trova a \SI{25}{\metre} dal punto di partenza: la strada percorsa non è il modulo dello spostamento.'''

[[problema]]
id = "ud1-vett-scalare-ottuso"
livello = 1
testo = '''Due vettori hanno modulo $a = 6{,}0$ e $b = 5{,}0$ e formano fra loro un angolo di \ang{135}. Calcola il loro prodotto scalare.'''

  [[problema.parte]]
  calcolo = "6.0 * 5.0 * (-cos45)"
  risultato = { valore = -21, cifre = 2 }
  soluzione = '''L'angolo è ottuso. Per gli angoli supplementari $\cos(\ang{180} - \theta) = -\cos\theta$, quindi
\[
  \cos\ang{135} = \cos(\ang{180} - \ang{45}) = -\cos\ang{45} \approx -0{,}71
\]
Dalla definizione del prodotto scalare:
\[
  \vec a \cdot \vec b = ab\cos\theta \approx 6{,}0 \cdot 5{,}0 \cdot (-0{,}71) = 30 \cdot (-0{,}71) = -21{,}3 \approx -21
\]
Il prodotto è negativo, come per ogni angolo fra \ang{90} e \ang{180}.'''

[[problema]]
id = "ud1-trig-pedana"
livello = 2
testo = '''Una pedana per caricare la barella sull'ambulanza supera un dislivello di {{h}} e occupa sul pavimento del garage una lunghezza orizzontale di {{d}}.'''
dati.h = { valore = "0,70", unita = "m" }
dati.d = { valore = "2,40", unita = "m" }

  [[problema.parte]]
  domanda = '''Quanto è lunga la pedana?'''
  calcolo = "math.sqrt(h**2 + d**2)"
  risultato = { valore = 2.5, unita = "m", cifre = 2 }
  soluzione = '''La pedana è l'ipotenusa del triangolo rettangolo che ha per cateti il dislivello e la lunghezza orizzontale. Per il teorema di Pitagora:
\[
  L = \sqrt{h^2 + d^2} = \sqrt{0{,}70^2 + 2{,}40^2}\,\si{\metre} = \sqrt{0{,}49 + 5{,}76}\,\si{\metre} = \sqrt{6{,}25}\,\si{\metre} = \SI{2,5}{\metre}
\]'''

  [[problema.parte]]
  domanda = '''Quanto vale il seno dell'angolo $\alpha$ che la pedana forma con il pavimento? L'angolo è maggiore o minore di \ang{30}?'''
  calcolo = "h / math.sqrt(h**2 + d**2)"
  rapido = '''0,28, minore di \ang{30}'''
  risultato = { valore = 0.28, cifre = 2 }
  soluzione = '''Il dislivello è il cateto opposto ad $\alpha$; l'ipotenusa è la lunghezza trovata al punto (a):
\[
  \sin\alpha = \frac{h}{L} = \frac{\SI{0,70}{\metre}}{\SI{2,5}{\metre}} = 0{,}28
\]
Il seno cresce con l'angolo, e $\sin\ang{30} = 0{,}5$: poiché $0{,}28 < 0{,}5$, l'angolo è minore di \ang{30}.'''

[[problema]]
id = "ud1-vett-marcatore"
livello = 2
testo = '''Prima di una seduta di radioterapia si controlla la posizione di un marcatore sulla pelle del paziente, in un piano con gli assi $x$ e $y$. Il marcatore dovrebbe trovarsi in $P = (12, 30)$, ma viene misurato in $Q = (15, 26)$, con le coordinate in millimetri.'''
dati.xP = { valore = 12, unita = "mm" }
dati.yP = { valore = 30, unita = "mm" }
dati.xQ = { valore = 15, unita = "mm" }
dati.yQ = { valore = 26, unita = "mm" }

  [[problema.parte]]
  domanda = '''Lo spostamento del marcatore è il vettore $\vec s$ che va da $P$ a $Q$. Quanto vale la sua componente $y$? Che cosa indica il suo segno?'''
  calcolo = "yQ - yP"
  risultato = { valore = -4, unita = "mm", cifre = 1 }
  soluzione = '''Le componenti del vettore che va da $P$ a $Q$ dicono di quanto si sposta in $x$ e di quanto in $y$ chi va da $P$ a $Q$: arrivo meno partenza, $s_x = x_Q - x_P$ e $s_y = y_Q - y_P$. Se si pensano $P$ e $Q$ come vettori con la coda nell'origine, è la differenza fra i due vettori, $\vec Q - \vec P$. Quindi
\[
  s_x = \SI{15}{\milli\metre} - \SI{12}{\milli\metre} = \SI{3}{\milli\metre}
  \qquad\qquad
  s_y = \SI{26}{\milli\metre} - \SI{30}{\milli\metre} = -\SI{4}{\milli\metre}
\]
La componente $y$ è negativa: il marcatore si è spostato nel verso negativo dell'asse $y$.'''

  [[problema.parte]]
  domanda = '''Di quanto si è spostato il marcatore? La tolleranza ammessa è di \SI{4}{\milli\metre}: va corretta la posizione del paziente?'''
  calcolo = "math.sqrt((xQ - xP)**2 + (yQ - yP)**2)"
  rapido = '''\SI{5}{\milli\metre}: sì, va riposizionato'''
  risultato = { valore = 5, unita = "mm", cifre = 1 }
  soluzione = '''La distanza fra $P$ e $Q$ è il modulo di $\vec s$. Con le componenti del punto (a):
\[
  s = \sqrt{s_x^2 + s_y^2} = \sqrt{3^2 + (-4)^2}\,\si{\milli\metre} = \sqrt{9 + 16}\,\si{\milli\metre} = \sqrt{25}\,\si{\milli\metre} = \SI{5}{\milli\metre}
\]
Il quadrato di un numero negativo è positivo: $(-4)^2 = 16$. Lo spostamento, \SI{5}{\milli\metre}, supera la tolleranza di \SI{4}{\milli\metre}: il paziente va riposizionato, anche se nessuna delle due componenti (3 e \SI{4}{\milli\metre}) da sola la supera. È il modulo che conta.'''

[[problema]]
id = "ud1-vett-ortodonzia"
livello = 2
testo = '''Un apparecchio ortodontico tira un dente con due elastici agganciati allo stesso punto. Il primo esercita una forza di {{F1}} lungo l'asse $x$; il secondo una forza di {{F2}} che forma un angolo di \ang{60} con la prima, sopra l'asse $x$.'''
dati.F1 = { valore = "1,5", unita = "\\newton" }
dati.F2 = { valore = "1,0", unita = "\\newton" }

  [[problema.parte]]
  domanda = '''Quanto vale la componente $y$ della seconda forza? E la componente $x$?'''
  calcolo = "F2 * sin60"
  risultato = { valore = 0.87, unita = "\\newton", cifre = 2 }
  rapido = '''$F_{2y} \approx \SI{0,87}{\newton}$, $F_{2x} = \SI{0,50}{\newton}$'''
  soluzione = '''La seconda forza forma \ang{60} con l'asse $x$:
\[
  F_{2y} = F_2 \sin\ang{60} \approx \SI{1,0}{\newton} \cdot 0{,}87 = \SI{0,87}{\newton}
  \qquad\qquad
  F_{2x} = F_2 \cos\ang{60} = \SI{1,0}{\newton} \cdot 0{,}5 = \SI{0,50}{\newton}
\]'''

  [[problema.parte]]
  domanda = '''Quanto vale il modulo della forza totale sul dente?'''
  calcolo = "math.sqrt((F1 + F2 * cos60)**2 + (F2 * sin60)**2)"
  risultato = { valore = 2.2, unita = "\\newton", cifre = 2 }
  soluzione = '''La prima forza ha componenti $(\SI{1,5}{\newton}, 0)$. Con le componenti del punto (a), si sommano le $x$ e le $y$:
\[
  R_x = \SI{1,5}{\newton} + \SI{0,50}{\newton} = \SI{2,0}{\newton}
  \qquad\qquad
  R_y = 0 + \SI{0,87}{\newton} = \SI{0,87}{\newton}
\]
Il modulo viene da Pitagora:
\[
  R = \sqrt{R_x^2 + R_y^2} = \sqrt{2{,}0^2 + 0{,}87^2}\,\si{\newton} \approx \sqrt{4{,}0 + 0{,}75}\,\si{\newton} = \sqrt{4{,}75}\,\si{\newton} \approx \SI{2,2}{\newton}
\]
Per il quadrato di 0,87 conviene il valore esatto, $R_y = (\sqrt 3/2)\,\si{\newton}$: $(\sqrt 3/2)^2 = 3/4 = 0{,}75$. La radice è circa 2,2 perché $2{,}2^2 = 4{,}84$, vicino a 4,75. Il risultato è minore della somma dei moduli, $1{,}5 + 1{,}0 = \SI{2,5}{\newton}$, perché i due elastici non tirano nella stessa direzione.'''

[[problema]]
id = "ud1-vett-angolo-componenti"
livello = 2
testo = '''Sono dati i vettori $\vec a = (1, 2)$ e $\vec b = (1, -3)$.'''

  [[problema.parte]]
  domanda = '''Calcola il prodotto scalare $\vec a \cdot \vec b$.'''
  calcolo = "1 * 1 + 2 * (-3)"
  risultato = { valore = -5, cifre = 1 }
  soluzione = '''Con le componenti si moltiplicano le $x$ fra loro e le $y$ fra loro, poi si somma:
\[
  \vec a \cdot \vec b = a_x b_x + a_y b_y = 1 \cdot 1 + 2 \cdot (-3) = 1 - 6 = -5
\]'''

  [[problema.parte]]
  domanda = '''Quanto vale l'angolo fra i due vettori?'''
  calcolo = "math.degrees(math.acos(-5 / math.sqrt(50)))"
  risultato = { valore = 135, unita = "\\degree", cifre = 3 }
  soluzione = '''I moduli sono $a = \sqrt{1 + 4} = \sqrt 5$ e $b = \sqrt{1 + 9} = \sqrt{10}$, quindi $ab = \sqrt{50} = \sqrt{25 \cdot 2} = 5\sqrt 2$. Dalla definizione $\vec a \cdot \vec b = ab\cos\theta$, con il risultato del punto (a):
\[
  \cos\theta = \frac{\vec a \cdot \vec b}{ab} = \frac{-5}{5\sqrt 2} = -\frac{1}{\sqrt 2} = -\frac{\sqrt 2}{2} \approx -0{,}71
\]
Il coseno è negativo, quindi l'angolo è ottuso. Poiché $\cos(\ang{180} - \theta) = -\cos\theta$ e $\cos\ang{45} = \sqrt 2/2$, l'angolo è $\theta = \ang{180} - \ang{45} = \ang{135}$.'''

[[problema]]
id = "ud1-vett-robot"
livello = 2
testo = '''Un robot chirurgico muove la punta di uno strumento per passi. Ogni passo è lo spostamento $\vec p = (0{,}6;\ -0{,}8)$, con le componenti in millimetri. Il robot fa tre passi, poi uno spostamento $\vec q = (2{,}2;\ 5{,}4)$, sempre in millimetri.'''

  [[problema.parte]]
  domanda = '''Calcola le componenti e il modulo dello spostamento $3\vec p$ dovuto ai tre passi.'''
  calcolo = "3 * math.sqrt(0.6**2 + 0.8**2)"
  risultato = { valore = 3.0, unita = "mm", cifre = 2 }
  rapido = '''$(1{,}8;\ -2{,}4)$ mm, \SI{3,0}{\milli\metre}'''
  soluzione = '''Moltiplicare un vettore per un numero vuol dire moltiplicare per quel numero ogni componente, $k\vec a = (k a_x, k a_y)$. Si vede bene con $3\vec p = \vec p + \vec p + \vec p$: sommando le componenti si ottiene $(3p_x, 3p_y)$. Quindi
\[
  3\vec p = (3 \cdot 0{,}6;\ 3 \cdot (-0{,}8)) = (1{,}8;\ -2{,}4)
\]
Il modulo:
\[
  |3\vec p| = \sqrt{1{,}8^2 + 2{,}4^2}\,\si{\milli\metre} = \sqrt{3{,}24 + 5{,}76}\,\si{\milli\metre} = \sqrt{9}\,\si{\milli\metre} = \SI{3,0}{\milli\metre}
\]
Controllo: un passo ha modulo $p = \sqrt{0{,}36 + 0{,}64} = 1$, e il modulo di $3\vec p$ è $3p = 3$.'''

  [[problema.parte]]
  domanda = '''Quanto vale il modulo dello spostamento totale della punta?'''
  calcolo = "math.sqrt((3 * 0.6 + 2.2)**2 + (3 * (-0.8) + 5.4)**2)"
  risultato = { valore = 5.0, unita = "mm", cifre = 2 }
  soluzione = '''Si somma $\vec q$ allo spostamento del punto (a), componente per componente:
\[
  3\vec p + \vec q = (1{,}8 + 2{,}2;\ -2{,}4 + 5{,}4) = (4{,}0;\ 3{,}0)
\]
Il modulo:
\[
  |3\vec p + \vec q| = \sqrt{4{,}0^2 + 3{,}0^2}\,\si{\milli\metre} = \sqrt{16 + 9}\,\si{\milli\metre} = \sqrt{25}\,\si{\milli\metre} = \SI{5,0}{\milli\metre}
\]'''

[[problema]]
id = "ud1-vett-elisoccorso"
livello = 3
testo = '''Un elicottero dell'elisoccorso parte dalla base e vola per {{d1}} verso est. Poi cambia rotta e vola per altri {{d2}} verso nord-est, cioè a \ang{45} fra est e nord, fino al luogo dell'incidente. Prendi l'asse $x$ verso est e l'asse $y$ verso nord.'''
dati.d1 = { valore = 20, unita = "\\kilo\\metre" }
dati.d2 = { valore = 20, unita = "\\kilo\\metre" }

  [[problema.parte]]
  domanda = '''Quanto vale la componente $x$ dello spostamento totale? E la componente $y$?'''
  calcolo = "d1 + d2 * cos45"
  risultato = { valore = 34, unita = "\\kilo\\metre", cifre = 2 }
  rapido = '''\SI{34}{\kilo\metre} e \SI{14}{\kilo\metre}'''
  soluzione = '''Il primo tratto ha componenti $(\SI{20}{\kilo\metre}, 0)$. Il secondo forma \ang{45} con l'asse $x$:
\[
  d_{2x} = d_2 \cos\ang{45} \approx \SI{20}{\kilo\metre} \cdot 0{,}71 = \SI{14,2}{\kilo\metre}
  \qquad\qquad
  d_{2y} = d_2 \sin\ang{45} \approx \SI{14,2}{\kilo\metre}
\]
Le componenti dello spostamento totale sono le somme delle componenti:
\[
  R_x = \SI{20}{\kilo\metre} + \SI{14,2}{\kilo\metre} = \SI{34,2}{\kilo\metre} \approx \SI{34}{\kilo\metre}
  \qquad\qquad
  R_y = 0 + \SI{14,2}{\kilo\metre} \approx \SI{14}{\kilo\metre}
\]'''

  [[problema.parte]]
  domanda = '''A che distanza dalla base si trova il luogo dell'incidente? Confrontala con la strada percorsa.'''
  calcolo = "math.sqrt((d1 + d2 * cos45)**2 + (d2 * sin45)**2)"
  risultato = { valore = 37, unita = "\\kilo\\metre", cifre = 2 }
  soluzione = '''La distanza è il modulo dello spostamento. Con le componenti del punto (a):
\[
  R = \sqrt{R_x^2 + R_y^2} \approx \sqrt{34^2 + 14^2}\,\si{\kilo\metre} = \sqrt{1156 + 196}\,\si{\kilo\metre} = \sqrt{1352}\,\si{\kilo\metre} \approx \SI{37}{\kilo\metre}
\]
Le componenti si arrotondano a \SI{34}{\kilo\metre} e \SI{14}{\kilo\metre} prima di elevarle al quadrato: i decimali non cambiano il risultato, e il conto si fa a mano senza fatica. La radice è circa 37 perché $37^2 = 1369$. L'elicottero ha volato per $20 + 20 = \SI{40}{\kilo\metre}$, ma si trova a \SI{37}{\kilo\metre} dalla base: i due tratti non hanno la stessa direzione, e il modulo della somma è minore della somma dei moduli.'''

  [[problema.parte]]
  domanda = '''Quanto vale la tangente dell'angolo $\theta$ che lo spostamento totale forma con l'asse $x$? L'angolo è maggiore o minore di \ang{30}? In che direzione deve volare l'elicottero per tornare alla base in linea retta?'''
  calcolo = "(d2 * sin45) / (d1 + d2 * cos45)"
  risultato = { valore = 0.42, cifre = 2 }
  rapido = '''0,42, minore di \ang{30}; ritorno verso ovest e un po' a sud'''
  soluzione = '''La tangente è il rapporto fra le componenti del punto (a):
\[
  \tan\theta = \frac{R_y}{R_x} = \frac{\SI{14,2}{\kilo\metre}}{\SI{34,2}{\kilo\metre}} \approx 0{,}42
\]
Le due componenti sono positive, quindi il vettore punta fra est e nord. La tangente cresce con l'angolo, e $\tan\ang{30} \approx 0{,}58$: poiché $0{,}42 < 0{,}58$, l'angolo è minore di \ang{30}. Per tornare l'elicottero deve percorrere lo spostamento opposto, $-\vec R = (-\SI{34}{\kilo\metre}, -\SI{14}{\kilo\metre})$: \SI{37}{\kilo\metre} con lo stesso angolo $\theta$ sotto il verso ovest, cioè verso ovest e un po' verso sud.'''

[[problema]]
id = "ud1-vett-rotula"
livello = 3
testo = '''La rotula è tirata da due tendini: il tendine del quadricipite, verso la coscia, e il tendine rotuleo, verso la tibia. Supponi che i due tendini tirino con la stessa forza, di modulo {{F}}. La somma delle due forze preme la rotula contro il femore. Quando il ginocchio è disteso le due forze hanno quasi la stessa direzione e versi opposti; quando si piega, l'angolo fra le due forze diminuisce.'''
dati.F = { valore = 1200, unita = "\\newton" }

  [[problema.parte]]
  domanda = '''Con il ginocchio poco piegato le due forze formano un angolo di \ang{120}. Quanto vale il modulo della loro somma?'''
  calcolo = "2 * F * cos60"
  risultato = { valore = 1.2e3, unita = "\\newton", cifre = 2 }
  soluzione = '''Si prende l'asse $x$ lungo la bisettrice dell'angolo fra le due forze. Ognuna forma con l'asse un angolo di $\ang{120}/2 = \ang{60}$, una sopra e una sotto. Le componenti perpendicolari all'asse hanno lo stesso modulo, $F\sin\ang{60}$, e versi opposti: si annullano. Le componenti lungo l'asse hanno lo stesso verso e si sommano:
\[
  R = 2F\cos\ang{60} = 2 \cdot \SI{1200}{\newton} \cdot 0{,}5 = \SI{1200}{\newton}
\]
A \ang{120} la somma di due forze uguali ha lo stesso modulo di ciascuna.'''

  [[problema.parte]]
  domanda = '''Piegando di più il ginocchio, l'angolo fra le forze scende a \ang{90}. Quanto vale ora il modulo della somma?'''
  calcolo = "2 * F * cos45"
  risultato = { valore = 1.7e3, unita = "\\newton", cifre = 2 }
  soluzione = '''Ognuna delle due forze forma ora \ang{45} con la bisettrice. Come nel punto (a):
\[
  R = 2F\cos\ang{45} \approx 2 \cdot \SI{1200}{\newton} \cdot 0{,}71 = \SI{1704}{\newton} \approx \SI{1,7e3}{\newton}
\]
Le forze sono perpendicolari, quindi lo stesso risultato viene da Pitagora: $R = \sqrt{F^2 + F^2} = F\sqrt 2 \approx \SI{1200}{\newton} \cdot 1{,}41 \approx \SI{1,7e3}{\newton}$.'''

  [[problema.parte]]
  domanda = '''Di quale fattore è aumentata la forza che preme la rotula contro il femore, passando da \ang{120} a \ang{90}? Che cosa succede con il ginocchio disteso?'''
  calcolo = "(2 * F * cos45) / (2 * F * cos60)"
  rapido = '''1,4; con il ginocchio disteso la somma è quasi nulla'''
  risultato = { valore = 1.4, cifre = 2 }
  soluzione = '''Con i risultati dei punti (a) e (b):
\[
  \frac{R_{90}}{R_{120}} = \frac{2F\cos\ang{45}}{2F\cos\ang{60}} = \frac{0{,}71}{0{,}5} \approx 1{,}4
\]
Il modulo dei tendini non conta: il fattore dipende solo dall'angolo. Con il ginocchio disteso le due forze sono quasi opposte, l'angolo fra loro è vicino a \ang{180} e la somma è quasi nulla: la rotula è premuta poco contro il femore. Per questo accovacciarsi o salire le scale, con il ginocchio molto piegato, carica l'articolazione fra rotula e femore molto più che stare in piedi.'''

[[problema]]
id = "ud1-vett-lesione"
livello = 3
testo = '''Per seguire la guarigione di una lesione della pelle se ne misura l'area su una foto. La lesione si approssima con un parallelogramma. Un lato è il vettore $\vec a$, di modulo {{a}}, lungo l'asse $x$ della foto (verso destra); l'altro lato è il vettore $\vec b$, di modulo {{b}}, che forma un angolo di \ang{30} con $\vec a$, verso l'alto della foto.'''
dati.a = { valore = "4,0", unita = "cm" }
dati.b = { valore = "3,0", unita = "cm" }

  [[problema.parte]]
  domanda = '''Quanto vale la componente $x$ di $\vec b$? E la componente $y$?'''
  calcolo = "b * cos30"
  risultato = { valore = 2.6, unita = "cm", cifre = 2 }
  rapido = '''$b_x \approx \SI{2,6}{\centi\metre}$, $b_y = \SI{1,5}{\centi\metre}$'''
  soluzione = '''$\vec b$ forma \ang{30} con l'asse $x$:
\[
  b_x = b\cos\ang{30} \approx \SI{3,0}{\centi\metre} \cdot 0{,}87 = \SI{2,61}{\centi\metre} \approx \SI{2,6}{\centi\metre}
  \qquad\qquad
  b_y = b\sin\ang{30} = \SI{3,0}{\centi\metre} \cdot 0{,}5 = \SI{1,5}{\centi\metre}
\]'''

  [[problema.parte]]
  domanda = '''Calcola l'area della lesione con il prodotto vettoriale. Che direzione e che verso ha $\vec a \times \vec b$?'''
  calcolo = "a * b * sin30"
  risultato = { valore = 6.0, unita = "\\centi\\metre\\squared", cifre = 2 }
  soluzione = '''L'area del parallelogramma con lati $\vec a$ e $\vec b$ è il modulo del prodotto vettoriale:
\[
  |\vec a \times \vec b| = ab\sin\ang{30} = \SI{4,0}{\centi\metre} \cdot \SI{3,0}{\centi\metre} \cdot 0{,}5 = \SI{6,0}{\centi\metre\squared}
\]
Controllo con base per altezza: la base è $a = \SI{4,0}{\centi\metre}$ e l'altezza è la componente $b_y$ del punto (a), quindi l'area è $4{,}0 \cdot 1{,}5 = \SI{6,0}{\centi\metre\squared}$. Il prodotto vettoriale è perpendicolare al piano della foto. Per il verso, con la regola della mano destra: pollice lungo $\vec a$, verso destra. L'indice va dalla parte di $\vec b$, perpendicolare al pollice: conta solo la componente di $\vec b$ perpendicolare ad $\vec a$, che qui punta verso l'alto della foto. Il medio esce dalla foto verso chi guarda, nel verso positivo dell'asse $z$.'''

  [[problema.parte]]
  domanda = '''Quanto è lunga la diagonale del parallelogramma che parte dal vertice comune ai due lati?'''
  calcolo = "math.sqrt((a + b * cos30)**2 + (b * sin30)**2)"
  risultato = { valore = 6.8, unita = "cm", cifre = 2 }
  soluzione = '''Per la regola del parallelogramma questa diagonale è la somma $\vec a + \vec b$. Con le componenti del punto (a):
\[
  \vec a + \vec b = (4{,}0 + 2{,}6;\ 0 + 1{,}5)\,\si{\centi\metre} = (6{,}6;\ 1{,}5)\,\si{\centi\metre}
\]
\[
  |\vec a + \vec b| = \sqrt{6{,}6^2 + 1{,}5^2}\,\si{\centi\metre} = \sqrt{43{,}56 + 2{,}25}\,\si{\centi\metre} = \sqrt{45{,}81}\,\si{\centi\metre} \approx \SI{6,8}{\centi\metre}
\]
perché $6{,}8^2 = 46{,}24$, vicino a 45,81. È meno della somma dei lati, $4{,}0 + 3{,}0 = \SI{7,0}{\centi\metre}$, ma di poco: i due lati formano un angolo piccolo.'''

[[problema]]
id = "ud1-trig-radiografia"
livello = 3
testo = '''In una radiografia con proiezione obliqua il raggio centrale del fascio è inclinato di \ang{30} rispetto alla verticale. Il fuoco del tubo radiogeno, da cui partono i raggi X, si trova a {{D}} dal rivelatore, misurati lungo il raggio centrale. Il rivelatore è orizzontale, sotto il paziente. La figura non è in scala.
\begin{center}
\input{ud1/figure/radiografia}
\end{center}'''
dati.D = { valore = 100, unita = "cm" }
dati.h = { valore = "6,0", unita = "cm" }

  [[problema.parte]]
  domanda = '''A che altezza sopra il rivelatore si trova il fuoco?'''
  calcolo = "D * cos30"
  risultato = { valore = 87, unita = "cm", cifre = 2 }
  soluzione = '''Il raggio centrale è l'ipotenusa di un triangolo rettangolo; i cateti sono la verticale dal fuoco al rivelatore e la distanza orizzontale. L'angolo di \ang{30} è misurato rispetto alla verticale, quindi l'altezza è il cateto adiacente:
\[
  H = D\cos\ang{30} \approx \SI{100}{\centi\metre} \cdot 0{,}87 = \SI{87}{\centi\metre}
\]'''

  [[problema.parte]]
  domanda = '''A che distanza orizzontale dal punto in cui il raggio centrale colpisce il rivelatore si trova il piede della verticale che scende dal fuoco?'''
  calcolo = "D * sin30"
  risultato = { valore = 50, unita = "cm", cifre = 2 }
  soluzione = '''La distanza orizzontale è il cateto opposto all'angolo di \ang{30}:
\[
  d = D\sin\ang{30} = \SI{100}{\centi\metre} \cdot 0{,}5 = \SI{50}{\centi\metre}
\]
Controllo con Pitagora: $87^2 + 50^2 = 7569 + 2500 = 10069$, vicino a $100^2 = 10000$; la differenza viene dall'arrotondamento di $\cos\ang{30}$ a 0,87.'''

  [[problema.parte]]
  domanda = '''Un piccolo calcolo si trova nel paziente a {{h}} sopra il rivelatore. I raggi X che lo attraversano si possono considerare paralleli al raggio centrale. Di quanto è spostata la sua ombra sul rivelatore, rispetto al punto che sta proprio sotto il calcolo?'''
  calcolo = "h * tan30"
  risultato = { valore = 3.5, unita = "cm", cifre = 2 }
  soluzione = '''Il raggio che passa per il calcolo forma un altro triangolo rettangolo, più piccolo: il cateto verticale è l'altezza $h$ del calcolo sopra il rivelatore, il cateto orizzontale è lo spostamento $x$ dell'ombra. L'angolo di \ang{30} con la verticale è adiacente ad $h$ e opposto a $x$, quindi
\[
  \tan\ang{30} = \frac{x}{h}
  \qquad\Longrightarrow\qquad
  x = h\tan\ang{30} \approx \SI{6,0}{\centi\metre} \cdot 0{,}58 = \SI{3,48}{\centi\metre} \approx \SI{3,5}{\centi\metre}
\]
Lo spostamento è proporzionale all'altezza: due strutture a profondità diverse, una sopra l'altra, nell'immagine obliqua appaiono separate. È per questo che si fanno le proiezioni oblique.'''

[[problema]]
id = "ud1-vett-cammino"
livello = 3
testo = '''In un laboratorio di analisi del cammino una telecamera riprende di lato un paziente, con tre marcatori sull'anca $H$, sul ginocchio $K$ e sulla caviglia $A$. In un istante le loro coordinate, in centimetri, sono $H = (20, 90)$, $K = (20, 50)$ e $A = (50, 20)$. La coscia è il vettore $\vec u$ che va dal ginocchio all'anca, la gamba il vettore $\vec v$ che va dal ginocchio alla caviglia.'''

  [[problema.parte]]
  domanda = '''Trova le componenti di $\vec u$ e di $\vec v$. Quanto è lunga la gamba, dal ginocchio alla caviglia?'''
  calcolo = "30 * rad2"
  risultato = { valore = 42, unita = "cm", cifre = 2 }
  rapido = '''$\vec u = (0, 40)$, $\vec v = (30, -30)$, \SI{42}{\centi\metre}'''
  soluzione = '''Le componenti del vettore che va da un punto a un altro sono arrivo meno partenza, coordinata per coordinata. $\vec u$ parte da $K$ e arriva in $H$, $\vec v$ parte da $K$ e arriva in $A$:
\[
  \vec u = (x_H - x_K,\ y_H - y_K) = (20 - 20,\ 90 - 50) = (0, 40)
\]
\[
  \vec v = (x_A - x_K,\ y_A - y_K) = (50 - 20,\ 20 - 50) = (30, -30)
\]
La lunghezza della gamba è il modulo di $\vec v$:
\[
  v = \sqrt{30^2 + (-30)^2}\,\si{\centi\metre} = \sqrt{2 \cdot 900}\,\si{\centi\metre} = 30\sqrt 2\,\si{\centi\metre} \approx 30 \cdot 1{,}41\,\si{\centi\metre} = \SI{42,3}{\centi\metre} \approx \SI{42}{\centi\metre}
\]
La coscia, verticale, è lunga $u = \SI{40}{\centi\metre}$.'''

  [[problema.parte]]
  domanda = '''Calcola il prodotto scalare $\vec u \cdot \vec v$.'''
  calcolo = "0 * 30 + 40 * (-30)"
  risultato = { valore = -1.2e3, unita = "\\centi\\metre\\squared", cifre = 2 }
  soluzione = '''Con le componenti del punto (a):
\[
  \vec u \cdot \vec v = u_x v_x + u_y v_y = 0 \cdot 30 + 40 \cdot (-30) = -1200\,\si{\centi\metre\squared}
\]
Il prodotto di due lunghezze si misura in \si{\centi\metre\squared}. È negativo: l'angolo fra coscia e gamba è ottuso.'''

  [[problema.parte]]
  domanda = '''Quanto vale l'angolo $\theta$ fra coscia e gamba? Di quanti gradi è flesso il ginocchio, se a gamba tesa coscia e gamba formano \ang{180}?'''
  calcolo = "math.degrees(math.acos(-1200 / (40 * 30 * rad2)))"
  risultato = { valore = 135, unita = "\\degree", cifre = 3 }
  rapido = '''\ang{135}, flessione \ang{45}'''
  soluzione = '''Dalla definizione del prodotto scalare, con i risultati dei punti (a) e (b):
\[
  \cos\theta = \frac{\vec u \cdot \vec v}{uv} = \frac{-1200}{40 \cdot 30\sqrt 2} = \frac{-1200}{1200\sqrt 2} = -\frac{1}{\sqrt 2} = -\frac{\sqrt 2}{2} \approx -0{,}71
\]
Poiché $\cos(\ang{180} - \theta) = -\cos\theta$ e $\cos\ang{45} = \sqrt 2/2$, l'angolo è $\theta = \ang{180} - \ang{45} = \ang{135}$. A gamba tesa l'angolo sarebbe \ang{180}, quindi il ginocchio è flesso di $\ang{180} - \ang{135} = \ang{45}$.'''

