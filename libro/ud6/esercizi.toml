[[quesito]]
id = "ud6-elettrostatica-quantizzata"
tipo = "multipla"
testo = '''La carica elementare vale $e = \SI{1,6e-19}{\coulomb}$. Quale di questi valori \emph{non} può essere la carica elettrica di un corpo?'''
corretta = "C"
soluzione = '''La carica è quantizzata: ogni carica è un multiplo intero della carica elementare, $q = \pm ne$. Basta dividere ogni valore per $e$:
\[
  \frac{\num{-4,8e-19}}{\num{1,6e-19}} = -3 \qquad \frac{\num{3,2e-19}}{\num{1,6e-19}} = 2 \qquad \frac{\num{8,0e-20}}{\num{1,6e-19}} = 0{,}5
\]
\[
  \frac{\num{1,6e-18}}{\num{1,6e-19}} = 10 \qquad \frac{\num{-1,6e-19}}{\num{1,6e-19}} = -1
\]
Solo \SI{8,0e-20}{\coulomb} non è un multiplo intero di $e$: sarebbe mezza carica elementare.'''

  [[quesito.opzione]]
  testo = '''\SI{-4,8e-19}{\coulomb}'''
  commento = '''È $-3e$: un corpo con tre elettroni in eccesso. Una carica negativa è possibile quanto una positiva.'''
  [[quesito.opzione]]
  testo = '''\SI{3,2e-19}{\coulomb}'''
  commento = '''È $2e$: un corpo con due elettroni in difetto. Una carica può essere un multiplo qualsiasi di $e$, non solo $e$ stessa.'''
  [[quesito.opzione]]
  testo = '''\SI{8,0e-20}{\coulomb}'''
  [[quesito.opzione]]
  testo = '''\SI{1,6e-18}{\coulomb}'''
  commento = '''È $10e$: con l'esponente $-18$ invece di $-19$ il valore è dieci volte $e$, non un decimo. Dieci elettroni in difetto.'''
  [[quesito.opzione]]
  testo = '''\SI{-1,6e-19}{\coulomb}'''
  commento = '''È $-e$, la carica di un elettrone: un corpo con un solo elettrone in eccesso, per esempio uno ione negativo.'''

[[quesito]]
id = "ud6-elettrostatica-linee"
tipo = "multipla"
testo = '''Le linee di forza del campo elettrico di un dipolo, formato da due cariche puntiformi $+q$ e $-q$ vicine fra loro,'''
corretta = "E"
soluzione = '''Le linee di forza partono dalle cariche positive e finiscono sulle cariche negative: in un dipolo escono da $+q$ e si richiudono su $-q$. Sono più fitte vicino alle cariche, dove il campo è più intenso, e non si incrociano mai, perché in ogni punto il campo ha una sola direzione.'''

  [[quesito.opzione]]
  testo = '''si incrociano nel punto medio fra le due cariche'''
  commento = '''Due linee di forza non si incrociano mai: nel punto d'incrocio il campo avrebbe due direzioni. Nel punto medio il campo ha una direzione sola, verso $-q$.'''
  [[quesito.opzione]]
  testo = '''partono dalla carica negativa e finiscono sulla carica positiva'''
  commento = '''Rovescia il verso. Il campo ha il verso della forza su una carica di prova \emph{positiva}, che è respinta da $+q$ e attirata da $-q$: le linee escono dalla carica positiva.'''
  [[quesito.opzione]]
  testo = '''sono più fitte lontano dalle cariche'''
  commento = '''Le linee sono più fitte dove il campo è più intenso, cioè vicino alle cariche: lontano il campo si indebolisce, e le linee si diradano.'''
  [[quesito.opzione]]
  testo = '''sono circonferenze chiuse intorno a ciascuna carica'''
  commento = '''Le linee del campo elettrico partono dalle cariche positive e finiscono su quelle negative, non girano intorno alle cariche. Le linee chiuse intorno a qualcosa sono quelle del campo magnetico di un filo percorso da corrente.'''
  [[quesito.opzione]]
  testo = '''partono dalla carica positiva e finiscono sulla carica negativa'''

[[quesito]]
id = "ud6-elettrostatica-raggi-x"
tipo = "multipla"
testo = '''In un tubo a raggi X un elettrone parte da fermo ed è accelerato da una differenza di potenziale di {{V}}. Con $e = \SI{1,6e-19}{\coulomb}$, l'energia cinetica con cui arriva sull'anodo è'''
dati.V = { valore = 80, unita = "\\kilo\\volt" }
corretta = "A"
calcolo = "V * 1e3 * e"
soluzione = '''Partendo da fermo, l'elettrone guadagna l'energia cinetica $K = e\,\Delta V$: \SI{80}{\kilo\electronvolt}. In joule, con $\Delta V = \SI{8e4}{\volt}$:
\[
  K = e\,\Delta V = \SI{1,6e-19}{\coulomb} \cdot \SI{8e4}{\volt} = 12{,}8 \cdot 10^{-19+4}\,\si{\joule} = \SI{1,28e-14}{\joule}
\]'''

  [[quesito.opzione]]
  testo = '''\SI{1,28e-14}{\joule}'''
  valore = 1.28e-14
  [[quesito.opzione]]
  testo = '''\SI{8e4}{\joule}'''
  commento = '''Confonde l'elettronvolt con il joule: l'energia è \SI{8e4}{\electronvolt}, e ogni elettronvolt vale solo \SI{1,6e-19}{\joule}.'''
  [[quesito.opzione]]
  testo = '''\SI{5e23}{\joule}'''
  commento = '''Divide per la carica elementare invece di moltiplicare: $\num{8e4}/\num{1,6e-19} = \num{5e23}$. Per passare da elettronvolt a joule si moltiplica per \num{1,6e-19}.'''
  [[quesito.opzione]]
  testo = '''\SI{1,28e-17}{\joule}'''
  commento = '''Lascia la differenza di potenziale in kilovolt, $80 \cdot \num{1,6e-19} = \num{1,28e-17}$: il risultato è mille volte troppo piccolo.'''
  [[quesito.opzione]]
  testo = '''\SI{6,4e-15}{\joule}'''
  commento = '''Aggiunge un fattore $\frac12$, come nell'energia di un condensatore: $\frac12 \cdot \num{1,28e-14} = \num{6,4e-15}$. Una carica che attraversa la differenza di potenziale $\Delta V$ guadagna tutta l'energia $e\,\Delta V$.'''

[[quesito]]
id = "ud6-elettrostatica-piastre-moto"
tipo = "multipla"
testo = '''Due piastre metalliche piane e parallele, con cariche uguali e opposte, sono nel vuoto. Un elettrone è lasciato fermo fra le piastre. Trascurando il peso, l'elettrone'''
corretta = "D"
soluzione = '''Fra le piastre il campo è uniforme e punta dalla piastra positiva alla negativa. Sull'elettrone agisce la forza $\vec F = -e\vec E$, costante e opposta al campo: verso la piastra positiva. Una forza costante dà un'accelerazione costante, e l'elettrone, partito da fermo, si muove lungo una linea di forza di moto uniformemente accelerato.'''

  [[quesito.opzione]]
  testo = '''si muove verso la piastra negativa, di moto uniformemente accelerato'''
  commento = '''È il moto di una carica positiva, che accelera nel verso del campo. L'elettrone è negativo e accelera nel verso opposto, verso la piastra positiva.'''
  [[quesito.opzione]]
  testo = '''si muove verso la piastra positiva, con velocità costante'''
  commento = '''Una forza costante non dà una velocità costante ma un'accelerazione costante ($F = ma$). Nell'elettroforesi le molecole vanno a velocità costante perché il gel le frena; nel vuoto non c'è niente che freni l'elettrone.'''
  [[quesito.opzione]]
  testo = '''resta fermo, perché il campo fra le piastre è uniforme'''
  commento = '''Confonde campo uniforme con campo nullo. Uniforme vuol dire uguale in ogni punto, non zero: la forza $eE$ c'è, ed è la stessa ovunque fra le piastre.'''
  [[quesito.opzione]]
  testo = '''si muove verso la piastra positiva, di moto uniformemente accelerato'''
  [[quesito.opzione]]
  testo = '''si muove verso la piastra positiva lungo un arco di parabola'''
  commento = '''La traiettoria è un arco di parabola solo se l'elettrone entra con una velocità perpendicolare al campo. Partendo da fermo si muove in linea retta, lungo la linea di forza.'''

[[quesito]]
id = "ud6-elettrostatica-equipotenziale"
tipo = "multipla"
testo = '''Una carica di {{q}} si sposta di {{s}} lungo una superficie equipotenziale, su cui il potenziale vale {{V}}. Il lavoro compiuto dalla forza elettrica sulla carica è'''
dati.q = { valore = "2,0", unita = "\\micro\\coulomb" }
dati.s = { valore = "5,0", unita = "cm" }
dati.V = { valore = 100, unita = "\\volt" }
corretta = "B"
soluzione = '''Il lavoro della forza elettrica è $W = -\Delta U = -q\,\Delta V$, e dipende solo dalla differenza di potenziale fra il punto di partenza e quello di arrivo. Su una superficie equipotenziale il potenziale è lo stesso ovunque, $\Delta V = 0$: il lavoro è nullo, qualunque sia il valore del potenziale e qualunque sia la distanza percorsa. Il campo è perpendicolare alla superficie, e quindi allo spostamento.'''

  [[quesito.opzione]]
  testo = '''\SI{2,0e-4}{\joule}'''
  commento = '''Calcola $qV = \num{2,0e-6} \cdot 100 = \num{2,0e-4}$, che è l'energia potenziale della carica sulla superficie, non il lavoro. Il lavoro dipende dalla \emph{differenza} di potenziale, che qui è zero.'''
  [[quesito.opzione]]
  testo = '''zero'''
  [[quesito.opzione]]
  testo = '''\SI{1,0e-5}{\joule}'''
  commento = '''Moltiplica $qV$ per la distanza: $\num{2,0e-4} \cdot 0{,}050 = \num{1,0e-5}$. Il prodotto non ha nemmeno le unità di un lavoro, e la distanza percorsa non conta.'''
  [[quesito.opzione]]
  testo = '''\SI{4,0e-3}{\joule}'''
  commento = '''Divide $qV$ per la distanza: $\num{2,0e-4}/0{,}050 = \num{4,0e-3}$. È come trattare $V/s$ come un campo lungo lo spostamento; ma lungo una superficie equipotenziale il campo non ha componenti, perché è perpendicolare alla superficie.'''
  [[quesito.opzione]]
  testo = '''\SI{-2,0e-4}{\joule}'''
  commento = '''Usa $W = -qV$, con il potenziale al posto della differenza di potenziale. Vale $W = -q\,\Delta V$, e $\Delta V = 0$.'''

[[quesito]]
id = "ud6-elettrostatica-sfera-cava"
tipo = "multipla"
testo = '''Una sfera metallica cava, sostenuta da un supporto isolante, ha una carica $+Q$ ed è in equilibrio. Il campo elettrico in un punto dentro la cavità, lontano dalle pareti,'''
corretta = "E"
soluzione = '''In un conduttore in equilibrio la carica in eccesso sta sulla superficie esterna, e le cariche libere si dispongono in modo che il campo all'interno sia nullo: se non lo fosse, le cariche si muoverebbero. Una sfera metallica chiusa è una gabbia di Faraday, e dentro la cavità il campo è nullo in ogni punto.'''

  [[quesito.opzione]]
  testo = '''è diretto verso il centro della sfera'''
  commento = '''Pensa che la carica positiva della superficie spinga verso il centro. Ma la carica è distribuita su tutta la superficie: i contributi dei lati opposti si compensano, e le cariche libere si dispongono proprio in modo che il campo dentro si annulli.'''
  [[quesito.opzione]]
  testo = '''è diretto verso l'esterno, come fuori dalla sfera'''
  commento = '''Estende all'interno il campo che c'è fuori. Fuori il campo è uscente, ma dentro un conduttore in equilibrio il campo è nullo.'''
  [[quesito.opzione]]
  testo = '''vale $kQ/r^{2}$, con $r$ la distanza dal centro'''
  commento = '''Tratta la carica come se fosse concentrata nel centro. Questo vale per il campo fuori dalla sfera, non dentro: la carica sta sulla superficie, e dentro il campo è nullo.'''
  [[quesito.opzione]]
  testo = '''è uguale a quello appena fuori dalla superficie'''
  commento = '''Pensa che il campo sia continuo attraverso la parete. Le cariche sulla superficie fanno da schermo: appena fuori il campo è perpendicolare alla superficie e diverso da zero, dentro è nullo.'''
  [[quesito.opzione]]
  testo = '''è nullo'''

[[quesito]]
id = "ud6-elettrostatica-tensione"
tipo = "completamento"
testo = '''Un elettrone parte da fermo e, attraversando una differenza di potenziale, acquista un'energia cinetica di \SI{3,2e-16}{\joule}. Con $e = \SI{1,6e-19}{\coulomb}$, la differenza di potenziale vale \completa\ \si{\volt}.'''
calcolo = "3.2e-16 / e"
risposta = "2000"
soluzione = '''Partendo da fermo l'elettrone guadagna l'energia cinetica $K = e\,\Delta V$, quindi
\[
  \Delta V = \frac{K}{e} = \frac{\SI{3,2e-16}{\joule}}{\SI{1,6e-19}{\coulomb}} = 2 \cdot 10^{-16-(-19)}\,\si{\volt} = \SI{2000}{\volt}
\]
L'energia è \SI{2000}{\electronvolt}, cioè \SI{2}{\kilo\electronvolt}. Chi scrive 200 sbaglia l'esponente, $10^{-16+19} = 10^{3}$; chi scrive 2 dà il risultato in kilovolt invece che in volt.'''

[[quesito]]
id = "ud6-elettrostatica-olio"
tipo = "completamento"
testo = '''Due cariche puntiformi nel vuoto si attraggono con una forza di modulo $F$. Si immergono in un olio di costante dielettrica relativa $\varepsilon_r = 2{,}5$ e si dimezza la loro distanza. Il modulo della forza diventa $F$ moltiplicato per \completa.'''
calcolo = "(1 / 0.5**2) / 2.5"
risposta = "1,6"
soluzione = '''Nel dielettrico la forza è $F = \frac{1}{\varepsilon_r}\,k\,|q_1 q_2|/r^{2}$. I due cambiamenti si contano separatamente e poi si moltiplicano:
\begin{itemize}
  \item la distanza si dimezza: $r^{2}$ diventa $r^{2}/4$, e la forza si moltiplica per 4;
  \item l'olio divide la forza per $\varepsilon_r = 2{,}5$.
\end{itemize}
\[
  \frac{F'}{F} = \frac{4}{2{,}5} = 1{,}6
\]
Chi scrive 0,8 dimentica il quadrato della distanza ($2/2{,}5$); chi scrive 10 moltiplica per $\varepsilon_r$ invece di dividere ($4 \cdot 2{,}5$).'''

[[quesito]]
id = "ud6-elettrostatica-lavoro-campo"
tipo = "completamento"
testo = '''Una carica di \SI{+3,0}{\micro\coulomb} si sposta di \SI{4,0}{\centi\metre} nel verso di un campo elettrico uniforme di \SI{5,0e3}{\newton\per\coulomb}. Il lavoro compiuto dalla forza elettrica vale \completa\ \si{\milli\joule}.'''
calcolo = "3.0e-6 * 5.0e3 * 0.040 * 1e3"
risposta = "0,6"
soluzione = '''La carica è positiva e si sposta nel verso del campo, cioè nel verso della forza: il lavoro è positivo, $W = qEd$. Con $q = \SI{3,0e-6}{\coulomb}$ e $d = \SI{0,040}{\metre}$:
\[
  W = qEd = \SI{3,0e-6}{\coulomb} \cdot \SI{5,0e3}{\newton\per\coulomb} \cdot \SI{0,040}{\metre} = 15 \cdot 10^{-3} \cdot 0{,}040\,\si{\joule} = \SI{6,0e-4}{\joule} = \SI{0,6}{\milli\joule}
\]
Chi scrive 60 lascia la distanza in centimetri: $15 \cdot 10^{-3} \cdot 4{,}0 = \SI{0,060}{\joule} = \SI{60}{\milli\joule}$; chi scrive 0,0006 dà il risultato in joule invece che in millijoule.'''

[[quesito]]
id = "ud6-corrente-fili"
tipo = "multipla"
testo = '''Due fili, A e B, sono fatti dello stesso materiale. Il filo B è lungo il doppio del filo A e ha un diametro doppio. Il rapporto $R_B/R_A$ fra le loro resistenze è'''
corretta = "A"
calcolo = "2 / 2**2"
soluzione = '''Per la seconda legge di Ohm, $R = \rho L/A$: la resistenza è direttamente proporzionale alla lunghezza e inversamente proporzionale all'area della sezione. L'area va con il quadrato del diametro, $A = \pi D^{2}/4$: con il diametro doppio l'area è $2^{2} = 4$ volte più grande. Quindi
\[
  \frac{R_B}{R_A} = \frac{L_B}{L_A} \cdot \frac{A_A}{A_B} = 2 \cdot \frac14 = \frac12
\]'''

  [[quesito.opzione]]
  testo = '''$\frac12$'''
  valore = 0.5
  [[quesito.opzione]]
  testo = '''1'''
  commento = '''Tratta l'area come proporzionale al diametro: $2 \cdot \frac12 = 1$. L'area di un cerchio va con il quadrato del diametro, e un diametro doppio dà un'area quadrupla.'''
  [[quesito.opzione]]
  testo = '''2'''
  commento = '''Tiene conto solo della lunghezza doppia e dimentica la sezione più grande, che riduce la resistenza.'''
  [[quesito.opzione]]
  testo = '''8'''
  commento = '''Moltiplica per il fattore dell'area invece di dividere: $2 \cdot 4 = 8$. Una sezione più grande apre più strada alla corrente, e la resistenza diminuisce.'''
  [[quesito.opzione]]
  testo = '''$\frac14$'''
  commento = '''Tiene conto solo dell'area quadrupla e dimentica che la lunghezza doppia raddoppia la resistenza.'''

[[quesito]]
id = "ud6-corrente-aerosol"
tipo = "multipla"
testo = '''Un apparecchio per aerosol da {{P}} viene usato {{t}} al giorno per {{n}} giorni. L'energia elettrica consumata in tutto è'''
dati.P = { valore = 150, unita = "W" }
dati.t = { valore = 20, unita = "\\minute" }
dati.n = { valore = 30 }
corretta = "D"
calcolo = "P / 1000 * t / 60 * n"
soluzione = '''Conviene la potenza in chilowatt e il tempo in ore: il prodotto è già in chilowattora. La potenza è $P = \SI{150}{\watt} = \SI{0,15}{\kilo\watt}$; il tempo di funzionamento è $30 \cdot \SI{20}{\minute} = \SI{600}{\minute} = \SI{10}{\hour}$. Quindi
\[
  E = P\,\Delta t = \SI{0,15}{\kilo\watt} \cdot \SI{10}{\hour} = \SI{1,5}{\kilo\watt\hour}
\]'''

  [[quesito.opzione]]
  testo = '''\SI{90}{\kilo\watt\hour}'''
  commento = '''Conta i minuti come se fossero ore: $0{,}15 \cdot 20 \cdot 30 = 90$. Venti minuti sono un terzo d'ora.'''
  [[quesito.opzione]]
  testo = '''\SI{1500}{\kilo\watt\hour}'''
  commento = '''Lascia la potenza in watt: $150 \cdot 10 = 1500$ sono wattora, cioè \SI{1,5}{\kilo\watt\hour}.'''
  [[quesito.opzione]]
  testo = '''\SI{0,05}{\kilo\watt\hour}'''
  commento = '''È l'energia di un solo giorno, $0{,}15 \cdot \frac13 = 0{,}05$: manca il fattore 30.'''
  [[quesito.opzione]]
  testo = '''\SI{1,5}{\kilo\watt\hour}'''
  valore = 1.5
  [[quesito.opzione]]
  testo = '''\SI{5,4e6}{\kilo\watt\hour}'''
  commento = '''Calcola bene l'energia in joule, $150 \cdot \SI{36000}{\second} = \SI{5,4e6}{\joule}$, ma la scrive in chilowattora. Un chilowattora vale \SI{3,6e6}{\joule}.'''

[[quesito]]
id = "ud6-corrente-tre"
tipo = "multipla"
testo = '''Due resistori da {{R}} sono collegati in parallelo, e il gruppo è collegato in serie a un terzo resistore, anch'esso da {{R}}. La resistenza equivalente dei tre resistori è'''
dati.R = { valore = 6, unita = "\\ohm" }
corretta = "B"
calcolo = "R / 2 + R"
soluzione = '''Prima il parallelo: due resistori uguali in parallelo valgono metà di uno, $6/2 = \SI{3}{\ohm}$. Poi la serie con il terzo:
\[
  R_{\text{eq}} = \SI{3}{\ohm} + \SI{6}{\ohm} = \SI{9}{\ohm}
\]'''

  [[quesito.opzione]]
  testo = '''\SI{18}{\ohm}'''
  commento = '''Mette tutti e tre i resistori in serie: $6 + 6 + 6 = 18$.'''
  [[quesito.opzione]]
  testo = '''\SI{9}{\ohm}'''
  valore = 9
  [[quesito.opzione]]
  testo = '''\SI{4}{\ohm}'''
  commento = '''Scambia serie e parallelo: due resistori in serie, \SI{12}{\ohm}, in parallelo con il terzo, $(12 \cdot 6)/(12 + 6) = 72/18 = 4$.'''
  [[quesito.opzione]]
  testo = '''\SI{2}{\ohm}'''
  commento = '''Mette tutti e tre i resistori in parallelo: tre resistori uguali in parallelo valgono un terzo di uno, $6/3 = 2$.'''
  [[quesito.opzione]]
  testo = '''\SI{3}{\ohm}'''
  commento = '''È la resistenza del solo parallelo: manca il terzo resistore, che è in serie e si somma.'''

[[quesito]]
id = "ud6-corrente-elettroni"
tipo = "multipla"
testo = '''Un elettrostimolatore fa passare negli elettrodi una corrente di {{I}}. Con $e = \SI{1,6e-19}{\coulomb}$, il numero di elettroni che attraversano ogni secondo una sezione del filo è circa'''
dati.I = { valore = "3,2", unita = "\\milli\\ampere" }
corretta = "C"
calcolo = "I * 1e-3 / e"
soluzione = '''In un secondo passa la carica $\Delta q = I\,\Delta t = \SI{3,2e-3}{\ampere} \cdot \SI{1}{\second} = \SI{3,2e-3}{\coulomb}$. Ogni elettrone porta la carica $e$ in modulo, quindi il numero di elettroni è
\[
  N = \frac{\Delta q}{e} = \frac{\SI{3,2e-3}{\coulomb}}{\SI{1,6e-19}{\coulomb}} = 2 \cdot 10^{-3-(-19)} = 2 \cdot 10^{16}
\]'''

  [[quesito.opzione]]
  testo = '''$2 \cdot 10^{19}$'''
  commento = '''Lascia la corrente in milliampere, come se valesse \SI{3,2}{\ampere}: $3{,}2/(1{,}6 \cdot 10^{-19}) = 2 \cdot 10^{19}$, mille volte troppo.'''
  [[quesito.opzione]]
  testo = '''$5{,}1 \cdot 10^{-22}$'''
  commento = '''Moltiplica la carica per $e$ invece di dividerla: $3{,}2 \cdot 10^{-3} \cdot 1{,}6 \cdot 10^{-19} \approx 5{,}1 \cdot 10^{-22}$. Un numero di elettroni più piccolo di uno non ha senso.'''
  [[quesito.opzione]]
  testo = '''$2 \cdot 10^{16}$'''
  valore = 2e16
  [[quesito.opzione]]
  testo = '''$2 \cdot 10^{13}$'''
  commento = '''Scambia milli con micro: $3{,}2 \cdot 10^{-6}/(1{,}6 \cdot 10^{-19}) = 2 \cdot 10^{13}$. Il prefisso milli vale $10^{-3}$.'''
  [[quesito.opzione]]
  testo = '''$5 \cdot 10^{-17}$'''
  commento = '''Rovescia il rapporto, $e/\Delta q = 1{,}6 \cdot 10^{-19}/(3{,}2 \cdot 10^{-3}) = 5 \cdot 10^{-17}$: un numero di elettroni deve essere grande, non minuscolo.'''

[[quesito]]
id = "ud6-corrente-microshock"
tipo = "multipla"
testo = '''Un paziente ha un catetere cardiaco collegato a un apparecchio elettrico. Rispetto a una persona che tocca lo stesso apparecchio con le mani, quale affermazione è corretta?'''
corretta = "E"
soluzione = '''Gli effetti dipendono dalla corrente che attraversa il cuore. Quando la corrente entra ed esce dalla pelle, la pelle aggiunge una grande resistenza e solo una piccola parte della corrente attraversa il cuore: per la fibrillazione servono circa \SI{100}{\milli\ampere}. Il catetere porta invece la corrente direttamente nel cuore, saltando la resistenza della pelle: bastano circa \SI{100}{\micro\ampere}, mille volte meno. È il microshock, e lo può provocare una differenza di potenziale di pochi decimi di volt, che con le mani nessuno sentirebbe.'''

  [[quesito.opzione]]
  testo = '''il pericolo è lo stesso, perché la differenza di potenziale dell'apparecchio è la stessa'''
  commento = '''Il pericolo dipende dalla corrente nel cuore, non dalla differenza di potenziale in sé. Con la stessa differenza di potenziale, il percorso attraverso il catetere ha una resistenza molto più piccola e porta tutta la corrente al cuore.'''
  [[quesito.opzione]]
  testo = '''il pericolo è maggiore perché il catetere aumenta la resistenza del percorso della corrente'''
  commento = '''Con una resistenza più grande la corrente sarebbe più piccola, e il pericolo minore. Il catetere fa il contrario: salta la resistenza della pelle.'''
  [[quesito.opzione]]
  testo = '''una differenza di potenziale di pochi decimi di volt non è pericolosa, perché nessuno la sente toccando l'apparecchio con le mani'''
  commento = '''Con le mani la pelle limita la corrente a valori che non si sentono; attraverso il catetere la stessa differenza di potenziale basta a superare la soglia del microshock, circa \SI{100}{\micro\ampere}.'''
  [[quesito.opzione]]
  testo = '''la pelle protegge comunque il cuore, perché ha una resistenza di circa \SI{100}{\kilo\ohm}'''
  commento = '''La resistenza della pelle protegge solo se la corrente la deve attraversare. Il catetere porta la corrente dentro il corpo, fino al cuore, senza passare dalla pelle.'''
  [[quesito.opzione]]
  testo = '''bastano correnti di circa \SI{100}{\micro\ampere} per la fibrillazione, perché il catetere porta la corrente direttamente nel cuore'''

[[quesito]]
id = "ud6-corrente-serie-parallelo"
tipo = "completamento"
testo = '''Due resistori uguali, collegati in serie a un generatore ideale, dissipano in tutto la potenza $P$. Se si collegano invece in parallelo allo stesso generatore, la potenza totale diventa $P$ moltiplicato per \completa.'''
calcolo = "(1 / 0.5) / (1 / 2)"
risposta = "4"
soluzione = '''Il generatore ideale tiene la stessa differenza di potenziale $V$ in tutti e due i casi, quindi conviene $P = V^{2}/R_{\text{eq}}$. Con due resistori uguali di resistenza $R$, in serie $R_{\text{eq}} = 2R$, in parallelo $R_{\text{eq}} = R/2$:
\[
  \frac{P'}{P} = \frac{V^{2}/(R/2)}{V^{2}/(2R)} = \frac{2R}{R/2} = 4
\]
La resistenza equivalente diventa quattro volte più piccola, e a parità di $V$ la potenza quattro volte più grande. Chi scrive $\frac14$ usa $P = RI^{2}$ come se la corrente restasse la stessa, ma cambiando la resistenza cambia anche la corrente; chi scrive 2 confronta il parallelo con un solo resistore invece che con la serie.'''

[[quesito]]
id = "ud6-corrente-quanti"
tipo = "completamento"
testo = '''Si collegano in parallelo $n$ resistori uguali, ciascuno da {{R}}, e la resistenza equivalente risulta {{Req}}. Il numero $n$ dei resistori è \completa.'''
dati.R = { valore = 60, unita = "\\ohm" }
dati.Req = { valore = 12, unita = "\\ohm" }
calcolo = "R / Req"
risposta = "5"
soluzione = '''In parallelo si sommano gli inversi delle resistenze. Con $n$ resistori uguali di resistenza $R$:
\[
  \frac{1}{R_{\text{eq}}} = \underbrace{\frac1R + \frac1R + \dots + \frac1R}_{n} = \frac{n}{R}
  \quad\Longrightarrow\quad
  R_{\text{eq}} = \frac{R}{n}
\]
Quindi $n = R/R_{\text{eq}} = 60/12 = 5$. Chi pensa alla serie cerca $n \cdot 60 = 12$ e non trova un numero intero: in serie la resistenza equivalente è più grande di ciascuna, mai più piccola.'''

[[quesito]]
id = "ud6-condensatori-distanza"
tipo = "multipla"
testo = '''Un condensatore piano viene caricato e poi staccato dal generatore. Poi si allontanano le armature fino a raddoppiarne la distanza. L'energia immagazzinata nel condensatore'''
corretta = "B"
soluzione = '''Il condensatore è staccato, quindi la carica $Q$ resta la stessa. La capacità $C = \varepsilon_0 A/d$ è inversamente proporzionale alla distanza: raddoppiando $d$ si dimezza. L'energia, scritta con la carica, è
\[
  U = \frac{Q^{2}}{2C}
\]
e con $Q$ fisso e $C$ dimezzata raddoppia. Lo stesso con $U = \frac12 QV$: la differenza di potenziale $V = Q/C$ raddoppia, e con lei l'energia. L'energia in più viene dal lavoro fatto per allontanare le armature, che si attraggono.'''

  [[quesito.opzione]]
  testo = '''si dimezza'''
  commento = '''Usa $U = \frac12 CV^{2}$ con $V$ fisso, come se il condensatore fosse ancora collegato al generatore: allora sì, l'energia si dimezzerebbe. Ma il condensatore è staccato: è la carica a restare fissa, e $V$ raddoppia.'''
  [[quesito.opzione]]
  testo = '''raddoppia'''
  [[quesito.opzione]]
  testo = '''resta la stessa'''
  commento = '''Pensa che, se la carica non cambia, non cambi neanche l'energia. Ma l'energia dipende anche dalla capacità, $U = Q^{2}/(2C)$, e la capacità si dimezza.'''
  [[quesito.opzione]]
  testo = '''diventa quattro volte più grande'''
  commento = '''Vede che $V = Q/C$ raddoppia e lo mette al quadrato in $\frac12 CV^{2}$, ma tiene $C$ fissa: $\frac12 C (2V)^{2} = 4U$. La capacità però si dimezza, e il risultato è $\frac12 \cdot \frac{C}{2} \cdot (2V)^{2} = 2U$.'''
  [[quesito.opzione]]
  testo = '''diventa quattro volte più piccola'''
  commento = '''Ragiona come con la legge di Coulomb, dove la forza cala con il quadrato della distanza, e applica lo stesso fattore 4 all'energia. Ma il campo fra le armature è uniforme e, a carica fissa, non dipende dalla distanza; a dipendere da $d$ è la capacità, in modo inverso e non con il quadrato.'''

[[quesito]]
id = "ud6-condensatori-tre-serie"
tipo = "multipla"
testo = '''Tre condensatori uguali, ciascuno di capacità {{C}}, sono collegati in serie. La capacità equivalente è'''
dati.C = { valore = 6, unita = "\\micro\\farad" }
corretta = "A"
calcolo = "1 / (3 / C)"
soluzione = '''In serie si sommano gli inversi delle capacità:
\[
  \frac{1}{C_\text{eq}} = \frac{1}{6} + \frac{1}{6} + \frac{1}{6} = \frac{3}{6} = \frac12
  \quad\Rightarrow\quad
  C_\text{eq} = \SI{2}{\micro\farad}
\]
Con $n$ condensatori uguali in serie la capacità diventa $n$ volte più piccola: è come allontanare le armature $n$ volte di più.'''

  [[quesito.opzione]]
  testo = '''\SI{2}{\micro\farad}'''
  valore = 2
  [[quesito.opzione]]
  testo = '''\SI{18}{\micro\farad}'''
  commento = '''Somma le capacità, $6 + 6 + 6 = 18$: è la regola del parallelo. Per i condensatori la somma diretta vale in parallelo, quella degli inversi in serie, al contrario dei resistori.'''
  [[quesito.opzione]]
  testo = '''\SI{3}{\micro\farad}'''
  commento = '''Usa la formula «prodotto diviso somma» su due condensatori soli, $6 \cdot 6/(6+6) = 3$, e si dimentica del terzo.'''
  [[quesito.opzione]]
  testo = '''\SI{0,5}{\micro\farad}'''
  commento = '''Somma gli inversi, $3/6 = 1/2$, ma si ferma lì: $1/2$ è $1/C_\text{eq}$, in \si{\per\micro\farad}, e va ancora invertito.'''
  [[quesito.opzione]]
  testo = '''\SI{0,056}{\micro\farad}'''
  commento = '''Mescola le due regole: somma le capacità, $6 + 6 + 6 = 18$, e poi prende l'inverso, $1/18 \approx 0{,}056$. In serie si sommano gli inversi, non le capacità.'''

[[quesito]]
id = "ud6-condensatori-carica-dielettrico"
tipo = "multipla"
testo = '''Un condensatore piano ha nel vuoto una capacità di {{C}} ed è collegato a un generatore da {{V}}. Senza staccarlo dal generatore, si riempie lo spazio fra le armature con un dielettrico di costante dielettrica relativa $\varepsilon_r = 3{,}0$. La carica su ciascuna armatura diventa'''
dati.C = { valore = "2,0", unita = "\\nano\\farad" }
dati.V = { valore = "9,0", unita = "\\volt" }
corretta = "D"
calcolo = "3.0 * C * V"
soluzione = '''Il dielettrico moltiplica la capacità per $\varepsilon_r$: $C' = 3{,}0 \cdot \SI{2,0}{\nano\farad} = \SI{6,0}{\nano\farad}$. Il generatore resta collegato, quindi la differenza di potenziale resta \SI{9,0}{\volt}, e la carica è
\[
  Q' = C' V = \SI{6,0}{\nano\farad} \cdot \SI{9,0}{\volt} = \SI{54}{\nano\coulomb}
\]
tre volte la carica di prima, \SI{18}{\nano\coulomb}: la carica in più la porta il generatore.'''

  [[quesito.opzione]]
  testo = '''\SI{18}{\nano\coulomb}'''
  commento = '''È la carica prima del dielettrico, $2{,}0 \cdot 9{,}0 = 18$. Resterebbe la stessa se il condensatore fosse staccato; collegato al generatore, a restare fissa è la differenza di potenziale, e la carica cresce con la capacità.'''
  [[quesito.opzione]]
  testo = '''\SI{6,0}{\nano\coulomb}'''
  commento = '''Divide la carica per $\varepsilon_r$, $18/3 = 6$, come se il dielettrico indebolisse la carica come indebolisce il campo. Il dielettrico invece fa crescere la capacità, e a parità di $V$ la carica.'''
  [[quesito.opzione]]
  testo = '''\SI{27}{\nano\coulomb}'''
  commento = '''Usa $\frac12 C'V$, confondendo la carica con la formula dell'energia: $\frac12 \cdot 6{,}0 \cdot 9{,}0 = 27$. La carica è $Q = CV$, senza il fattore $\frac12$.'''
  [[quesito.opzione]]
  testo = '''\SI{54}{\nano\coulomb}'''
  valore = 54
  [[quesito.opzione]]
  testo = '''\SI{162}{\nano\coulomb}'''
  commento = '''Moltiplica per $\varepsilon_r$ due volte, $18 \cdot 3 \cdot 3 = 162$, come se crescessero sia la capacità sia la differenza di potenziale. Il generatore collegato tiene $V$ fissa a \SI{9,0}{\volt}.'''

[[quesito]]
id = "ud6-condensatori-energia-parallelo"
tipo = "multipla"
testo = '''Due condensatori, da {{C1}} e da {{C2}}, sono collegati in parallelo a un generatore da {{V}}. L'energia immagazzinata in tutto nei due condensatori è'''
dati.C1 = { valore = 2, unita = "\\micro\\farad" }
dati.C2 = { valore = 3, unita = "\\micro\\farad" }
dati.V = { valore = 10, unita = "\\volt" }
corretta = "C"
calcolo = "0.5 * (C1 + C2) * 1e-6 * V**2"
soluzione = '''In parallelo le capacità si sommano: $C_\text{eq} = 2 + 3 = \SI{5}{\micro\farad} = \SI{5e-6}{\farad}$. Con $V^{2} = \SI{100}{\volt\squared}$:
\[
  U = \frac12\,C_\text{eq} V^{2} = \frac12 \cdot \SI{5e-6}{\farad} \cdot \SI{100}{\volt\squared} = 250 \cdot \SI{e-6}{\joule} = \SI{2,5e-4}{\joule}
\]'''

  [[quesito.opzione]]
  testo = '''\SI{5,0e-4}{\joule}'''
  commento = '''Dimentica il fattore $\frac12$: $C_\text{eq} V^{2} = \num{5e-6} \cdot 100 = \num{5e-4}$.'''
  [[quesito.opzione]]
  testo = '''\SI{6,0e-5}{\joule}'''
  commento = '''Calcola la capacità come in serie, $2 \cdot 3/(2+3) = \SI{1,2}{\micro\farad}$, e trova $\frac12 \cdot \num{1,2e-6} \cdot 100 = \num{6e-5}$. In parallelo le capacità si sommano.'''
  [[quesito.opzione]]
  testo = '''\SI{2,5e-4}{\joule}'''
  valore = 2.5e-4
  [[quesito.opzione]]
  testo = '''\SI{2,5e-5}{\joule}'''
  commento = '''Usa $\frac12 C V$ senza il quadrato: $\frac12 \cdot \num{5e-6} \cdot 10 = \num{2,5e-5}$. L'energia va con $V^{2}$.'''
  [[quesito.opzione]]
  testo = '''\SI{250}{\joule}'''
  commento = '''Lascia la capacità in microfarad, come se valesse \SI{5}{\farad}: $\frac12 \cdot 5 \cdot 100 = 250$, un milione di volte troppo.'''

[[quesito]]
id = "ud6-condensatori-energia-carica"
tipo = "completamento"
testo = '''Un condensatore da {{C}} porta su ciascuna armatura una carica di {{Q}}. L'energia immagazzinata nel condensatore vale \completa\ \si{\micro\joule}.'''
dati.C = { valore = 4, unita = "\\micro\\farad" }
dati.Q = { valore = 20, unita = "\\micro\\coulomb" }
calcolo = "(Q * 1e-6)**2 / (2 * C * 1e-6) * 1e6"
risposta = "50"
soluzione = '''Con la carica e la capacità conviene la forma $U = Q^{2}/(2C)$. Con $Q = \SI{2e-5}{\coulomb}$, $Q^{2} = \SI{4e-10}{\coulomb\squared}$, e $2C = \SI{8e-6}{\farad}$:
\[
  U = \frac{Q^{2}}{2C} = \frac{\num{4e-10}}{\num{8e-6}}\,\si{\joule} = 0{,}5 \cdot 10^{-10-(-6)}\,\si{\joule} = \SI{0,5e-4}{\joule} = \SI{50e-6}{\joule} = \SI{50}{\micro\joule}
\]
Lo stesso con $V = Q/C = 20/4 = \SI{5}{\volt}$ e $U = \frac12 QV = \frac12 \cdot \SI{20}{\micro\coulomb} \cdot \SI{5}{\volt} = \SI{50}{\micro\joule}$.'''

[[quesito]]
id = "ud6-condensatori-uguali"
tipo = "completamento"
testo = '''Due condensatori uguali, collegati in parallelo, hanno una capacità equivalente di {{Cp}}. Collegati in serie, gli stessi due condensatori hanno una capacità equivalente di \completa\ \si{\micro\farad}.'''
dati.Cp = { valore = 8, unita = "\\micro\\farad" }
calcolo = "(Cp / 2) / 2"
risposta = "2"
soluzione = '''In parallelo le capacità si sommano: $C + C = \SI{8}{\micro\farad}$, quindi ciascuno ha $C = \SI{4}{\micro\farad}$. In serie si sommano gli inversi: $1/C_\text{eq} = 1/4 + 1/4 = 1/2$, quindi $C_\text{eq} = \SI{2}{\micro\farad}$. Due condensatori uguali in serie hanno metà della capacità di ciascuno, in parallelo il doppio: il rapporto fra le due configurazioni è 4.'''

[[quesito]]
id = "ud6-magnetismo-campo-filo"
tipo = "multipla"
testo = '''Un filo rettilineo molto lungo è percorso da una corrente di {{I}}. Con $\mu_0 = 4\pi \cdot \SI{e-7}{\tesla\metre\per\ampere}$, cioè $\mu_0/2\pi = \SI{2e-7}{\tesla\metre\per\ampere}$, il modulo del campo magnetico a {{r}} dal filo è'''
dati.I = { valore = 5, unita = "\\ampere" }
dati.r = { valore = 1, unita = "cm" }
corretta = "E"
calcolo = "mu0su2pi * I / (r * 1e-2)"
soluzione = '''Per il campo di un filo rettilineo lungo, $B = \frac{\mu_0}{2\pi}\,\frac{I}{r}$, con la distanza in metri, $r = \SI{1}{\centi\metre} = \SI{e-2}{\metre}$:
\[
  B = \SI{2e-7}{\tesla\metre\per\ampere} \cdot \frac{\SI{5}{\ampere}}{\SI{e-2}{\metre}} = 10 \cdot 10^{-7-(-2)}\,\si{\tesla} = 10 \cdot 10^{-5}\,\si{\tesla} = \SI{e-4}{\tesla}
\]'''

  [[quesito.opzione]]
  testo = '''\SI{e-6}{\tesla}'''
  commento = '''Lascia la distanza in centimetri, $\num{2e-7} \cdot 5/1 = \num{e-6}$: il risultato è cento volte troppo piccolo.'''
  [[quesito.opzione]]
  testo = '''\SI{6,3e-4}{\tesla}'''
  commento = '''Usa $\mu_0$ al posto di $\mu_0/2\pi$, cioè $B = \mu_0 I/r = 4\pi \cdot \num{e-7} \cdot 5/\num{e-2} \approx \num{6,3e-4}$: dimentica il $2\pi$ al denominatore.'''
  [[quesito.opzione]]
  testo = '''\SI{e-2}{\tesla}'''
  commento = '''Divide per il quadrato della distanza, $\num{2e-7} \cdot 5/\num{e-4} = \num{e-2}$, come nella legge di Coulomb. Il campo di un filo va come $1/r$, non come $1/r^2$.'''
  [[quesito.opzione]]
  testo = '''\SI{e-8}{\tesla}'''
  commento = '''Moltiplica per la distanza invece di dividere, $\num{2e-7} \cdot 5 \cdot \num{e-2} = \num{e-8}$: così il campo crescerebbe allontanandosi dal filo.'''
  [[quesito.opzione]]
  testo = '''\SI{e-4}{\tesla}'''
  valore = 1e-4

[[quesito]]
id = "ud6-magnetismo-verso-indotta"
tipo = "multipla"
testo = '''Una spira circolare conduttrice giace nel piano del foglio, in un campo magnetico uniforme che entra nel foglio. L'intensità del campo diminuisce. Per chi guarda il foglio, la corrente indotta nella spira circola'''
corretta = "C"
soluzione = '''Il flusso attraverso la spira diminuisce. Per la legge di Lenz la corrente indotta produce un campo che si oppone alla diminuzione, cioè che cerca di mantenere il flusso: dentro la spira il suo campo entra nel foglio, come quello esterno. Per la regola della mano destra, con le dita che seguono la corrente e il pollice lungo il campo che essa produce dentro la spira, un pollice che entra nel foglio vuole una corrente in senso orario.'''

  [[quesito.opzione]]
  testo = '''in senso antiorario, perché il campo della corrente indotta è sempre opposto al campo esterno'''
  commento = '''Applica la legge di Lenz come se il campo indotto fosse sempre opposto a quello esterno. Si oppone alla \emph{variazione} del flusso: se il flusso diminuisce, il campo indotto è concorde con quello esterno.'''
  [[quesito.opzione]]
  testo = '''in nessun senso: in un campo uniforme non c'è corrente indotta'''
  commento = '''Confonde un campo uniforme, uguale in tutti i punti, con un campo costante nel tempo. Qui il campo diminuisce, il flusso cambia, e la corrente indotta c'è.'''
  [[quesito.opzione]]
  testo = '''in senso orario, e il suo campo dentro la spira entra nel foglio'''
  [[quesito.opzione]]
  testo = '''in senso orario, e il suo campo dentro la spira esce dal foglio'''
  commento = '''Il verso della corrente è giusto, ma la regola della mano destra è applicata al contrario: una corrente in senso orario produce dentro la spira un campo che entra nel foglio. Un campo che esce dal foglio, poi, si opporrebbe al campo esterno, mentre qui deve sostenerlo.'''
  [[quesito.opzione]]
  testo = '''in senso antiorario, e il suo campo dentro la spira entra nel foglio'''
  commento = '''Il campo indotto è quello giusto, concorde con il campo esterno che diminuisce, ma la regola della mano destra è applicata al contrario: un campo che entra nel foglio vuole una corrente oraria.'''

[[quesito]]
id = "ud6-magnetismo-ciclotrone-raddoppio"
tipo = "multipla"
testo = '''In un ciclotrone un protone percorre un'orbita di raggio \SI{10}{\centi\metre} con periodo $T$, in un campo magnetico uniforme perpendicolare alla sua velocità. Quando la sua velocità è raddoppiata, il raggio dell'orbita e il tempo di un giro sono'''
corretta = "A"
soluzione = '''Il raggio è $r = mv/(qB)$: è proporzionale alla velocità, e raddoppia, $r' = \SI{20}{\centi\metre}$. Il periodo è $T = 2\pi m/(qB)$, dove la velocità non compare: resta $T$. Il protone percorre una circonferenza due volte più lunga a velocità doppia, nello stesso tempo. È il principio su cui funziona il ciclotrone.'''

  [[quesito.opzione]]
  testo = '''\SI{20}{\centi\metre} e $T$'''
  [[quesito.opzione]]
  testo = '''\SI{20}{\centi\metre} e $2T$'''
  commento = '''Il raggio è giusto, ma fa crescere il periodo con la circonferenza e dimentica che anche la velocità è raddoppiata: $T = 2\pi r/v$ resta uguale.'''
  [[quesito.opzione]]
  testo = '''\SI{10}{\centi\metre} e $T/2$'''
  commento = '''Tratta l'orbita come una pista fissa, su cui un protone più veloce fa il giro in metà tempo. Il raggio dipende dalla velocità, $r = mv/(qB)$.'''
  [[quesito.opzione]]
  testo = '''\SI{40}{\centi\metre} e $T$'''
  commento = '''Lega il raggio all'energia cinetica, che quadruplica, invece che alla velocità: $r = mv/(qB)$ è proporzionale a $v$, non a $v^2$.'''
  [[quesito.opzione]]
  testo = '''\SI{5}{\centi\metre} e $T/4$'''
  commento = '''Rovescia la proporzionalità, come se un protone più veloce curvasse di più: $r = mv/(qB)$ cresce con la velocità. Con il raggio dimezzato e la velocità doppia, $T = 2\pi r/v$ diventerebbe davvero $T/4$, ma il punto di partenza è sbagliato.'''

[[quesito]]
id = "ud6-magnetismo-flusso-angolo"
tipo = "multipla"
testo = '''Una spira di area {{A}} si trova in un campo magnetico uniforme di {{B}}. Le linee del campo formano un angolo di \ang{60} con il piano della spira. Con $\cos\ang{30} \approx 0{,}87$ e $\cos\ang{60} = 0{,}5$, il flusso del campo magnetico attraverso la spira è'''
dati.A = { valore = 20, unita = "\\centi\\metre\\squared" }
dati.B = { valore = "0,50", unita = "\\tesla" }
corretta = "D"
calcolo = "B * A * 1e-4 * sin60"
soluzione = '''Nel flusso $\Phi = BA\cos\theta$ l'angolo è quello fra il campo e la normale alla spira. La normale è perpendicolare al piano, quindi un campo a \ang{60} dal piano è a $\theta = \ang{90} - \ang{60} = \ang{30}$ dalla normale. L'area in metri quadrati è $A = 20 \cdot \SI{e-4}{\metre\squared} = \SI{2,0e-3}{\metre\squared}$:
\[
  \Phi = BA\cos\ang{30} = \SI{0,50}{\tesla} \cdot \SI{2,0e-3}{\metre\squared} \cdot 0{,}87 = \num{1,0e-3} \cdot 0{,}87\,\si{\weber} = \SI{8,7e-4}{\weber}
\]'''

  [[quesito.opzione]]
  testo = '''\SI{5,0e-4}{\weber}'''
  commento = '''Usa l'angolo con il piano della spira, \ang{60}, invece di quello con la normale: $\num{1,0e-3} \cdot \cos\ang{60} = \num{5,0e-4}$.'''
  [[quesito.opzione]]
  testo = '''\SI{1,0e-3}{\weber}'''
  commento = '''Ignora l'angolo, come se il campo fosse perpendicolare alla spira: $BA = \num{1,0e-3}$ è il flusso massimo.'''
  [[quesito.opzione]]
  testo = '''\SI{8,7}{\weber}'''
  commento = '''Lascia l'area in centimetri quadrati, $0{,}50 \cdot 20 \cdot 0{,}87 = 8{,}7$: diecimila volte troppo.'''
  [[quesito.opzione]]
  testo = '''\SI{8,7e-4}{\weber}'''
  valore = 8.7e-4
  [[quesito.opzione]]
  testo = '''\SI{8,7e-2}{\weber}'''
  commento = '''Converte i centimetri quadrati con $10^{-2}$, come se fossero centimetri: $\SI{1}{\centi\metre\squared} = (\SI{e-2}{\metre})^2 = \SI{e-4}{\metre\squared}$, e il risultato è cento volte troppo grande.'''

[[quesito]]
id = "ud6-magnetismo-tms"
tipo = "multipla"
testo = '''Nella stimolazione magnetica transcranica un impulso fa crescere il campo magnetico in una zona della corteccia da zero a {{B}} in {{t}}. Il campo è perpendicolare a un anello di tessuto cerebrale di area {{A}}. Il modulo della forza elettromotrice media indotta lungo l'anello è'''
dati.B = { valore = "2,0", unita = "\\tesla" }
dati.t = { valore = "0,20", unita = "\\milli\\second" }
dati.A = { valore = "2,0", unita = "\\centi\\metre\\squared" }
corretta = "B"
calcolo = "B * A * 1e-4 / (t * 1e-3)"
soluzione = '''Si portano i dati in unità del SI: $A = \SI{2,0e-4}{\metre\squared}$, $\Delta t = \SI{0,20e-3}{\second} = \SI{2,0e-4}{\second}$. Il flusso passa da zero a $BA = 2{,}0 \cdot \num{2,0e-4}\,\si{\weber} = \SI{4,0e-4}{\weber}$, e per la legge di Faraday-Neumann-Lenz
\[
  |\mathcal E| = \frac{|\Delta\Phi|}{\Delta t} = \frac{\SI{4,0e-4}{\weber}}{\SI{2,0e-4}{\second}} = \SI{2,0}{\volt}
\]
Abbastanza per depolarizzare i neuroni dell'anello.'''

  [[quesito.opzione]]
  testo = '''\SI{2,0e-3}{\volt}'''
  commento = '''Lascia il tempo in millisecondi, come se fosse \SI{0,20}{\second}: $\num{4,0e-4}/0{,}20 = \num{2,0e-3}$, mille volte troppo poco.'''
  [[quesito.opzione]]
  testo = '''\SI{2,0}{\volt}'''
  valore = 2.0
  [[quesito.opzione]]
  testo = '''\SI{2,0e4}{\volt}'''
  commento = '''Lascia l'area in centimetri quadrati: $2{,}0 \cdot 2{,}0/\num{2,0e-4} = \num{2,0e4}$, diecimila volte troppo.'''
  [[quesito.opzione]]
  testo = '''\SI{1,0e4}{\volt}'''
  commento = '''Calcola solo la rapidità con cui cambia il campo, $\Delta B/\Delta t = 2{,}0/\num{2,0e-4} = \SI{1,0e4}{\tesla\per\second}$, e dimentica l'area: la fem dipende dalla variazione del flusso, $\Delta B \cdot A$.'''
  [[quesito.opzione]]
  testo = '''\SI{8,0e-8}{\volt}'''
  commento = '''Moltiplica la variazione di flusso per il tempo invece di dividerla: $\num{4,0e-4} \cdot \num{2,0e-4} = \num{8,0e-8}$. Un impulso più breve darebbe una fem più piccola, al contrario di quello che succede.'''

[[quesito]]
id = "ud6-magnetismo-corrente-solenoide"
tipo = "completamento"
testo = '''Un solenoide da laboratorio ha {{n}} spire per metro di lunghezza. Con $\mu_0 = 4\pi \cdot \SI{e-7}{\tesla\metre\per\ampere}$, per produrre al suo interno un campo di $4\pi \cdot \SI{e-3}{\tesla}$ serve una corrente di \completa\ \si{\ampere}.'''
dati.n = { valore = 2000, unita = "\\per\\metre" }
calcolo = "4 * math.pi * 1e-3 / (4 * math.pi * 1e-7 * n)"
risposta = "5"
soluzione = '''Dal campo del solenoide, $B = \mu_0 n I$, si ricava $I = B/(\mu_0 n)$. Il fattore $4\pi$ si semplifica:
\[
  I = \frac{4\pi \cdot \SI{e-3}{\tesla}}{4\pi \cdot \SI{e-7}{\tesla\metre\per\ampere} \cdot \SI{2000}{\per\metre}} = \frac{10^{-3-(-7)}}{2000}\,\si{\ampere} = \frac{10^{4}}{2000}\,\si{\ampere} = \SI{5}{\ampere}
\]
Chi scrive $2 \cdot 10^{7}$ moltiplica per $n$ invece di dividere ($10^4 \cdot 2000$).'''

[[quesito]]
id = "ud6-magnetismo-alternatore"
tipo = "completamento"
testo = '''Un alternatore produce la corrente alternata della rete elettrica, a {{f}}: la sua bobina compie 50 giri al secondo in un campo magnetico. La forza elettromotrice indotta nella bobina cambia verso \completa\ volte al secondo.'''
dati.f = { valore = 50, unita = "Hz" }
calcolo = "2 * f"
risposta = "100"
soluzione = '''Mentre la bobina ruota, il flusso attraverso di essa aumenta e diminuisce, e la fem indotta cambia verso a ogni mezzo giro. In un giro cambia verso due volte; in un secondo, con 50 giri, $2 \cdot 50 = 100$ volte. Chi scrive 50 conta un cambio di verso per giro.'''

[[quesito]]
id = "ud6-magnetismo-corrente-spira"
tipo = "completamento"
testo = '''Il flusso del campo magnetico attraverso una spira di resistenza {{R}} diminuisce in modo uniforme di {{dPhi}} in {{t}}. La corrente indotta nella spira vale \completa\ \si{\ampere}.'''
dati.R = { valore = "0,50", unita = "\\ohm" }
dati.dPhi = { valore = "3,0e-3", unita = "\\weber" }
dati.t = { valore = "2,0", unita = "\\milli\\second" }
calcolo = "dPhi / (t * 1e-3) / R"
risposta = "3"
soluzione = '''Il tempo in secondi è $\Delta t = \SI{2,0e-3}{\second}$. La fem indotta è
\[
  |\mathcal E| = \frac{|\Delta\Phi|}{\Delta t} = \frac{\SI{3,0e-3}{\weber}}{\SI{2,0e-3}{\second}} = \SI{1,5}{\volt}
\]
e la corrente $I = |\mathcal E|/R = \SI{1,5}{\volt}/\SI{0,50}{\ohm} = \SI{3}{\ampere}$. Chi scrive 0,75 moltiplica per la resistenza invece di dividere ($1{,}5 \cdot 0{,}50$); chi scrive 0,003 lascia il tempo in millisecondi ($\num{3,0e-3}/2{,}0/0{,}50$).'''

# ==================================================================== quesiti lampo, in ordine di dispensa

[[quesito]]
id = "ud6-coulomb"
tipo = "completamento"
lampo = true
testo = '''Due cariche puntiformi si attraggono con una forza di modulo $F$. Se una delle due cariche raddoppia e la distanza fra loro si dimezza, il modulo della forza diventa $F$ moltiplicato per \completa.'''
calcolo = "2 / 0.5**2"
risposta = "8"
soluzione = '''Per la legge di Coulomb, $F = k\,|q_1 q_2|/r^{2}$: la forza è direttamente proporzionale a ciascuna carica e inversamente proporzionale al \emph{quadrato} della distanza. I due cambiamenti si contano separatamente e poi si moltiplicano:
\begin{itemize}
  \item la carica raddoppia: la forza si moltiplica per 2;
  \item la distanza diventa $r/2$, quindi $r^{2}$ diventa $r^{2}/4$: la forza si moltiplica per 4.
\end{itemize}
\[
  \frac{F'}{F} = \frac{2\,q_1 q_2/(r/2)^{2}}{q_1 q_2/r^{2}} = 2 \cdot \frac{r^{2}}{r^{2}/4} = 2 \cdot 4 = 8
\]
Chi scrive 4 dimentica il quadrato della distanza ($2 \cdot 2$); chi scrive 0,5 tratta la forza come proporzionale a $r^{2}$ invece che a $1/r^{2}$ ($2 \cdot 1/4$).'''

[[quesito]]
id = "ud6-campo"
tipo = "multipla"
lampo = true
testo = '''Due cariche puntiformi, $+q$ e $-q$ con $q = {{q}}$, sono ferme nel vuoto a {{d}} l'una dall'altra. Con $k = \SI{9e9}{\newton\metre\squared\per\coulomb\squared}$, il modulo del campo elettrico nel punto medio del segmento che le unisce è'''
dati.q = { valore = 4, unita = "\\nano\\coulomb" }
dati.d = { valore = 20, unita = "cm" }
corretta = "C"
calcolo = "2 * k * q * 1e-9 / (d / 2 * 1e-2)**2"
soluzione = '''Il punto medio dista $r = \SI{10}{\centi\metre} = \SI{0,10}{\metre}$ da ciascuna carica, e le due cariche hanno lo stesso modulo: i due campi hanno lo stesso modulo,
\[
  E_1 = E_2 = k\,\frac{q}{r^{2}} = \SI{9e9}{\newton\metre\squared\per\coulomb\squared} \cdot \frac{\SI{4e-9}{\coulomb}}{(\SI{0,10}{\metre})^{2}} = \frac{36}{0{,}01}\,\si{\newton\per\coulomb} = \SI{3600}{\newton\per\coulomb}
\]
Il campo di $+q$ punta lontano da $+q$, cioè verso $-q$; il campo di $-q$ punta verso $-q$. Nel punto medio i due campi hanno quindi la stessa direzione e lo stesso verso, e si sommano:
\[
  E = E_1 + E_2 = 3600 + 3600 = \SI{7200}{\newton\per\coulomb}
\]'''

  [[quesito.opzione]]
  testo = '''zero'''
  commento = '''Pensa che i campi di due cariche opposte si annullino. Si annullerebbero i campi di due cariche \emph{uguali}; qui il campo di $+q$ e quello di $-q$ puntano entrambi verso $-q$. È nullo il potenziale nel punto medio, non il campo.'''
  [[quesito.opzione]]
  testo = '''\SI{1800}{\newton\per\coulomb}'''
  commento = '''Usa come distanza i \SI{20}{\centi\metre} fra le cariche invece dei \SI{10}{\centi\metre} fra ciascuna carica e il punto medio: ogni campo viene \SI{900}{\newton\per\coulomb}, quattro volte troppo piccolo.'''
  [[quesito.opzione]]
  testo = '''\SI{7200}{\newton\per\coulomb}'''
  valore = 7200
  [[quesito.opzione]]
  testo = '''\SI{3600}{\newton\per\coulomb}'''
  commento = '''È il campo di una sola carica: manca il contributo dell'altra, che ha lo stesso modulo e lo stesso verso.'''
  [[quesito.opzione]]
  testo = '''\SI{720}{\newton\per\coulomb}'''
  commento = '''Divide per la distanza invece che per il suo quadrato: $2 \cdot 36/0{,}1 = 720$. Il campo di una carica puntiforme va con $1/r^{2}$.'''

[[quesito]]
id = "ud6-piastre"
tipo = "multipla"
lampo = true
testo = '''Due piastre metalliche parallele distano {{d}} e fra loro c'è una differenza di potenziale di {{V}}. Il modulo del campo elettrico, uniforme, fra le piastre è'''
dati.d = { valore = 3, unita = "mm" }
dati.V = { valore = 12, unita = "\\volt" }
corretta = "A"
calcolo = "V / (d * 1e-3)"
soluzione = '''In un campo uniforme la differenza di potenziale è il campo per la distanza, $\Delta V = E\,d$. La distanza va in metri, $d = \SI{3}{\milli\metre} = \SI{3e-3}{\metre}$:
\[
  E = \frac{\Delta V}{d} = \frac{\SI{12}{\volt}}{\SI{3e-3}{\metre}} = 4 \cdot 10^{3}\,\si{\volt\per\metre} = \SI{4000}{\volt\per\metre}
\]'''

  [[quesito.opzione]]
  testo = '''\SI{4000}{\volt\per\metre}'''
  valore = 4000
  [[quesito.opzione]]
  testo = '''\SI{4}{\volt\per\metre}'''
  commento = '''Divide per 3 senza portare i millimetri in metri: $12/3 = 4$ è il campo in volt al millimetro, non al metro.'''
  [[quesito.opzione]]
  testo = '''\SI{36}{\volt\per\metre}'''
  commento = '''Moltiplica la differenza di potenziale per la distanza, e per di più in millimetri. Il campo è $\Delta V/d$: più vicine sono le piastre, più il campo è intenso.'''
  [[quesito.opzione]]
  testo = '''\SI{0,036}{\volt\per\metre}'''
  commento = '''Moltiplica la differenza di potenziale per la distanza in metri, $12 \cdot 0{,}003$: il prodotto $\Delta V \cdot d$ non ha le unità di un campo.'''
  [[quesito.opzione]]
  testo = '''\SI{2,5e-4}{\volt\per\metre}'''
  commento = '''Rovescia il rapporto, $d/\Delta V = 0{,}003/12$: il risultato non ha nemmeno le unità di un campo.'''

[[quesito]]
id = "ud6-membrana"
tipo = "completamento"
lampo = true
testo = '''Fra l'interno e l'esterno di un neurone a riposo c'è una differenza di potenziale di {{V}} in modulo. Uno ione calcio $\mathrm{Ca^{2+}}$, di carica $+2e$, attraversa la membrana. La sua energia potenziale elettrica cambia, in modulo, di \completa{} elettronvolt.'''
dati.V = { valore = 70, unita = "\\milli\\volt" }
calcolo = "2 * V * 1e-3"
risposta = "0,14"
soluzione = '''La variazione di energia potenziale è la carica per la differenza di potenziale, $\Delta U = q\,\Delta V$. Un elettronvolt è l'energia che guadagna o perde la carica $e$ attraversando \SI{1}{\volt}; con la carica in multipli di $e$ e la differenza di potenziale in volt, il prodotto è già in elettronvolt. Qui $q = 2e$ e $\Delta V = \SI{70}{\milli\volt} = \SI{0,070}{\volt}$:
\[
  |\Delta U| = 2e \cdot \SI{0,070}{\volt} = \SI{0,14}{\electronvolt}
\]
In joule sono $0{,}14 \cdot \SI{1,6e-19}{\joule} \approx \SI{2,2e-20}{\joule}$. Chi scrive 0,07 dimentica che lo ione calcio ha due cariche elementari; chi scrive 140 lascia la differenza di potenziale in millivolt, e trova il risultato in millielettronvolt.'''

[[quesito]]
id = "ud6-induzione"
tipo = "multipla"
lampo = true
testo = '''Si avvicina una bacchetta carica positivamente a una sfera metallica scarica, sostenuta da un supporto isolante, senza toccarla. Con la bacchetta ancora vicina si collega la sfera a terra con un filo; poi si stacca il filo e solo alla fine si allontana la bacchetta. Alla fine la sfera è'''
corretta = "E"
soluzione = '''Nella sfera metallica gli elettroni sono liberi di muoversi. La bacchetta positiva li attira sul lato vicino, e il lato lontano resta positivo: è l'induzione elettrostatica. Collegando la sfera a terra, altri elettroni salgono dalla terra, attirati dalla bacchetta. Quando si stacca il filo questi elettroni in più restano intrappolati sulla sfera, e quando si allontana la bacchetta si distribuiscono su tutta la superficie. La sfera resta carica negativamente: la carica per induzione ha segno opposto a quello della bacchetta.'''

  [[quesito.opzione]]
  testo = '''scarica, perché la bacchetta non l'ha mai toccata'''
  commento = '''Varrebbe senza il filo a terra: allora le cariche separate si ricombinerebbero allontanando la bacchetta. Con il filo, invece, la sfera riceve elettroni dalla terra.'''
  [[quesito.opzione]]
  testo = '''carica positivamente, come la bacchetta'''
  commento = '''È quello che succede per contatto, quando la bacchetta cede parte della sua carica. Per induzione la carica ha segno opposto a quello della bacchetta.'''
  [[quesito.opzione]]
  testo = '''positiva sul lato lontano e negativa sul lato vicino, con carica totale nulla'''
  commento = '''Descrive la sfera isolata con la bacchetta vicina, prima del collegamento a terra. Il filo cambia la carica totale, e allontanando la bacchetta la carica si distribuisce su tutta la sfera.'''
  [[quesito.opzione]]
  testo = '''carica negativamente finché la bacchetta è vicina, poi di nuovo scarica'''
  commento = '''Gli elettroni arrivati dalla terra non possono più andarsene, perché il filo è stato staccato prima di allontanare la bacchetta: la carica resta.'''
  [[quesito.opzione]]
  testo = '''carica negativamente'''

[[quesito]]
id = "ud6-joule"
tipo = "completamento"
lampo = true
testo = '''Un resistore da {{R}} è attraversato da una corrente di {{I}}. La potenza che dissipa per effetto Joule, in watt, è \completa.'''
dati.R = { valore = 20, unita = "\\ohm" }
dati.I = { valore = 3, unita = "\\ampere" }
calcolo = "R * I**2"
risposta = "180"
soluzione = '''La potenza dissipata è $P = VI$, e con la legge di Ohm, $V = RI$, diventa $P = RI^{2}$:
\[
  P = R I^{2} = \SI{20}{\ohm} \cdot (\SI{3}{\ampere})^{2} = 20 \cdot 9\,\si{\watt} = \SI{180}{\watt}
\]
Chi scrive 60 ha calcolato $RI = \SI{60}{\volt}$, che è la differenza di potenziale ai capi del resistore, non la potenza.'''

[[quesito]]
id = "ud6-parallelo"
tipo = "multipla"
lampo = true
testo = '''Due resistori da {{R1}} e da {{R2}} sono collegati in parallelo. La resistenza equivalente è'''
dati.R1 = { valore = 6, unita = "\\ohm" }
dati.R2 = { valore = 3, unita = "\\ohm" }
corretta = "D"
calcolo = "R1 * R2 / (R1 + R2)"
soluzione = '''In parallelo si sommano gli inversi delle resistenze:
\[
  \frac{1}{R_{\text{eq}}} = \frac{1}{6\,\Omega} + \frac{1}{3\,\Omega} = \frac{1}{6\,\Omega} + \frac{2}{6\,\Omega} = \frac{3}{6\,\Omega} = \frac{1}{2\,\Omega}
  \quad\Longrightarrow\quad
  R_{\text{eq}} = \SI{2}{\ohm}
\]
Lo stesso con il prodotto diviso la somma: $R_{\text{eq}} = (6 \cdot 3)/(6 + 3) = 18/9 = \SI{2}{\ohm}$. È meno della più piccola delle due, come deve essere in parallelo.'''

  [[quesito.opzione]]
  testo = '''\SI{9}{\ohm}'''
  commento = '''Somma le resistenze: è la regola del collegamento in serie.'''
  [[quesito.opzione]]
  testo = '''\SI{4,5}{\ohm}'''
  commento = '''Fa la media delle due resistenze. In parallelo la resistenza equivalente è più piccola di ciascuna delle due, non intermedia.'''
  [[quesito.opzione]]
  testo = '''\SI{0,5}{\ohm}'''
  commento = '''Si ferma a $1/6 + 1/3 = 0{,}5$ e dimentica di invertire: 0,5 è $1/R_{\text{eq}}$, in $\Omega^{-1}$.'''
  [[quesito.opzione]]
  testo = '''\SI{2}{\ohm}'''
  valore = 2
  [[quesito.opzione]]
  testo = '''\SI{18}{\ohm}'''
  commento = '''Calcola il prodotto delle resistenze e dimentica di dividerlo per la somma; per di più il prodotto ha le unità di $\Omega^{2}$.'''

[[quesito]]
id = "ud6-dielettrico"
tipo = "completamento"
lampo = true
testo = '''Un condensatore piano ha nel vuoto una capacità di {{C}}. Si dimezza la distanza fra le armature e si riempie lo spazio fra loro con un dielettrico di costante dielettrica relativa $\varepsilon_r = 3$. La nuova capacità, in picofarad, è \completa.'''
dati.C = { valore = 10, unita = "\\pico\\farad" }
calcolo = "C * 2 * 3"
risposta = "60"
soluzione = '''La capacità del condensatore piano è $C = \varepsilon_r \varepsilon_0 A/d$: è direttamente proporzionale a $\varepsilon_r$ e inversamente proporzionale alla distanza $d$. Dimezzare $d$ raddoppia la capacità; il dielettrico la moltiplica per 3:
\[
  C' = C \cdot 2 \cdot 3 = \SI{10}{\pico\farad} \cdot 6 = \SI{60}{\pico\farad}
\]
Chi scrive 15 pensa che la capacità cresca con la distanza ($10 \cdot 3/2$); chi scrive 30 dimentica l'effetto della distanza, chi scrive 20 quello del dielettrico.'''

[[quesito]]
id = "ud6-defibrillatore"
tipo = "multipla"
lampo = true
testo = '''Il condensatore di un defibrillatore ha una capacità di {{C}} ed è caricato a una differenza di potenziale di {{V}}. L'energia immagazzinata nel condensatore è'''
dati.C = { valore = 50, unita = "\\micro\\farad" }
dati.V = { valore = 2000, unita = "\\volt" }
corretta = "B"
calcolo = "0.5 * C * 1e-6 * V**2"
soluzione = '''L'energia di un condensatore carico è $U = \frac12 C V^{2}$, con la capacità in farad, $C = \SI{50}{\micro\farad} = \SI{5e-5}{\farad}$, e $V^{2} = (\num{2e3})^{2} = \num{4e6}\,\si{\volt\squared}$:
\[
  U = \frac12 \cdot \SI{5e-5}{\farad} \cdot \num{4e6}\,\si{\volt\squared} = \frac12 \cdot 5 \cdot 4 \cdot 10^{-5+6}\,\si{\joule} = 10 \cdot 10\,\si{\joule} = \SI{100}{\joule}
\]'''

  [[quesito.opzione]]
  testo = '''\SI{0,05}{\joule}'''
  commento = '''Usa $\frac12 CV$ invece di $\frac12 CV^{2}$: $\frac12 \cdot \num{5e-5} \cdot 2000 = 0{,}05$. Il prodotto $CV$ è una carica, non un'energia.'''
  [[quesito.opzione]]
  testo = '''\SI{100}{\joule}'''
  valore = 100
  [[quesito.opzione]]
  testo = '''\SI{200}{\joule}'''
  commento = '''Dimentica il fattore $\frac12$: $CV^{2} = \SI{200}{\joule}$. Il fattore viene dal fatto che, durante la carica, la differenza di potenziale cresce da zero a $V$.'''
  [[quesito.opzione]]
  testo = '''\SI{0,1}{\joule}'''
  commento = '''Calcola $CV = \SI{0,1}{\coulomb}$, che è la carica sulle armature, e la scrive in joule.'''
  [[quesito.opzione]]
  testo = '''\SI{1e8}{\joule}'''
  commento = '''Lascia la capacità in microfarad, come se valesse \SI{50}{\farad}: $\frac12 \cdot 50 \cdot \num{4e6} = \num{1e8}$, un milione di volte troppo.'''

[[quesito]]
id = "ud6-lorentz"
tipo = "multipla"
lampo = true
testo = '''Gli assi $x$, $y$, $z$ formano una terna destrorsa ($\hat\imath \times \hat\jmath = \hat k$). Un elettrone si muove nel verso positivo dell'asse $x$ in un campo magnetico uniforme diretto nel verso positivo dell'asse $y$. La forza magnetica sull'elettrone è'''
corretta = "D"
soluzione = '''La forza di Lorentz è $\vec F = q\,\vec v \times \vec B$. Con $\vec v$ lungo $+x$ e $\vec B$ lungo $+y$, il prodotto vettoriale $\vec v \times \vec B$ è diretto come $\hat\imath \times \hat\jmath = \hat k$, cioè lungo $+z$ (regola della mano destra: pollice lungo $\vec v$, indice lungo $\vec B$, il medio indica $+z$). La carica dell'elettrone è negativa, $q = -e$, quindi la forza ha verso opposto: lungo $-z$. Il suo modulo non è nullo, perché $\vec v$ e $\vec B$ sono perpendicolari.'''

  [[quesito.opzione]]
  testo = '''diretta lungo $+z$'''
  commento = '''È il verso giusto per una carica positiva. L'elettrone ha carica negativa, e la forza ha il verso opposto a quello di $\vec v \times \vec B$.'''
  [[quesito.opzione]]
  testo = '''diretta lungo $+x$'''
  commento = '''Mette la forza lungo la velocità. La forza di Lorentz è sempre perpendicolare alla velocità: cambia la direzione del moto, non il modulo della velocità.'''
  [[quesito.opzione]]
  testo = '''diretta lungo $+y$'''
  commento = '''Mette la forza lungo il campo magnetico, come si fa con il campo elettrico. La forza magnetica è perpendicolare sia a $\vec v$ sia a $\vec B$.'''
  [[quesito.opzione]]
  testo = '''diretta lungo $-z$'''
  [[quesito.opzione]]
  testo = '''nulla'''
  commento = '''La forza è nulla quando la velocità è \emph{parallela} al campo, $\sin\theta = 0$. Qui velocità e campo sono perpendicolari, e la forza ha il modulo massimo, $evB$.'''

[[quesito]]
id = "ud6-raggio"
tipo = "completamento"
lampo = true
testo = '''Un protone percorre una circonferenza di raggio {{r}} in un campo magnetico uniforme perpendicolare alla sua velocità. Se la velocità del protone raddoppia e il campo magnetico triplica, il nuovo raggio, in centimetri, è \completa.'''
dati.r = { valore = 6, unita = "cm" }
calcolo = "r * 2 / 3"
risposta = "4"
soluzione = '''Il raggio dell'orbita è $r = mv/(qB)$: direttamente proporzionale alla velocità, inversamente proporzionale al campo. La velocità che raddoppia moltiplica il raggio per 2, il campo che triplica lo divide per 3:
\[
  r' = r \cdot \frac{2}{3} = \SI{6}{\centi\metre} \cdot \frac23 = \SI{4}{\centi\metre}
\]
Chi scrive 9 rovescia le proporzionalità ($6 \cdot 3/2$); chi scrive 36 tratta il raggio come proporzionale sia a $v$ sia a $B$ ($6 \cdot 2 \cdot 3$).'''

[[quesito]]
id = "ud6-faraday"
tipo = "multipla"
lampo = true
testo = '''Una bobina di {{N}} spire, ciascuna di area {{A}}, è perpendicolare a un campo magnetico uniforme, che cresce da zero a {{B}} in {{t}}. Il modulo della forza elettromotrice media indotta nella bobina è'''
dati.N = { valore = 100 }
dati.A = { valore = 10, unita = "\\centi\\metre\\squared" }
dati.B = { valore = "0,4", unita = "\\tesla" }
dati.t = { valore = "0,02", unita = "\\second" }
corretta = "A"
calcolo = "N * B * A * 1e-4 / t"
soluzione = '''Per la legge di Faraday-Neumann-Lenz, in modulo $|\mathcal E| = N\,|\Delta\Phi|/\Delta t$. Il campo è perpendicolare alle spire, quindi il flusso in una spira è $\Phi = BA$. L'area va in metri quadrati, $A = \SI{10}{\centi\metre\squared} = 10 \cdot \SI{e-4}{\metre\squared} = \SI{e-3}{\metre\squared}$, e il flusso in una spira passa da zero a
\[
  \Phi = BA = \SI{0,4}{\tesla} \cdot \SI{e-3}{\metre\squared} = \SI{4e-4}{\weber}
\]
\[
  |\mathcal E| = N\,\frac{|\Delta\Phi|}{\Delta t} = 100 \cdot \frac{\SI{4e-4}{\weber}}{\SI{0,02}{\second}} = \frac{\SI{4e-2}{\weber}}{\SI{2e-2}{\second}} = \SI{2}{\volt}
\]'''

  [[quesito.opzione]]
  testo = '''\SI{2}{\volt}'''
  valore = 2
  [[quesito.opzione]]
  testo = '''\SI{0,02}{\volt}'''
  commento = '''Dimentica il numero di spire: è la forza elettromotrice di una spira sola. Le 100 spire sono in serie, e le loro forze elettromotrici si sommano.'''
  [[quesito.opzione]]
  testo = '''\SI{2e4}{\volt}'''
  commento = '''Lascia l'area in centimetri quadrati, $100 \cdot 0{,}4 \cdot 10/0{,}02 = \num{2e4}$: il risultato è diecimila volte troppo grande.'''
  [[quesito.opzione]]
  testo = '''\SI{0,04}{\volt}'''
  commento = '''Calcola la variazione di flusso totale, $N\,\Delta\Phi = \SI{0,04}{\weber}$, e dimentica di dividerla per il tempo. Conta la rapidità con cui il flusso cambia.'''
  [[quesito.opzione]]
  testo = '''\SI{8e-4}{\volt}'''
  commento = '''Moltiplica la variazione di flusso per il tempo invece di dividerla: $100 \cdot \num{4e-4} \cdot 0{,}02 = \num{8e-4}$. Una variazione più rapida darebbe una forza elettromotrice più piccola, al contrario di quello che succede.'''
