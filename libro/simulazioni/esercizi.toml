tipo = "multipla"
testo = '''Quale coppia fra una regione dello spettro elettromagnetico e un suo uso in medicina è corretta?'''
corretta = "C"
soluzione = '''La termografia misura la radiazione infrarossa emessa dalla pelle. Le altre coppie sono sbagliate: la risonanza magnetica usa onde radio, la mammografia raggi X, il saturimetro luce rossa e infrarosso, le lampade germicide ultravioletto.'''

  [[quesito.opzione]]
  testo = '''ultravioletto e risonanza magnetica'''
  commento = '''La risonanza magnetica usa onde radio, all'altro capo dello spettro rispetto all'ultravioletto.'''
  [[quesito.opzione]]
  testo = '''microonde e mammografia'''
  commento = '''La mammografia è una radiografia: usa raggi X, che attraversano i tessuti. Le microonde si usano per scaldarli, nella diatermia.'''
  [[quesito.opzione]]
  testo = '''infrarosso e termografia'''
  [[quesito.opzione]]
  testo = '''raggi $\gamma$ e saturimetro'''
  commento = '''Il saturimetro usa un LED rosso e uno infrarosso, radiazioni non ionizzanti. I raggi $\gamma$ si usano in medicina nucleare e in radioterapia.'''
  [[quesito.opzione]]
  testo = '''onde radio e lampade germicide'''
