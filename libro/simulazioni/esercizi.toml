[[quesito]]
id = "sim2-ud7-lente-sole"
simulazione = 2
ud = 7
tipo = "multipla"
testo = '''Una lente convergente da occhiali, di potere diottrico \SI{5}{D}, tenuta al sole concentra la luce in un punto luminoso. A che distanza dalla lente si trova quel punto?'''
corretta = "B"
calcolo = "1 / 5 * 100"
soluzione = '''Il Sole è un oggetto molto lontano: i suoi raggi arrivano paralleli all'asse e la lente ne forma l'immagine nel fuoco, $q = f$. La distanza focale è l'inverso del potere diottrico, in metri:
\[
  f = \frac{1}{D} = \frac{1}{\SI{5}{D}} = \SI{0,2}{\metre} = \SI{20}{\centi\metre}
\]'''

  [[quesito.opzione]]
  testo = '''\SI{40}{\centi\metre}'''
  commento = '''Mette l'immagine in $2f$, come per un oggetto che si trova in $2f$. Per un oggetto molto lontano l'immagine è nel fuoco.'''
  [[quesito.opzione]]
  testo = '''\SI{20}{\centi\metre}'''
  valore = 20
  [[quesito.opzione]]
  testo = '''\SI{5}{\metre}'''
  commento = '''Prende il potere diottrico come distanza focale: la focale è il suo inverso, $f = 1/D$.'''
  [[quesito.opzione]]
  testo = '''\SI{2}{\centi\metre}'''
  commento = '''Trova $f = \SI{0,2}{\metre}$ ma sbaglia la conversione: un metro è \SI{100}{\centi\metre}, quindi \SI{0,2}{\metre} sono \SI{20}{\centi\metre}.'''
  [[quesito.opzione]]
  testo = '''la lente non forma l'immagine di un oggetto così lontano'''
  commento = '''Confonde l'oggetto all'infinito con l'oggetto nel fuoco: è un oggetto nel fuoco che dà l'immagine all'infinito. Un oggetto all'infinito ha l'immagine nel fuoco.'''

[[quesito]]
id = "sim2-ud5-carnot-ceduto"
simulazione = 2
ud = 5
tipo = "completamento"
testo = '''Una macchina di Carnot lavora fra una sorgente calda a \SI{227}{\celsius} e una sorgente fredda a \SI{27}{\celsius}. In ogni ciclo assorbe \SI{900}{\joule} dalla sorgente calda. Il calore che cede in ogni ciclo alla sorgente fredda vale \completa\ \si{\joule}.'''
calcolo = "900 * (27 + 273) / (227 + 273)"
risposta = "540"
soluzione = '''Per il ciclo di Carnot il rapporto fra i calori è il rapporto fra le temperature assolute, $|Q_f|/Q_c = T_f/T_c$, con $T_c = 227 + 273 = \SI{500}{\kelvin}$ e $T_f = 27 + 273 = \SI{300}{\kelvin}$:
\[
  |Q_f| = Q_c\,\frac{T_f}{T_c} = \SI{900}{\joule} \cdot \frac{300}{500} = \SI{900}{\joule} \cdot \frac35 = \SI{540}{\joule}
\]
Il lavoro di un ciclo è $900 - 540 = \SI{360}{\joule}$, e il rendimento $360/900 = 40\%$. Chi scrive 360 ha calcolato il lavoro invece del calore ceduto.'''

[[quesito]]
id = "sim2-ud7-fotoni-stessa-potenza"
simulazione = 2
ud = 7
tipo = "completamento"
testo = '''Due lampade emettono la stessa potenza: una lampada a ultravioletti per la fototerapia della pelle, con lunghezza d'onda di \SI{300}{\nano\metre}, e una lampada arancione, con lunghezza d'onda di \SI{600}{\nano\metre}. Il numero di fotoni emessi in un secondo dalla lampada arancione è \completa\ volte quello della lampada a ultravioletti.'''
calcolo = "600 / 300"
risposta = "2"
soluzione = '''Il numero di fotoni al secondo è la potenza divisa per l'energia di un fotone, $N = P/E$, e l'energia è $E = hc/\lambda$: quindi $N = P\lambda/(hc)$, proporzionale a $\lambda$ a parità di potenza. Il rapporto è
\[
  \frac{N_{\text{arancione}}}{N_{\text{UV}}} = \frac{\lambda_{\text{arancione}}}{\lambda_{\text{UV}}} = \frac{\SI{600}{\nano\metre}}{\SI{300}{\nano\metre}} = 2
\]
Ogni fotone arancione porta metà dell'energia di un fotone ultravioletto, e per avere la stessa potenza ne servono il doppio.'''

[[quesito]]
id = "sim3-ud5-bombole-avogadro"
simulazione = 3
ud = 5
tipo = "multipla"
testo = '''Due bombole uguali sono alla stessa pressione e alla stessa temperatura. Una contiene ossigeno, $\mathrm{O_2}$, con massa molare \SI{32}{\gram\per\mole}; l'altra azoto, $\mathrm{N_2}$, con massa molare \SI{28}{\gram\per\mole}. Trattando i due gas come gas perfetti, le bombole contengono'''
corretta = "D"
soluzione = '''Dall'equazione di stato, $n = pV/(RT)$: con $p$, $V$ e $T$ uguali il numero di moli è lo stesso, qualunque sia il gas. Lo stesso numero di moli vuol dire lo stesso numero di molecole, $N = n N_A$. La massa invece è $n$ per la massa molare: la bombola di ossigeno pesa di più, nel rapporto $32/28$.'''

  [[quesito.opzione]]
  testo = '''più molecole di ossigeno, che ha la massa molare più grande'''
  commento = '''Fa entrare la massa molare nell'equazione di stato: $pV = nRT$ dà il numero di moli, che non dipende da quale gas c'è.'''
  [[quesito.opzione]]
  testo = '''più molecole di azoto, perché le sue molecole sono più leggere'''
  commento = '''Pensa che molecole più leggere ci stiano in numero maggiore. Per un gas perfetto la massa delle molecole non conta: a parità di $p$, $V$ e $T$ il numero di molecole è lo stesso.'''
  [[quesito.opzione]]
  testo = '''la stessa massa di gas'''
  commento = '''Confonde il numero di moli con la massa: le moli sono le stesse, ma una mole di ossigeno ha massa \SI{32}{\gram} e una di azoto \SI{28}{\gram}.'''
  [[quesito.opzione]]
  testo = '''lo stesso numero di molecole, ma masse di gas diverse'''
  [[quesito.opzione]]
  testo = '''quantità di gas che non si possono confrontare senza conoscere il volume delle bombole'''
  commento = '''Le bombole sono uguali, quindi il volume è lo stesso: nel confronto $V$ si semplifica, come $p$ e $T$.'''

[[quesito]]
id = "sim3-ud5-panno-ghiaccio"
simulazione = 3
ud = 5
tipo = "multipla"
testo = '''Una borsa del ghiaccio a \SI{0}{\celsius} è appoggiata sulla coscia di un atleta, separata dalla pelle da un panno di cotone spesso \SI{5}{\milli\metre}, con conducibilità termica \SI{0,05}{\watt\per\metre\per\kelvin}. La superficie di contatto è di \SI{200}{\centi\metre\squared} e la pelle sotto il panno è a \SI{30}{\celsius}. La potenza che attraversa il panno per conduzione è circa'''
corretta = "E"
calcolo = "0.05 * 0.02 * 30 / 0.005"
soluzione = '''Si portano le grandezze nel SI: $A = \SI{200}{\centi\metre\squared} = 200 \cdot \SI{e-4}{\metre\squared} = \SI{0,02}{\metre\squared}$, $d = \SI{5}{\milli\metre} = \SI{0,005}{\metre}$, $T_1 - T_2 = 30 - 0 = \SI{30}{\kelvin}$. Con la legge di Fourier:
\[
  P = k A\,\frac{T_1 - T_2}{d} = 0{,}05 \cdot 0{,}02 \cdot \frac{30}{0{,}005}\,\si{\watt} = \num{e-3} \cdot \num{6e3}\,\si{\watt} = \SI{6}{\watt}
\]
dove $0{,}05 \cdot 0{,}02 = \num{e-3}$ e $30/0{,}005 = 30 \cdot 200 = \num{6000}$.'''

  [[quesito.opzione]]
  testo = '''\SI{1,5e-4}{\watt}'''
  commento = '''Moltiplica per lo spessore invece di dividere: $0{,}05 \cdot 0{,}02 \cdot 30 \cdot 0{,}005 = \num{1,5e-4}$. Uno strato più spesso fa passare meno calore.'''
  [[quesito.opzione]]
  testo = '''\SI{6e-3}{\watt}'''
  commento = '''Lascia lo spessore in millimetri: $0{,}05 \cdot 0{,}02 \cdot 30/5 = \num{6e-3}$, mille volte troppo poco.'''
  [[quesito.opzione]]
  testo = '''circa \SI{61}{\watt}'''
  commento = '''Usa la temperatura della pelle in kelvin, \SI{303}{\kelvin}, invece della differenza di temperatura, \SI{30}{\kelvin}: $0{,}05 \cdot 0{,}02 \cdot 303/0{,}005 \approx 61$.'''
  [[quesito.opzione]]
  testo = '''\SI{6e4}{\watt}'''
  commento = '''Lascia l'area in centimetri quadrati: $0{,}05 \cdot 200 \cdot 30/0{,}005 = \num{6e4}$. Un centimetro quadrato è \SI{e-4}{\metre\squared}.'''
  [[quesito.opzione]]
  testo = '''\SI{6}{\watt}'''
  valore = 6

[[quesito]]
id = "sim3-ud5-tre-espansioni"
simulazione = 3
ud = 5
tipo = "multipla"
testo = '''Tre campioni uguali di gas perfetto partono dallo stesso stato e si espandono in modo reversibile fino allo stesso volume finale: il primo con un'isobara, il secondo con un'isoterma, il terzo con un'adiabatica. Come stanno fra loro i lavori $W$ compiuti dal gas?'''
corretta = "C"
soluzione = '''Il lavoro è l'area sotto la curva nel piano $pV$, fra lo stesso volume iniziale e lo stesso volume finale. L'isobara resta alla pressione iniziale, e la sua curva sta sopra le altre. L'isoterma scende, perché il volume aumenta. L'adiabatica scende ancora più ripida, perché il gas intanto si raffredda. Quindi $W_{\text{isobara}} > W_{\text{isoterma}} > W_{\text{adiabatica}}$.'''

  [[quesito.opzione]]
  testo = '''sono uguali, perché la variazione di volume è la stessa'''
  commento = '''Usa $W = p\,\Delta V$ come se la pressione fosse la stessa in tutti e tre i casi. Il lavoro è l'area sotto la curva, e dipende da come la pressione cambia lungo la trasformazione.'''
  [[quesito.opzione]]
  testo = '''$W_{\text{adiabatica}} > W_{\text{isoterma}} > W_{\text{isobara}}$'''
  commento = '''Rovescia l'ordine delle curve: la curva che sta più in alto nel piano $pV$, l'isobara, ha sotto di sé l'area più grande.'''
  [[quesito.opzione]]
  testo = '''$W_{\text{isobara}} > W_{\text{isoterma}} > W_{\text{adiabatica}}$'''
  [[quesito.opzione]]
  testo = '''$W_{\text{isoterma}} > W_{\text{isobara}} > W_{\text{adiabatica}}$'''
  commento = '''Pensa che l'isoterma dia più lavoro perché tutto il calore assorbito diventa lavoro. Ma nell'isoterma la pressione scende, mentre nell'isobara resta al valore iniziale: l'area sotto l'isobara è più grande.'''
  [[quesito.opzione]]
  testo = '''$W_{\text{isobara}} > W_{\text{adiabatica}} > W_{\text{isoterma}}$'''
  commento = '''Scambia l'isoterma e l'adiabatica: l'adiabatica scende più ripida dell'isoterma, quindi sta sotto e ha sotto di sé meno area.'''

[[quesito]]
id = "sim3-ud5-entropia-stanza"
simulazione = 3
ud = 5
tipo = "multipla"
testo = '''Un adulto a riposo cede all'aria della stanza circa \SI{100}{\watt} di calore. L'aria è a \SI{27}{\celsius} e la sua temperatura non cambia. In un minuto la variazione di entropia dell'aria è circa'''
corretta = "B"
calcolo = "100 * 60 / (27 + 273)"
soluzione = '''In un minuto l'aria riceve $Q = P\,\Delta t = \SI{100}{\joule\per\second} \cdot \SI{60}{\second} = \SI{6000}{\joule}$, alla temperatura costante $T = 27 + 273 = \SI{300}{\kelvin}$. La sua entropia aumenta di
\[
  \Delta S = \frac{Q}{T} = \frac{\SI{6000}{\joule}}{\SI{300}{\kelvin}} = \SI{20}{\joule\per\kelvin}
\]'''

  [[quesito.opzione]]
  testo = '''\SI{222}{\joule\per\kelvin}'''
  commento = '''Usa la temperatura in gradi Celsius: $6000/27 \approx 222$. In $\Delta S = Q/T$ la temperatura va in kelvin.'''
  [[quesito.opzione]]
  testo = '''\SI{20}{\joule\per\kelvin}'''
  valore = 20
  [[quesito.opzione]]
  testo = '''\SI{-20}{\joule\per\kelvin}'''
  commento = '''Sbaglia il segno: il calore esce dal corpo ma entra nell'aria, quindi per l'aria $Q > 0$ e la sua entropia aumenta.'''
  [[quesito.opzione]]
  testo = '''\SI{0,33}{\joule\per\kelvin}'''
  commento = '''Calcola l'aumento in un secondo, $100/300 \approx 0{,}33$, e dimentica di moltiplicare per i 60 secondi di un minuto.'''
  [[quesito.opzione]]
  testo = '''\SI{0,05}{\joule\per\kelvin}'''
  commento = '''Rovescia il rapporto: $T/Q = 300/6000 = 0{,}05$ invece di $Q/T$.'''

[[quesito]]
id = "sim3-ud7-ionizzante-frequenza"
simulazione = 3
ud = 7
tipo = "multipla"
testo = '''Una radiazione elettromagnetica ha frequenza \SI{3,0e16}{\hertz}. Per ionizzare una molecola biologica serve un'energia di circa \SI{10}{\electronvolt}. La radiazione è ionizzante? ($h \approx \SI{6,6e-34}{\joule\second}$, $\SI{1}{\electronvolt} \approx \SI{1,6e-19}{\joule}$)'''
corretta = "A"
calcolo = "h * 3.0e16 / eV"
soluzione = '''L'energia di un fotone è
\[
  E = hf = \SI{6,6e-34}{\joule\second} \cdot \SI{3,0e16}{\hertz} = 19{,}8 \cdot 10^{-34+16}\,\si{\joule} = \SI{1,98e-17}{\joule}
\]
In elettronvolt: $E = \num{1,98e-17}/\num{1,6e-19}\,\si{\electronvolt} \approx 1{,}24 \cdot 10^{-17+19}\,\si{\electronvolt} \approx \SI{120}{\electronvolt}$. È più dei circa \SI{10}{\electronvolt} che servono: la radiazione è ionizzante. Infatti $\lambda = c/f = \num{3e8}/\num{3,0e16}\,\si{\metre} = \SI{e-8}{\metre} = \SI{10}{\nano\metre}$, al confine fra ultravioletto e raggi X.'''

  [[quesito.opzione]]
  testo = '''sì: ogni fotone ha circa \SI{120}{\electronvolt}'''
  valore = 123.75
  [[quesito.opzione]]
  testo = '''no: è un'onda radio, con lunghezza d'onda di circa \SI{e8}{\metre}'''
  commento = '''Rovescia la formula della lunghezza d'onda: $f/c = \num{3,0e16}/\num{3e8} = \num{e8}$. La lunghezza d'onda è $\lambda = c/f = \SI{e-8}{\metre}$.'''
  [[quesito.opzione]]
  testo = '''no: è infrarosso, con lunghezza d'onda di circa \SI{10}{\micro\metre}'''
  commento = '''Sbaglia l'esponente in $\lambda = c/f$: $10^{8-16} = 10^{-8}$, cioè $\lambda = \SI{10}{\nano\metre}$, non $10^{-5}$.'''
  [[quesito.opzione]]
  testo = '''sì, ma solo se il fascio è abbastanza intenso'''
  commento = '''Conta l'energia del singolo fotone, non l'intensità del fascio: se un fotone basta a ionizzare, la radiazione è ionizzante anche con un fascio debole.'''
  [[quesito.opzione]]
  testo = '''no: ogni fotone ha circa \SI{2e-17}{\electronvolt}'''
  commento = '''Dimentica di convertire: $hf = \num{1,98e-17}$ è in joule, e va diviso per \SI{1,6e-19}{\joule\per\electronvolt}.'''

[[quesito]]
id = "sim3-ud7-catena-torio"
simulazione = 3
ud = 7
tipo = "multipla"
testo = '''Nella catena radioattiva del torio, il nucleo $\nuclide{232}{90}{Th}$ emette una particella $\alpha$ e poi, uno dopo l'altro, due elettroni $\beta^-$. Quale nucleo si forma alla fine?'''
corretta = "C"
soluzione = '''Il decadimento $\alpha$ toglie 4 al numero di massa e 2 al numero atomico; ogni decadimento $\beta^-$ lascia invariato il numero di massa e aggiunge 1 al numero atomico, perché un neutrone diventa protone. Alla fine:
\[
  A = 232 - 4 = 228 \qquad\qquad Z = 90 - 2 + 1 + 1 = 90
\]
Con $Z = 90$ è ancora torio: $\nuclide{228}{90}{Th}$, un altro isotopo dello stesso elemento.'''

  [[quesito.opzione]]
  testo = '''$\nuclide{228}{88}{Ra}$'''
  commento = '''Conta solo il decadimento $\alpha$ e dimentica i due $\beta^-$, che riportano il numero atomico da 88 a 90.'''
  [[quesito.opzione]]
  testo = '''$\nuclide{228}{86}{Rn}$'''
  commento = '''Fa togliere un protone a ogni $\beta^-$: nel $\beta^-$ un neutrone diventa protone, e il numero atomico aumenta di 1.'''
  [[quesito.opzione]]
  testo = '''$\nuclide{228}{90}{Th}$'''
  [[quesito.opzione]]
  testo = '''$\nuclide{230}{90}{Th}$'''
  commento = '''Toglie 2 al numero di massa nel decadimento $\alpha$: la particella $\alpha$ contiene 4 nucleoni, 2 protoni e 2 neutroni.'''
  [[quesito.opzione]]
  testo = '''$\nuclide{228}{92}{U}$'''
  commento = '''Conta i due $\beta^-$, che aggiungono 2 al numero atomico, ma dimentica che la particella $\alpha$ ne porta via 2.'''

[[quesito]]
id = "sim3-ud5-sudore-grammi"
simulazione = 3
ud = 5
tipo = "completamento"
testo = '''Un atleta ha una massa di \SI{72}{\kilo\gram}; il calore specifico medio del corpo è \SI{3,5}{\kilo\joule\per\kilo\gram\per\kelvin} e il calore latente di evaporazione del sudore \SI{2400}{\kilo\joule\per\kilo\gram}. Perché la temperatura del suo corpo scenda di \SI{1}{\celsius} solo grazie al sudore, deve evaporarne \completa\ \si{\gram}.'''
calcolo = "72 * 3.5 * 1 / 2400 * 1000"
risposta = "105"
soluzione = '''Per raffreddare il corpo di \SI{1}{\kelvin} bisogna togliergli $Q = m c\,\Delta T = 72 \cdot 3{,}5 \cdot 1\,\si{\kilo\joule} = \SI{252}{\kilo\joule}$. Il sudore che evapora toglie $L$ per ogni chilogrammo, quindi ne serve
\[
  m_s = \frac{Q}{L} = \frac{\SI{252}{\kilo\joule}}{\SI{2400}{\kilo\joule\per\kilo\gram}} = \SI{0,105}{\kilo\gram} = \SI{105}{\gram}
\]
dove $252/2400 = 2{,}52/24 = 0{,}105$.'''

[[quesito]]
id = "sim3-ud7-specchietto"
simulazione = 3
ud = 7
tipo = "completamento"
testo = '''Un raggio di luce arriva sullo specchietto del dentista formando un angolo di \ang{20} con la superficie dello specchio. L'angolo fra il raggio incidente e il raggio riflesso vale \completa\ gradi.'''
calcolo = "2 * (90 - 20)"
risposta = "140"
soluzione = '''Gli angoli si misurano dalla normale, perpendicolare allo specchio. Se il raggio forma \ang{20} con la superficie, l'angolo di incidenza è $\theta_1 = \ang{90} - \ang{20} = \ang{70}$. Per la legge della riflessione anche l'angolo di riflessione è \ang{70}, dall'altra parte della normale. L'angolo fra i due raggi è la somma, $\ang{70} + \ang{70} = \ang{140}$. Chi scrive 40 ha misurato gli angoli dalla superficie invece che dalla normale.'''

[[quesito]]
id = "sim1-ud6-elettrone-protone"
simulazione = 1
ud = 6
tipo = "multipla"
testo = '''Un elettrone e un protone sono lasciati fermi, nel vuoto, nello stesso campo elettrico uniforme. La massa del protone è circa 1800 volte quella dell'elettrone, e il peso è trascurabile. Appena lasciate libere, le due particelle'''
corretta = "C"
soluzione = '''Le due cariche hanno lo stesso modulo $e$ e segni opposti: le forze $\vec F = q\vec E$ hanno lo stesso modulo $eE$ e versi opposti, quella sul protone nel verso del campo, quella sull'elettrone nel verso opposto. Le accelerazioni sono $a = eE/m$: a parità di forza, l'elettrone, circa 1800 volte meno massiccio, accelera circa 1800 volte di più.'''

  [[quesito.opzione]]
  testo = '''risentono della stessa forza, nello stesso verso, e hanno la stessa accelerazione'''
  commento = '''Dimentica sia il segno delle cariche, che rende le forze opposte, sia la differenza di massa, che rende diverse le accelerazioni.'''
  [[quesito.opzione]]
  testo = '''risentono di forze con lo stesso modulo e versi opposti, e hanno accelerazioni con lo stesso modulo'''
  commento = '''Le forze sono giuste, ma stessa forza non vuol dire stessa accelerazione: $a = F/m$, e le masse sono molto diverse.'''
  [[quesito.opzione]]
  testo = '''risentono di forze con lo stesso modulo e versi opposti, e l'accelerazione dell'elettrone è circa 1800 volte più grande'''
  [[quesito.opzione]]
  testo = '''risentono di forze con versi opposti, e la forza sull'elettrone è circa 1800 volte più grande'''
  commento = '''Confonde la forza con l'accelerazione: la forza $eE$ dipende dalla carica, che è la stessa in modulo, non dalla massa.'''
  [[quesito.opzione]]
  testo = '''risentono di forze con lo stesso modulo e versi opposti, e l'accelerazione del protone è circa 1800 volte più grande'''
  commento = '''Rovescia il ruolo della massa: con $a = F/m$ accelera di più la particella più leggera, cioè l'elettrone.'''

[[quesito]]
id = "sim1-ud6-filo-stirato"
simulazione = 1
ud = 6
tipo = "multipla"
testo = '''Un filo metallico per elettrodi ha resistenza $R$. Lo si stira in modo uniforme fino a raddoppiarne la lunghezza, senza cambiare il volume del metallo. La nuova resistenza è'''
corretta = "B"
calcolo = "2 / (1 / 2)"
soluzione = '''Il volume del filo è $A L$, e resta lo stesso: se la lunghezza raddoppia, la sezione si dimezza. Per la seconda legge di Ohm
\[
  R' = \rho\,\frac{2L}{A/2} = 4\,\rho\,\frac{L}{A} = 4R
\]'''

  [[quesito.opzione]]
  testo = '''$2R$'''
  commento = '''Tiene conto della lunghezza doppia ma dimentica che, a volume costante, la sezione si dimezza.'''
  [[quesito.opzione]]
  testo = '''$4R$'''
  valore = 4
  [[quesito.opzione]]
  testo = '''$R$'''
  commento = '''Pensa che la sezione dimezzata compensi la lunghezza doppia: ma una sezione più piccola fa crescere la resistenza, non calare.'''
  [[quesito.opzione]]
  testo = '''$8R$'''
  commento = '''Dimezza il diametro invece dell'area, $A' = A/4$, e trova $2 \cdot 4 = 8$. A volume costante è l'area a dimezzarsi.'''
  [[quesito.opzione]]
  testo = '''$R/4$'''
  commento = '''Rovescia la seconda legge di Ohm, come se fosse $R \propto A/L$: $(1/2)/2 = 1/4$.'''

[[quesito]]
id = "sim1-ud6-mezzo-giro"
simulazione = 1
ud = 6
tipo = "multipla"
testo = '''Un protone entra in un campo magnetico uniforme con velocità perpendicolare al campo, e vi percorre mezzo giro di circonferenza. Durante il mezzo giro'''
corretta = "D"
soluzione = '''La forza di Lorentz è sempre perpendicolare alla velocità, quindi non compie lavoro: l'energia cinetica e il modulo della velocità restano costanti. La forza però curva la traiettoria, e dopo mezzo giro il protone si muove in verso opposto a quello iniziale.'''

  [[quesito.opzione]]
  testo = '''il modulo della velocità cresce, perché la forza di Lorentz accelera il protone'''
  commento = '''L'accelerazione c'è, ma è centripeta: cambia la direzione della velocità, non il suo modulo.'''
  [[quesito.opzione]]
  testo = '''il modulo della velocità cala, perché il campo magnetico frena il protone'''
  commento = '''Per frenare il protone la forza dovrebbe avere una componente opposta alla velocità; la forza di Lorentz è perpendicolare alla velocità e non compie lavoro.'''
  [[quesito.opzione]]
  testo = '''la velocità resta la stessa in modulo, direzione e verso'''
  commento = '''Vale per il modulo, ma una forza perpendicolare alla velocità curva la traiettoria: la direzione cambia di continuo.'''
  [[quesito.opzione]]
  testo = '''il modulo della velocità resta lo stesso, e alla fine la velocità ha verso opposto a quello iniziale'''
  [[quesito.opzione]]
  testo = '''il protone prosegue in linea retta, perché il campo magnetico non agisce sulle cariche'''
  commento = '''Il campo magnetico non agisce sulle cariche ferme o che si muovono lungo il campo; su una carica che si muove perpendicolarmente al campo la forza è massima.'''

[[quesito]]
id = "sim1-ud6-carica-defibrillatore"
simulazione = 1
ud = 6
tipo = "multipla"
testo = '''Il condensatore di un defibrillatore ha una capacità di {{C}} e deve immagazzinare un'energia di {{U}}. A quale differenza di potenziale va caricato?'''
dati.C = { valore = 200, unita = "\\micro\\farad" }
dati.U = { valore = 100, unita = "\\joule" }
corretta = "A"
calcolo = "math.sqrt(2 * U / (C * 1e-6))"
soluzione = '''Da $U = \frac12 C V^2$ si ricava $V^2 = 2U/C$. Con $C = \SI{200}{\micro\farad} = \SI{2e-4}{\farad}$:
\[
  V^2 = \frac{2 \cdot \SI{100}{\joule}}{\SI{2e-4}{\farad}} = \frac{200}{2} \cdot 10^{4}\,\si{\volt\squared} = \SI{e6}{\volt\squared}
  \qquad
  V = \sqrt{10^{6}}\,\si{\volt} = \SI{1000}{\volt}
\]'''

  [[quesito.opzione]]
  testo = '''\SI{1000}{\volt}'''
  valore = 1000
  [[quesito.opzione]]
  testo = '''circa \SI{710}{\volt}'''
  commento = '''Dimentica il fattore $\frac12$: $V = \sqrt{U/C} = \sqrt{\num{5e5}}\,\si{\volt} \approx \SI{710}{\volt}$.'''
  [[quesito.opzione]]
  testo = '''\SI{1e6}{\volt}'''
  commento = '''Trova $V^2 = \SI{e6}{\volt\squared}$ e si ferma lì, senza estrarre la radice.'''
  [[quesito.opzione]]
  testo = '''circa \SI{32}{\volt}'''
  commento = '''Traduce micro con $10^{-3}$: con $C = \SI{0,2}{\farad}$, $V^2 = 200/0{,}2 = 1000$ e $V \approx \SI{32}{\volt}$.'''
  [[quesito.opzione]]
  testo = '''\SI{5e5}{\volt}'''
  commento = '''Usa $U = CV$, senza il $\frac12$ e senza il quadrato: $V = U/C = 100/\num{2e-4}\,\si{\volt} = \SI{5e5}{\volt}$.'''

[[quesito]]
id = "sim1-ud6-protone-sale"
simulazione = 1
ud = 6
tipo = "completamento"
testo = '''Un protone ha un'energia cinetica di {{K}} e, sotto la sola forza elettrica, va da un punto $A$ a un punto $B$ il cui potenziale è più alto di {{dV}}. In $B$ la sua energia cinetica vale \completa\ \si{\electronvolt}.'''
dati.K = { valore = 300, unita = "\\electronvolt" }
dati.dV = { valore = 100, unita = "\\volt" }
calcolo = "K - dV"
risposta = "200"
soluzione = '''L'energia potenziale del protone cambia di $\Delta U = e\,\Delta V = e \cdot \SI{100}{\volt} = \SI{+100}{\electronvolt}$: un protone che sale di potenziale guadagna energia potenziale. Per la conservazione dell'energia la stessa quantità si toglie all'energia cinetica: $K_B = \SI{300}{\electronvolt} - \SI{100}{\electronvolt} = \SI{200}{\electronvolt}$.'''

[[quesito]]
id = "sim1-ud6-spira-schiacciata"
simulazione = 1
ud = 6
tipo = "completamento"
testo = '''Una spira quadrata di filo flessibile, di lato {{l}}, è perpendicolare a un campo magnetico uniforme di {{B}}. In {{t}} la spira viene schiacciata fino ad avere area nulla. Il modulo della forza elettromotrice media indotta vale \completa\ \si{\milli\volt}.'''
dati.l = { valore = 10, unita = "\\centi\\metre" }
dati.B = { valore = "0,40", unita = "\\tesla" }
dati.t = { valore = "0,050", unita = "\\second" }
calcolo = "B * (l * 1e-2)**2 / t * 1e3"
risposta = "80"
soluzione = '''L'area iniziale è $A = (\SI{0,10}{\metre})^2 = \SI{e-2}{\metre\squared}$, e il flusso passa da $BA = 0{,}40 \cdot 10^{-2}\,\si{\weber} = \SI{4,0e-3}{\weber}$ a zero. Per la legge di Faraday-Neumann-Lenz
\[
  |\mathcal E| = \frac{|\Delta\Phi|}{\Delta t} = \frac{\SI{4,0e-3}{\weber}}{\SI{5,0e-2}{\second}} = 0{,}80 \cdot 10^{-3+2}\,\si{\volt} = \SI{0,080}{\volt} = \SI{80}{\milli\volt}
\]
Qui il flusso cambia perché cambia l'area, non il campo.'''

[[quesito]]
id = "sim2-ud6-acqua-sale"
simulazione = 2
ud = 6
tipo = "multipla"
testo = '''Nel cristallo di sale da cucina gli ioni $\mathrm{Na^{+}}$ e $\mathrm{Cl^{-}}$ sono tenuti insieme dall'attrazione elettrica, eppure l'acqua scioglie bene il sale. Il motivo principale è che'''
corretta = "E"
soluzione = '''L'acqua è un dielettrico con costante dielettrica relativa $\varepsilon_r \approx 80$. Le sue molecole, che sono dipoli, si orientano nel campo degli ioni e ne riducono il campo: la forza di Coulomb fra gli ioni diventa circa 80 volte più debole, e l'agitazione termica basta a separarli.'''

  [[quesito.opzione]]
  testo = '''l'acqua è un conduttore, e annulla le cariche degli ioni'''
  commento = '''L'acqua pura conduce pochissimo, e la carica si conserva: in soluzione lo ione sodio resta $\mathrm{Na^{+}}$.'''
  [[quesito.opzione]]
  testo = '''le molecole d'acqua hanno una carica netta, che neutralizza quella degli ioni'''
  commento = '''Le molecole d'acqua sono neutre: hanno la carica negativa spostata da un lato, cioè sono dipoli, ma la loro carica totale è zero.'''
  [[quesito.opzione]]
  testo = '''in acqua la carica elementare diventa circa 80 volte più piccola'''
  commento = '''La carica degli ioni non cambia, è sempre un multiplo di $e$: è la forza fra gli ioni a diventare più piccola.'''
  [[quesito.opzione]]
  testo = '''in acqua la forza di Coulomb diventa circa 80 volte più grande, e strappa gli ioni dal cristallo'''
  commento = '''Rovescia l'effetto del dielettrico: la forza va divisa per $\varepsilon_r$, non moltiplicata. Una forza più grande, del resto, terrebbe gli ioni più uniti.'''
  [[quesito.opzione]]
  testo = '''le molecole d'acqua si polarizzano e rendono l'attrazione fra gli ioni circa 80 volte più debole'''

[[quesito]]
id = "sim2-ud6-partitore"
simulazione = 2
ud = 6
tipo = "multipla"
testo = '''Due resistori, $R_1 = {{R1}}$ e $R_2 = {{R2}}$, sono collegati in parallelo, e nel gruppo entra una corrente di {{I}}. La corrente che attraversa $R_2$ è'''
dati.R1 = { valore = 10, unita = "\\ohm" }
dati.R2 = { valore = 40, unita = "\\ohm" }
dati.I = { valore = "1,0", unita = "\\ampere" }
corretta = "C"
calcolo = "I * (R1 * R2 / (R1 + R2)) / R2"
soluzione = '''La resistenza equivalente è $R_{\text{eq}} = (10 \cdot 40)/(10 + 40)\,\si{\ohm} = 400/50\,\si{\ohm} = \SI{8}{\ohm}$. Ai capi del parallelo c'è $V = R_{\text{eq}} I = 8 \cdot 1{,}0\,\si{\volt} = \SI{8}{\volt}$, la stessa per i due resistori. Quindi $I_2 = V/R_2 = 8/40\,\si{\ampere} = \SI{0,20}{\ampere}$, e $I_1 = 8/10\,\si{\ampere} = \SI{0,80}{\ampere}$: la somma è \SI{1,0}{\ampere}.'''

  [[quesito.opzione]]
  testo = '''\SI{0,80}{\ampere}'''
  commento = '''È la corrente in $R_1$: la corrente maggiore passa nel resistore più piccolo, non in quello più grande.'''
  [[quesito.opzione]]
  testo = '''\SI{0,50}{\ampere}'''
  commento = '''Divide la corrente a metà fra i due rami, come se le resistenze fossero uguali.'''
  [[quesito.opzione]]
  testo = '''\SI{0,20}{\ampere}'''
  valore = 0.2
  [[quesito.opzione]]
  testo = '''\SI{1,0}{\ampere}'''
  commento = '''Tratta il collegamento come una serie, in cui tutti e due i resistori portano la stessa corrente: in parallelo la corrente si divide.'''
  [[quesito.opzione]]
  testo = '''\SI{0,25}{\ampere}'''
  commento = '''Moltiplica la corrente per $R_1/R_2 = 10/40$; il rapporto giusto è $R_1/(R_1 + R_2) = 10/50$.'''

[[quesito]]
id = "sim2-ud6-alfa-raggio"
simulazione = 2
ud = 6
tipo = "multipla"
testo = '''Un protone e una particella alfa (carica $+2e$, massa circa 4 volte quella del protone) entrano con la stessa velocità in un campo magnetico uniforme, perpendicolare alla loro velocità. Il rapporto $r_\alpha/r_p$ fra i raggi delle loro orbite è'''
corretta = "A"
calcolo = "4 / 2"
soluzione = '''Il raggio è $r = mv/(|q|B)$. Con la stessa $v$ e lo stesso $B$, conta solo il rapporto $m/|q|$:
\[
  \frac{r_\alpha}{r_p} = \frac{m_\alpha/q_\alpha}{m_p/e} = \frac{4m_p/2e}{m_p/e} = \frac{4}{2} = 2
\]'''

  [[quesito.opzione]]
  testo = '''2'''
  valore = 2
  [[quesito.opzione]]
  testo = '''4'''
  commento = '''Tiene conto della massa quadrupla ma dimentica che anche la carica è doppia, e la carica sta al denominatore.'''
  [[quesito.opzione]]
  testo = '''$1/2$'''
  commento = '''Rovescia la formula, come se fosse $r \propto |q|/m$: $2/4 = 1/2$.'''
  [[quesito.opzione]]
  testo = '''1'''
  commento = '''Pensa che il raggio dipenda solo dalla velocità e dal campo, che sono gli stessi; ma dipende anche dalla massa e dalla carica.'''
  [[quesito.opzione]]
  testo = '''8'''
  commento = '''Moltiplica il rapporto delle masse per quello delle cariche, $4 \cdot 2 = 8$, invece di dividere.'''

[[quesito]]
id = "sim2-ud6-lenz-allontana"
simulazione = 2
ud = 6
tipo = "multipla"
testo = '''Si allontana da una spira conduttrice chiusa il polo nord di un magnete, muovendolo lungo l'asse della spira. La corrente indotta nella spira'''
corretta = "D"
soluzione = '''Allontanando il magnete il flusso attraverso la spira diminuisce. Per la legge di Lenz la corrente indotta produce un campo concorde con quello del magnete, che si oppone alla diminuzione: la faccia della spira rivolta verso il magnete diventa un polo sud e attira il polo nord, frenandone l'allontanamento.'''

  [[quesito.opzione]]
  testo = '''è nulla, perché il flusso attraverso la spira diminuisce invece di aumentare'''
  commento = '''Anche una diminuzione è una variazione del flusso, e induce una forza elettromotrice.'''
  [[quesito.opzione]]
  testo = '''fa della faccia rivolta verso il magnete un polo nord, che respinge il magnete'''
  commento = '''È quello che succede avvicinando il magnete, quando il flusso aumenta. Allontanandolo il verso della corrente si inverte.'''
  [[quesito.opzione]]
  testo = '''produce dentro la spira un campo opposto a quello del magnete, che aiuta il magnete ad allontanarsi'''
  commento = '''Una corrente indotta che favorisse la variazione creerebbe energia dal nulla: il campo indotto si oppone alla variazione, e qui il flusso cala, quindi il campo indotto è concorde con quello del magnete.'''
  [[quesito.opzione]]
  testo = '''fa della faccia rivolta verso il magnete un polo sud, che attira il magnete'''
  [[quesito.opzione]]
  testo = '''circola nello stesso verso in cui circolerebbe avvicinando il magnete'''
  commento = '''Avvicinando il magnete il flusso aumenta, allontanandolo diminuisce: le due variazioni sono opposte, e così il verso delle correnti indotte.'''

[[quesito]]
id = "sim2-ud6-serie-poi-parallelo"
simulazione = 2
ud = 6
tipo = "completamento"
testo = '''Due condensatori, da {{C1}} e da {{C2}}, sono collegati in serie. Al gruppo si collega in parallelo un terzo condensatore da {{C3}}. La capacità equivalente dei tre condensatori vale \completa\ \si{\micro\farad}.'''
dati.C1 = { valore = "3,0", unita = "\\micro\\farad" }
dati.C2 = { valore = "6,0", unita = "\\micro\\farad" }
dati.C3 = { valore = "4,0", unita = "\\micro\\farad" }
calcolo = "C1 * C2 / (C1 + C2) + C3"
risposta = "6"
soluzione = '''Prima la serie: $1/C_{12} = 1/3{,}0 + 1/6{,}0 = 2/6 + 1/6 = 3/6$, quindi $C_{12} = \SI{2,0}{\micro\farad}$. Poi il parallelo con il terzo, in cui le capacità si sommano: $C_{\text{eq}} = 2{,}0 + 4{,}0 = \SI{6,0}{\micro\farad}$.'''

[[quesito]]
id = "sim2-ud6-quadrato"
simulazione = 2
ud = 6
tipo = "completamento"
testo = '''Ai vertici di un quadrato ci sono quattro cariche puntiformi, nel vuoto: tre valgono {{q}}, la quarta vale \SI{-2,0}{\nano\coulomb}. Ogni vertice dista {{r}} dal centro. Con $k = \SI{9e9}{\newton\metre\squared\per\coulomb\squared}$ e il potenziale nullo all'infinito, il potenziale al centro del quadrato vale \completa\ \si{\volt}.'''
dati.q = { valore = "+2,0", unita = "\\nano\\coulomb" }
dati.r = { valore = "9,0", unita = "\\centi\\metre" }
calcolo = "k * (q * 1e-9) / (r * 1e-2) * (3 - 1)"
risposta = "400"
soluzione = '''Ogni carica, a $r = \SI{0,090}{\metre}$ dal centro, dà un potenziale di modulo
\[
  k\,\frac{|q|}{r} = \num{9e9} \cdot \frac{\num{2,0e-9}}{\num{9,0e-2}}\,\si{\volt} = \frac{18}{\num{9,0e-2}}\,\si{\volt} = \SI{200}{\volt}
\]
Il potenziale è uno scalare e si somma con i segni: $V = 3 \cdot \SI{200}{\volt} - \SI{200}{\volt} = \SI{400}{\volt}$.'''

[[quesito]]
id = "sim3-ud6-carica-prova"
simulazione = 3
ud = 6
tipo = "multipla"
testo = '''In un punto $P$ una carica di prova positiva $q_0$ risente di una forza $\vec F$ diretta verso est. Si toglie $q_0$ e si mette in $P$ una carica $-2q_0$, senza cambiare le cariche che producono il campo. Il campo elettrico in $P$'''
corretta = "A"
soluzione = '''Il campo in $P$ dipende solo dalle cariche che lo producono, non dalla carica che vi si mette: resta $\vec E = \vec F/q_0$, diretto verso est. Cambia la forza: su $-2q_0$ agisce $(-2q_0)\vec E = -2\vec F$, di modulo $2F$ e diretta verso ovest.'''

  [[quesito.opzione]]
  testo = '''resta lo stesso, in modulo, direzione e verso'''
  [[quesito.opzione]]
  testo = '''raddoppia in modulo e punta verso ovest'''
  commento = '''È la forza sulla nuova carica a valere $2F$ verso ovest; il campo non dipende dalla carica di prova.'''
  [[quesito.opzione]]
  testo = '''si dimezza in modulo e punta verso ovest'''
  commento = '''Divide la forza vecchia per la carica nuova, $F/(-2q_0)$; ma con la carica cambia anche la forza, e il rapporto fra le due resta lo stesso.'''
  [[quesito.opzione]]
  testo = '''resta uguale in modulo, ma punta verso ovest'''
  commento = '''Il verso del campo è quello della forza su una carica positiva, e non cambia con il segno della carica che si mette nel punto: per una carica negativa è la forza a essere opposta al campo.'''
  [[quesito.opzione]]
  testo = '''raddoppia in modulo e punta ancora verso est'''
  commento = '''Confonde il campo con la forza e ne dimentica anche il segno: la forza su $-2q_0$ vale $2F$ ma verso ovest, e il campo non cambia.'''

[[quesito]]
id = "sim3-ud6-sfera-attratta"
simulazione = 3
ud = 6
tipo = "multipla"
testo = '''Si avvicina una bacchetta carica negativamente a una sfera metallica scarica, appesa a un filo isolante, senza toccarla. La sfera'''
corretta = "B"
soluzione = '''È l'induzione elettrostatica: la bacchetta respinge gli elettroni liberi della sfera sul lato lontano, e il lato vicino resta positivo. La carica totale resta zero, ma le cariche positive, più vicine, sono attratte più di quanto le negative, più lontane, siano respinte, perché la forza di Coulomb diminuisce con la distanza: la sfera è attratta.'''

  [[quesito.opzione]]
  testo = '''non risente di nessuna forza, perché è scarica'''
  commento = '''Dimentica l'induzione: le cariche libere del metallo si spostano, e la sfera, pur neutra, ha un lato positivo e uno negativo.'''
  [[quesito.opzione]]
  testo = '''è attratta dalla bacchetta, e la sua carica totale resta nulla'''
  [[quesito.opzione]]
  testo = '''è respinta, perché la bacchetta respinge gli elettroni della sfera'''
  commento = '''Gli elettroni sono respinti, ma sul lato lontano; il lato vicino è positivo e, essendo più vicino, è attratto con una forza più grande.'''
  [[quesito.opzione]]
  testo = '''è attratta, perché la bacchetta le cede elettroni e la carica negativamente'''
  commento = '''Senza contatto la carica non passa dalla bacchetta alla sfera; e una sfera carica negativamente sarebbe respinta, non attratta.'''
  [[quesito.opzione]]
  testo = '''è attratta, perché diventa carica positivamente'''
  commento = '''Confonde la separazione delle cariche con una carica netta: la sfera ha un lato positivo e uno negativo, ma in tutto resta neutra.'''

[[quesito]]
id = "sim3-ud6-scaldabiberon"
simulazione = 3
ud = 6
tipo = "multipla"
testo = '''Uno scaldabiberon porta l'indicazione «\SI{230}{\volt}, \SI{460}{\watt}». In viaggio viene collegato a una rete a {{V}}. Considerando costante la sua resistenza, la potenza che dissipa è'''
dati.V = { valore = 115, unita = "\\volt" }
corretta = "E"
calcolo = "460 * (V / 230)**2"
soluzione = '''La resistenza è $R = V_0^2/P_0 = 230^2/460\,\si{\ohm} = \num{52900}/460\,\si{\ohm} = \SI{115}{\ohm}$. A \SI{115}{\volt}: $P = V^2/R = 115^2/115\,\si{\watt} = \SI{115}{\watt}$. Più in breve: a resistenza costante $P \propto V^2$, e con la differenza di potenziale dimezzata la potenza si divide per $2^2 = 4$, $\SI{460}{\watt}/4 = \SI{115}{\watt}$.'''

  [[quesito.opzione]]
  testo = '''\SI{230}{\watt}'''
  commento = '''Tratta la potenza come proporzionale alla differenza di potenziale. Ma dimezzando $V$ si dimezza anche la corrente, e $P = VI$ si divide per 4.'''
  [[quesito.opzione]]
  testo = '''\SI{460}{\watt}'''
  commento = '''Pensa che la potenza sia una proprietà fissa dell'apparecchio: vale solo alla differenza di potenziale scritta sull'etichetta.'''
  [[quesito.opzione]]
  testo = '''\SI{1840}{\watt}'''
  commento = '''Usa il fattore 4 giusto ma nel verso sbagliato: con una differenza di potenziale più bassa la potenza cala.'''
  [[quesito.opzione]]
  testo = '''\SI{920}{\watt}'''
  commento = '''Pensa che a una differenza di potenziale più bassa l'apparecchio assorba più corrente, come se fosse $P \propto 1/V$: $460 \cdot 2 = 920$.'''
  [[quesito.opzione]]
  testo = '''\SI{115}{\watt}'''
  valore = 115

[[quesito]]
id = "sim3-ud6-bussola"
simulazione = 3
ud = 6
tipo = "multipla"
testo = '''Un lungo filo verticale è percorso da una corrente diretta verso l'alto. Una bussola è appoggiata su un tavolo orizzontale, vicina al filo e a nord di esso. Il campo magnetico prodotto dal filo nel punto in cui si trova la bussola è diretto verso'''
corretta = "D"
soluzione = '''Le linee del campo di un filo sono circonferenze centrate sul filo. Con il pollice della mano destra verso l'alto, lungo la corrente, le dita si chiudono in senso antiorario per chi guarda dall'alto. Nel punto a nord del filo la circonferenza antioraria è tangente verso ovest: il campo, e l'ago della bussola, puntano verso ovest.'''

  [[quesito.opzione]]
  testo = '''nord, in direzione opposta al filo'''
  commento = '''Tratta il campo del filo come quello di una carica positiva, uscente in modo radiale; le linee del campo magnetico di un filo sono circonferenze intorno al filo.'''
  [[quesito.opzione]]
  testo = '''sud, verso il filo'''
  commento = '''Tratta il campo del filo come radiale ed entrante, come quello di una carica negativa; il campo è tangente alle circonferenze intorno al filo.'''
  [[quesito.opzione]]
  testo = '''est'''
  commento = '''La direzione, tangente alla circonferenza, è giusta, ma il verso è quello della mano sinistra: con la mano destra le linee girano in senso antiorario visto dall'alto.'''
  [[quesito.opzione]]
  testo = '''ovest'''
  [[quesito.opzione]]
  testo = '''l'alto, nel verso della corrente'''
  commento = '''Il campo di un filo è perpendicolare al filo, non parallelo alla corrente: le sue linee stanno in piani orizzontali.'''

[[quesito]]
id = "sim3-ud6-spira-capovolta"
simulazione = 3
ud = 6
tipo = "completamento"
testo = '''Una spira di area {{A}} è perpendicolare a un campo magnetico uniforme di {{B}}. In {{t}} viene capovolta, cioè ruotata di \ang{180} intorno a un suo diametro. Il modulo della forza elettromotrice media indotta vale \completa\ \si{\milli\volt}.'''
dati.A = { valore = 50, unita = "\\centi\\metre\\squared" }
dati.B = { valore = "0,20", unita = "\\tesla" }
dati.t = { valore = "0,10", unita = "\\second" }
calcolo = "2 * B * (A * 1e-4) / t * 1e3"
risposta = "20"
soluzione = '''L'area è $A = 50 \cdot \SI{e-4}{\metre\squared} = \SI{5,0e-3}{\metre\squared}$. All'inizio il flusso è $BA = 0{,}20 \cdot \num{5,0e-3}\,\si{\weber} = \SI{1,0e-3}{\weber}$. Dopo il capovolgimento le linee attraversano la spira dall'altra faccia ($\cos\ang{180} = -1$): il flusso è $\SI{-1,0e-3}{\weber}$, e la variazione vale in modulo $\SI{2,0e-3}{\weber}$, non \SI{1,0e-3}{\weber}.
\[
  |\mathcal E| = \frac{|\Delta\Phi|}{\Delta t} = \frac{\SI{2,0e-3}{\weber}}{\SI{0,10}{\second}} = \SI{2,0e-2}{\volt} = \SI{20}{\milli\volt}
\]'''

[[quesito]]
id = "sim3-ud6-protone-fermato"
simulazione = 3
ud = 6
tipo = "completamento"
testo = '''Un protone con un'energia cinetica di {{K}} entra in un campo elettrico uniforme di {{E}}, muovendosi nel verso opposto al campo. Sul protone agisce solo la forza elettrica. Il protone si ferma dopo aver percorso \completa\ \si{\milli\metre}.'''
dati.K = { valore = "2,0", unita = "\\kilo\\electronvolt" }
dati.E = { valore = "4,0e5", unita = "\\volt\\per\\metre" }
calcolo = "(K * 1e3) / E * 1e3"
risposta = "5"
soluzione = '''Il protone è positivo e risente di una forza nel verso del campo, opposta alla sua velocità: rallenta, risalendo verso potenziali più alti. Si ferma quando ha perso tutta l'energia cinetica, $K = \SI{2,0e3}{\electronvolt}$, cioè dopo aver risalito una differenza di potenziale $\Delta V = K/e = \SI{2,0e3}{\volt}$. In un campo uniforme $\Delta V = Ed$:
\[
  d = \frac{\Delta V}{E} = \frac{\SI{2,0e3}{\volt}}{\SI{4,0e5}{\volt\per\metre}} = 0{,}50 \cdot 10^{3-5}\,\si{\metre} = \SI{5,0e-3}{\metre} = \SI{5}{\milli\metre}
\]'''

