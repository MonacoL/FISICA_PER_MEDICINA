[[quesito]]
id = "sim1-ud2-grafico-vt"
simulazione = 1
ud = 2
tipo = "multipla"
testo = '''Un corpo parte da fermo e si muove lungo una retta di moto uniformemente accelerato. Nel suo grafico velocità-tempo la velocità è rappresentata da'''
corretta = "B"
soluzione = '''Nel moto uniformemente accelerato la velocità è $v = v_0 + a\,t$, una funzione di primo grado del tempo: il grafico $v(t)$ è una retta. Con $v_0 = 0$ passa per l'origine. La sua pendenza è $\Delta v/\Delta t$, cioè proprio l'accelerazione $a$. Lo spazio percorso è invece l'area sotto la retta.'''

  [[quesito.opzione]]
  testo = '''una retta orizzontale'''
  commento = '''È il grafico velocità-tempo del moto uniforme, in cui la velocità non cambia.'''
  [[quesito.opzione]]
  testo = '''una retta inclinata, con pendenza uguale all'accelerazione'''
  [[quesito.opzione]]
  testo = '''un ramo di parabola'''
  commento = '''Confonde con il grafico orario $x(t)$, che nel moto uniformemente accelerato è una parabola. La velocità cresce in modo lineare con il tempo.'''
  [[quesito.opzione]]
  testo = '''una retta inclinata, con pendenza uguale alla velocità'''
  commento = '''Confonde i due grafici: la velocità è la pendenza del grafico orario $x(t)$; la pendenza del grafico $v(t)$ è l'accelerazione.'''
  [[quesito.opzione]]
  testo = '''una retta inclinata, con pendenza uguale allo spazio percorso'''
  commento = '''Lo spazio percorso è l'area sotto il grafico velocità-tempo, non la sua pendenza.'''

[[quesito]]
id = "sim1-ud2-sonda"
simulazione = 1
ud = 2
tipo = "multipla"
testo = '''Una sonda spaziale, lontanissima da stelle e pianeti, viaggia a \SI{10}{\kilo\metre\per\second} quando il suo motore si spegne. Trascurando ogni forza esterna, dopo lo spegnimento la sonda'''
corretta = "E"
soluzione = '''Spento il motore, sulla sonda non agisce nessuna forza. Per il primo principio della dinamica un corpo su cui la risultante delle forze è nulla mantiene la sua velocità, in modulo, direzione e verso: la sonda prosegue in linea retta a \SI{10}{\kilo\metre\per\second}. Il motore serviva a cambiare la velocità, non a mantenerla.'''

  [[quesito.opzione]]
  testo = '''rallenta a poco a poco fino a fermarsi'''
  commento = '''Pensa che per mantenere il moto serva una forza. Sulla Terra i corpi lasciati a sé rallentano per l'attrito e la resistenza dell'aria, che qui non ci sono.'''
  [[quesito.opzione]]
  testo = '''si ferma subito'''
  commento = '''Pensa che il moto cessi insieme alla forza che lo ha prodotto. Per fermarsi la sonda avrebbe bisogno di una forza opposta alla velocità.'''
  [[quesito.opzione]]
  testo = '''continua ad accelerare, ma sempre meno'''
  commento = '''Per il secondo principio un'accelerazione richiede una forza risultante. Senza forze l'accelerazione è nulla, subito dopo lo spegnimento.'''
  [[quesito.opzione]]
  testo = '''prosegue a \SI{10}{\kilo\metre\per\second}, ma su una traiettoria che si incurva'''
  commento = '''Il modulo è giusto, ma cambiare direzione vuol dire cambiare velocità, e serve una forza. Senza forze la traiettoria è rettilinea.'''
  [[quesito.opzione]]
  testo = '''prosegue in linea retta a \SI{10}{\kilo\metre\per\second}'''

[[quesito]]
id = "sim1-ud2-energia-cinetica"
simulazione = 1
ud = 2
tipo = "multipla"
testo = '''Un corpo ha energia cinetica $E_c$. Se la sua massa si dimezza e la sua velocità raddoppia, la sua energia cinetica diventa'''
corretta = "A"
calcolo = "(1 / 2) * 2**2"
soluzione = '''L'energia cinetica è $E_c = \frac12 mv^2$: proporzionale alla massa e al quadrato della velocità. Con massa $m/2$ e velocità $2v$:
\[
  E_c' = \frac12 \cdot \frac{m}{2} \cdot (2v)^2 = \frac12 m v^2 \cdot \frac{4}{2} = 2E_c
\]'''

  [[quesito.opzione]]
  testo = '''$2E_c$'''
  valore = 2
  [[quesito.opzione]]
  testo = '''$E_c$'''
  commento = '''Pensa che il dimezzamento della massa e il raddoppio della velocità si compensino: vale se l'energia cinetica fosse proporzionale alla velocità, non al suo quadrato.'''
  [[quesito.opzione]]
  testo = '''$4E_c$'''
  commento = '''Tiene conto del raddoppio della velocità, $2^2 = 4$, ma dimentica che la massa si dimezza.'''
  [[quesito.opzione]]
  testo = '''$8E_c$'''
  commento = '''Moltiplica per 2 per la massa invece di dividere: $2 \cdot 4$.'''
  [[quesito.opzione]]
  testo = '''$E_c/2$'''
  commento = '''Tiene conto solo della massa dimezzata e dimentica la velocità.'''

[[quesito]]
id = "sim1-ud2-urto-agganciati"
simulazione = 1
ud = 2
tipo = "multipla"
testo = '''Due carrelli si scontrano su una rotaia senza attrito e dopo l'urto restano agganciati. Nell'urto'''
corretta = "C"
soluzione = '''Durante l'urto i carrelli si scambiano forze interne, uguali e opposte per il terzo principio, e le forze esterne orizzontali sono nulle: il sistema è isolato, e la quantità di moto totale si conserva. L'urto con i corpi che restano attaccati è completamente anelastico: una parte dell'energia cinetica diventa calore e deformazione, e l'energia cinetica totale diminuisce.'''

  [[quesito.opzione]]
  testo = '''si conservano sia la quantità di moto totale sia l'energia cinetica totale'''
  commento = '''Vale per l'urto elastico. Due carrelli che restano agganciati fanno un urto completamente anelastico, quello in cui si perde più energia cinetica.'''
  [[quesito.opzione]]
  testo = '''si conserva l'energia cinetica totale, ma non la quantità di moto totale'''
  commento = '''Rovescia le due leggi: negli urti la quantità di moto totale si conserva sempre, l'energia cinetica no.'''
  [[quesito.opzione]]
  testo = '''si conserva la quantità di moto totale, ma non l'energia cinetica totale'''
  [[quesito.opzione]]
  testo = '''non si conservano né la quantità di moto totale né l'energia cinetica totale'''
  commento = '''Le forze dell'urto sono interne al sistema dei due carrelli, e senza attrito non ci sono forze esterne orizzontali: la quantità di moto totale si conserva.'''
  [[quesito.opzione]]
  testo = '''si conserva la quantità di moto di ciascun carrello'''
  commento = '''Ogni carrello subisce la forza dell'altro, e la sua quantità di moto cambia. Si conserva la loro somma, perché le due variazioni sono uguali e opposte.'''

[[quesito]]
id = "sim1-ud2-cm-piano"
simulazione = 1
ud = 2
tipo = "multipla"
testo = '''Tre piccoli corpi stanno in un piano: uno di \SI{1}{\kilo\gram} nell'origine, uno di \SI{1}{\kilo\gram} nel punto $(4, 0)$ e uno di \SI{2}{\kilo\gram} nel punto $(0, 4)$, con le coordinate in metri. Il centro di massa del sistema si trova nel punto'''
corretta = "D"
soluzione = '''La massa totale è $1 + 1 + 2 = \SI{4}{\kilo\gram}$. Coordinata per coordinata, il centro di massa è la media delle posizioni pesata con le masse:
\[
  x_{cm} = \frac{1 \cdot 0 + 1 \cdot 4 + 2 \cdot 0}{4}\,\si{\metre} = \SI{1}{\metre}
  \qquad\qquad
  y_{cm} = \frac{1 \cdot 0 + 1 \cdot 0 + 2 \cdot 4}{4}\,\si{\metre} = \SI{2}{\metre}
\]
Il centro di massa è in $(1, 2)$: più vicino al corpo di \SI{2}{\kilo\gram}, sull'asse $y$.'''

  [[quesito.opzione]]
  testo = '''$(4/3, 4/3)$'''
  commento = '''Fa la media semplice delle coordinate, $(0 + 4 + 0)/3$ e $(0 + 0 + 4)/3$, come se le tre masse fossero uguali.'''
  [[quesito.opzione]]
  testo = '''$(2, 1)$'''
  commento = '''Scambia le masse dei due corpi fuori dall'origine: mette \SI{2}{\kilo\gram} in $(4, 0)$ e \SI{1}{\kilo\gram} in $(0, 4)$.'''
  [[quesito.opzione]]
  testo = '''$(2, 4)$'''
  commento = '''Divide le somme pesate, 4 e 8, per la massa del corpo più pesante, \SI{2}{\kilo\gram}, invece che per la massa totale, \SI{4}{\kilo\gram}.'''
  [[quesito.opzione]]
  testo = '''$(1, 2)$'''
  [[quesito.opzione]]
  testo = '''$(4, 8)$'''
  commento = '''Calcola le somme pesate $\sum m x$ e $\sum m y$ e dimentica di dividerle per la massa totale.'''

[[quesito]]
id = "sim1-ud2-pianeta"
simulazione = 1
ud = 2
tipo = "multipla"
testo = '''Sulla Terra un astronauta pesa \SI{700}{\newton}. Su un pianeta che ha massa doppia di quella della Terra e raggio doppio, il suo peso sarebbe'''
corretta = "A"
calcolo = "700 * 2 / 2**2"
soluzione = '''Il peso è la forza gravitazionale del pianeta sull'astronauta, sulla superficie: $F = GMm/R^2$, proporzionale alla massa del pianeta e inversamente proporzionale al quadrato del raggio. La massa doppia moltiplica il peso per 2, il raggio doppio lo divide per $2^2 = 4$:
\[
  F' = \SI{700}{\newton} \cdot \frac{2}{2^2} = \SI{700}{\newton} \cdot \frac{1}{2} = \SI{350}{\newton}
\]'''

  [[quesito.opzione]]
  testo = '''\SI{350}{\newton}'''
  valore = 350
  [[quesito.opzione]]
  testo = '''\SI{700}{\newton}'''
  commento = '''Divide per il raggio invece che per il suo quadrato: $2/2 = 1$, e il peso sembra non cambiare.'''
  [[quesito.opzione]]
  testo = '''\SI{1400}{\newton}'''
  commento = '''Tiene conto solo della massa doppia del pianeta e dimentica il raggio.'''
  [[quesito.opzione]]
  testo = '''\SI{175}{\newton}'''
  commento = '''Tiene conto solo del raggio doppio, $700/4$, e dimentica la massa doppia.'''
  [[quesito.opzione]]
  testo = '''\SI{5600}{\newton}'''
  commento = '''Moltiplica per il quadrato del raggio invece di dividere: $700 \cdot 2 \cdot 4$. La forza gravitazionale diminuisce con la distanza dal centro del pianeta.'''

[[quesito]]
id = "sim1-ud1-infusione"
simulazione = 1
ud = 1
tipo = "completamento"
testo = '''Una pompa a siringa infonde \SI{3,6}{\milli\litre} di farmaco ogni ora. Il volume infuso in un secondo, in metri cubi, è $1 \cdot 10^{n}\,\si{\metre\cubed}$ con $n =$ \completa.'''
calcolo = "round(math.log10(3.6e-6 / 3.6e3))"
risposta = "-9"
soluzione = '''Un millilitro è un centimetro cubo, cioè $(\SI{e-2}{\metre})^3 = \SI{e-6}{\metre\cubed}$; quindi $\SI{3,6}{\milli\litre} = \SI{3,6e-6}{\metre\cubed}$. Un'ora è $\SI{3600}{\second} = \SI{3,6e3}{\second}$. Il volume in un secondo è
\[
  \frac{\SI{3,6e-6}{\metre\cubed}}{\SI{3,6e3}{\second}} = \frac{3{,}6}{3{,}6} \cdot 10^{-6-3}\,\si{\metre\cubed\per\second} = \SI{1e-9}{\metre\cubed\per\second}
\]
Chi scrive $-6$ ha preso il millilitro per \SI{e-3}{\metre\cubed}, che è invece il litro: $\SI{3,6e-3}{\metre\cubed} / \SI{3,6e3}{\second} = \SI{e-6}{\metre\cubed\per\second}$.'''

[[quesito]]
id = "sim1-ud2-lancio-basso"
simulazione = 1
ud = 2
tipo = "completamento"
testo = '''Da un ponte un sasso viene lanciato verticalmente verso il basso a \SI{5}{\metre\per\second}. Trascurando la resistenza dell'aria e usando $g = \SI{10}{\metre\per\second\squared}$, dopo \SI{2}{\second} la sua velocità ha modulo \completa\ \si{\metre\per\second}.'''
calcolo = "5 + g * 2"
risposta = "25"
soluzione = '''Si prende l'asse verticale verso il basso: la velocità iniziale e l'accelerazione hanno lo stesso verso, e sono tutte e due positive. Nel moto uniformemente accelerato
\[
  v = v_0 + g\,t = \SI{5}{\metre\per\second} + \SI{10}{\metre\per\second\squared} \cdot \SI{2}{\second} = (5 + 20)\,\si{\metre\per\second} = \SI{25}{\metre\per\second}
\]
Chi scrive 20 ha dimenticato la velocità iniziale; chi scrive 15 ha dato alla velocità iniziale e all'accelerazione versi opposti, come in un lancio verso l'alto.'''

[[quesito]]
id = "sim1-ud2-potenza-ambulanza"
simulazione = 1
ud = 2
tipo = "completamento"
testo = '''Un'ambulanza di \SI{2000}{\kilo\gram} parte da ferma su una strada orizzontale e raggiunge \SI{15}{\metre\per\second} in \SI{9}{\second}. Trascurando gli attriti, la potenza media che il motore trasmette alle ruote vale \completa\ \si{\kilo\watt}.'''
calcolo = "0.5 * 2000 * 15**2 / 9 / 1000"
risposta = "25"
soluzione = '''Senza attriti il lavoro del motore è tutto energia cinetica, per il teorema dell'energia cinetica:
\[
  W = \frac12 m v^2 = \frac12 \cdot \SI{2000}{\kilo\gram} \cdot (\SI{15}{\metre\per\second})^2 = 1000 \cdot 225\,\si{\joule} = \SI{225000}{\joule}
\]
La potenza media è il lavoro diviso per il tempo:
\[
  P = \frac{W}{\Delta t} = \frac{\SI{225000}{\joule}}{\SI{9}{\second}} = \SI{25000}{\watt} = \SI{25}{\kilo\watt}
\]
Chi scrive 50 ha dimenticato il fattore $\frac12$ dell'energia cinetica.'''

[[quesito]]
id = "sim2-ud1-dimensioni"
simulazione = 2
ud = 1
tipo = "multipla"
testo = '''Con $h$ un'altezza, $t$ un tempo, $m$ una massa e $g$ l'accelerazione di gravità, quale di queste espressioni ha le dimensioni di una velocità?'''
corretta = "C"
soluzione = '''Le dimensioni sono $[h] = [L]$, $[t] = [T]$, $[m] = [M]$ e $[g] = [L\,T^{-2}]$; una velocità ha dimensione $[L\,T^{-1}]$. Per $\sqrt{gh}$:
\[
  [g\,h] = [L\,T^{-2}] \cdot [L] = [L^2\,T^{-2}]
  \qquad\Longrightarrow\qquad
  [\sqrt{g h}\,] = [L^2\,T^{-2}]^{1/2} = [L\,T^{-1}]
\]
È la velocità di un corpo che cade da fermo da un'altezza $h$, a meno del fattore numerico $\sqrt 2$, che non ha dimensioni.'''

  [[quesito.opzione]]
  testo = '''$g\,t^2$'''
  commento = '''$[L\,T^{-2}] \cdot [T^2] = [L]$: è una lunghezza. Per una velocità il tempo andrebbe alla prima potenza, $g\,t$.'''
  [[quesito.opzione]]
  testo = '''$h/t^2$'''
  commento = '''$[L] / [T^2] = [L\,T^{-2}]$: è un'accelerazione. Per una velocità si divide per il tempo, non per il suo quadrato.'''
  [[quesito.opzione]]
  testo = '''$\sqrt{g\,h}$'''
  [[quesito.opzione]]
  testo = '''$m\,g\,h$'''
  commento = '''$[M] \cdot [L\,T^{-2}] \cdot [L] = [M\,L^2\,T^{-2}]$: è un'energia, l'energia potenziale gravitazionale.'''
  [[quesito.opzione]]
  testo = '''$h\,t$'''
  commento = '''$[L] \cdot [T] = [L\,T]$: moltiplica per il tempo invece di dividere.'''

[[quesito]]
id = "sim2-ud2-angoli-complementari"
simulazione = 2
ud = 2
tipo = "multipla"
testo = '''Due palline vengono lanciate dallo stesso punto di un terreno orizzontale, con velocità dello stesso modulo: una a \ang{30} e l'altra a \ang{60} sopra l'orizzontale. Trascurando la resistenza dell'aria, rispetto alla prima, la seconda pallina'''
corretta = "A"
soluzione = '''Con velocità $v_0$ e angolo $\theta$, le componenti iniziali sono $v_{0x} = v_0\cos\theta$ e $v_{0y} = v_0\sin\theta$. Il tempo di volo è $t_v = 2v_{0y}/g$, l'altezza massima $v_{0y}^2/(2g)$, la gittata
\[
  R = v_{0x}\,t_v = \frac{2v_0^2\sin\theta\cos\theta}{g}
\]
Per \ang{30} il prodotto è $\sin\ang{30}\cos\ang{30}$, per \ang{60} è $\sin\ang{60}\cos\ang{60}$: sono gli stessi due numeri, scambiati, e le gittate sono uguali. A \ang{60} però $v_{0y}$ è maggiore: la pallina sale più in alto e resta in volo più a lungo, mentre va più piano in orizzontale.'''

  [[quesito.opzione]]
  testo = '''tocca terra alla stessa distanza, ma sale più in alto e resta in volo più a lungo'''
  [[quesito.opzione]]
  testo = '''tocca terra a una distanza doppia, perché l'angolo è doppio'''
  commento = '''La gittata non è proporzionale all'angolo: dipende dal prodotto $\sin\theta\cos\theta$, che a \ang{30} e a \ang{60} è lo stesso.'''
  [[quesito.opzione]]
  testo = '''tocca terra alla stessa distanza, e resta in volo per lo stesso tempo'''
  commento = '''La gittata è giusta, ma il tempo di volo dipende dalla componente verticale della velocità, $t_v = 2v_{0y}/g$, che a \ang{60} è maggiore.'''
  [[quesito.opzione]]
  testo = '''tocca terra più vicino, perché ha una velocità orizzontale minore'''
  commento = '''Guarda solo la velocità orizzontale. A \ang{60} è minore, ma la pallina resta in volo più a lungo, e i due fattori si compensano esattamente.'''
  [[quesito.opzione]]
  testo = '''tocca terra più lontano, perché sale più in alto'''
  commento = '''Salire più in alto vuol dire restare in volo di più, ma con una velocità orizzontale minore. La gittata è massima a \ang{45}, e a \ang{30} e \ang{60} è la stessa.'''

[[quesito]]
id = "sim2-ud2-reazione-peso"
simulazione = 2
ud = 2
tipo = "multipla"
testo = '''Un libro è fermo su un tavolo. Per il terzo principio della dinamica, la reazione alla forza peso del libro è'''
corretta = "D"
soluzione = '''Il peso del libro è la forza con cui la Terra attira il libro. Per il terzo principio la sua reazione è la forza con cui il libro attira la Terra: stesso modulo, verso opposto (verso l'alto), applicata a un corpo diverso, la Terra. La spinta del tavolo sul libro è anch'essa uguale e opposta al peso, ma agisce sullo stesso corpo, il libro, e lo bilancia perché il libro è in equilibrio: non è la reazione al peso.'''

  [[quesito.opzione]]
  testo = '''la forza con cui il tavolo spinge il libro verso l'alto'''
  commento = '''È uguale e opposta al peso, ma agisce sullo stesso corpo, il libro: le due forze si bilanciano per l'equilibrio, non per il terzo principio. Azione e reazione agiscono su corpi diversi.'''
  [[quesito.opzione]]
  testo = '''la forza con cui il libro preme sul tavolo'''
  commento = '''È la reazione alla spinta del tavolo sul libro. Il peso è un'interazione fra il libro e la Terra, e la sua reazione agisce sulla Terra.'''
  [[quesito.opzione]]
  testo = '''nessuna forza: il peso non ha reazione, perché la Terra non si muove'''
  commento = '''Ogni forza ha la sua reazione. La Terra si muove pochissimo perché la sua massa è enorme, non perché la forza manchi.'''
  [[quesito.opzione]]
  testo = '''la forza con cui il libro attira la Terra verso l'alto'''
  [[quesito.opzione]]
  testo = '''la forza con cui il tavolo preme sul pavimento'''
  commento = '''È una forza fra altri due corpi, il tavolo e il pavimento. La coppia di azione e reazione riguarda sempre gli stessi due corpi, qui il libro e la Terra.'''

[[quesito]]
id = "sim2-ud2-ciclista"
simulazione = 2
ud = 2
tipo = "multipla"
testo = '''Un ciclista, che con la bicicletta ha una massa di \SI{80}{\kilo\gram}, accelera da \SI{5}{\metre\per\second} a \SI{10}{\metre\per\second}. Il lavoro totale delle forze che agiscono su di lui è'''
corretta = "E"
calcolo = "0.5 * 80 * (10**2 - 5**2)"
soluzione = '''Per il teorema dell'energia cinetica il lavoro totale è la variazione dell'energia cinetica:
\[
  W_{\text{tot}} = \frac12 m v_f^2 - \frac12 m v_i^2 = \frac12 \cdot \SI{80}{\kilo\gram} \cdot (100 - 25)\,\si{\metre\squared\per\second\squared} = 40 \cdot 75\,\si{\joule} = \SI{3000}{\joule}
\]'''

  [[quesito.opzione]]
  testo = '''\SI{1000}{\joule}'''
  commento = '''Eleva al quadrato la differenza delle velocità invece di fare la differenza dei quadrati: $\frac12 \cdot 80 \cdot (10 - 5)^2 = 40 \cdot 25$.'''
  [[quesito.opzione]]
  testo = '''\SI{4000}{\joule}'''
  commento = '''Usa solo l'energia cinetica finale, $\frac12 \cdot 80 \cdot 100$, come se il ciclista partisse da fermo.'''
  [[quesito.opzione]]
  testo = '''\SI{400}{\joule}'''
  commento = '''Calcola la variazione della quantità di moto, $m\,\Delta v = 80 \cdot 5 = \SI{400}{\kilo\gram\metre\per\second}$, che non è un lavoro.'''
  [[quesito.opzione]]
  testo = '''\SI{6000}{\joule}'''
  commento = '''Dimentica il fattore $\frac12$ dell'energia cinetica: $80 \cdot 75$.'''
  [[quesito.opzione]]
  testo = '''\SI{3000}{\joule}'''
  valore = 3000

[[quesito]]
id = "sim2-ud2-rimbalzo"
simulazione = 2
ud = 2
tipo = "multipla"
testo = '''Una pallina da riabilitazione di \SI{0,1}{\kilo\gram} arriva sul pavimento in verticale a \SI{5}{\metre\per\second} e rimbalza verso l'alto a \SI{3}{\metre\per\second}. L'impulso che il pavimento le dà ha modulo'''
corretta = "B"
calcolo = "0.1 * (3 + 5)"
soluzione = '''L'impulso è uguale alla variazione della quantità di moto. Con l'asse verso l'alto, la velocità prima dell'urto è \SI{-5}{\metre\per\second} e dopo è \SI{+3}{\metre\per\second}:
\[
  J = m v_f - m v_i = \SI{0,1}{\kilo\gram} \cdot \bigl(3 - (-5)\bigr)\,\si{\metre\per\second} = 0{,}1 \cdot 8\,\si{\newton\second} = \SI{0,8}{\newton\second}
\]'''

  [[quesito.opzione]]
  testo = '''\SI{0,2}{\newton\second}'''
  commento = '''Sottrae i moduli delle velocità, $0{,}1 \cdot (5 - 3)$, e dimentica che la velocità ha cambiato verso.'''
  [[quesito.opzione]]
  testo = '''\SI{0,8}{\newton\second}'''
  valore = 0.8
  [[quesito.opzione]]
  testo = '''\SI{0,5}{\newton\second}'''
  commento = '''Conta solo l'arresto della pallina, $0{,}1 \cdot 5$, e dimentica il rimbalzo.'''
  [[quesito.opzione]]
  testo = '''\SI{0,3}{\newton\second}'''
  commento = '''Conta solo la quantità di moto dopo il rimbalzo, $0{,}1 \cdot 3$, come se la pallina partisse da ferma.'''
  [[quesito.opzione]]
  testo = '''\SI{1,0}{\newton\second}'''
  commento = '''Tratta il rimbalzo come se la pallina ripartisse alla stessa velocità di arrivo: $0{,}1 \cdot (5 + 5)$.'''

[[quesito]]
id = "sim2-ud2-base-appoggio"
simulazione = 2
ud = 2
tipo = "multipla"
testo = '''Una persona anziana sta ferma in piedi. Resta in equilibrio, senza cadere, se'''
corretta = "D"
soluzione = '''Il peso agisce come se fosse applicato tutto nel baricentro; le forze del pavimento agiscono nella base d'appoggio, l'area occupata dai piedi e compresa fra essi. Per l'equilibrio servono la risultante nulla e la somma dei momenti nulla. Se la verticale per il baricentro cade dentro la base d'appoggio, le forze del pavimento possono bilanciare anche il momento del peso. Se cade fuori, il peso fa ruotare il corpo attorno al bordo della base, e la persona cade. Per questo un bastone o un deambulatore, che allargano la base, aiutano a non cadere.'''

  [[quesito.opzione]]
  testo = '''il suo baricentro si trova all'altezza del bacino'''
  commento = '''In piedi il baricentro sta proprio lì, ma non basta: conta dove cade la verticale che passa per esso, rispetto ai piedi.'''
  [[quesito.opzione]]
  testo = '''la risultante delle forze su di lei è nulla, anche se la verticale per il baricentro cade fuori dai piedi'''
  commento = '''Dimentica l'equilibrio rotazionale. Con la verticale fuori dalla base, il peso ha un momento che le forze del pavimento non possono bilanciare, e il corpo ruota.'''
  [[quesito.opzione]]
  testo = '''il suo peso è minore della forza con cui il pavimento la spinge verso l'alto'''
  commento = '''Allora la risultante sarebbe verso l'alto e la persona accelererebbe verso l'alto. In equilibrio le due forze verticali sono uguali.'''
  [[quesito.opzione]]
  testo = '''la verticale che passa per il suo baricentro cade dentro la base d'appoggio'''
  [[quesito.opzione]]
  testo = '''tiene i piedi uniti, così il baricentro sta proprio sopra di essi'''
  commento = '''Con i piedi uniti la base d'appoggio si restringe, e basta una piccola inclinazione per portare la verticale del baricentro fuori: è più facile cadere, non meno.'''

[[quesito]]
id = "sim2-ud2-lancette"
simulazione = 2
ud = 2
tipo = "completamento"
testo = '''In un orologio la lancetta dei minuti e quella delle ore ruotano di moto circolare uniforme. La velocità angolare della lancetta dei minuti è \completa\ volte quella della lancetta delle ore.'''
calcolo = "12 / 1"
risposta = "12"
soluzione = '''La lancetta dei minuti fa un giro in un'ora, $T_m = \SI{1}{\hour}$; quella delle ore in dodici ore, $T_o = \SI{12}{\hour}$. La velocità angolare è $\omega = 2\pi/T$, inversamente proporzionale al periodo:
\[
  \frac{\omega_m}{\omega_o} = \frac{2\pi/T_m}{2\pi/T_o} = \frac{T_o}{T_m} = \frac{\SI{12}{\hour}}{\SI{1}{\hour}} = 12
\]
Chi scrive 60 ha usato i minuti di un'ora al posto del rapporto fra i periodi. La velocità angolare non dipende dalla lunghezza della lancetta.'''

[[quesito]]
id = "sim2-ud2-carrelli-contatto"
simulazione = 2
ud = 2
tipo = "completamento"
testo = '''Un infermiere spinge in orizzontale due carrelli a contatto, uno davanti all'altro, su un pavimento con attrito trascurabile. Spinge il carrello posteriore, di \SI{20}{\kilo\gram}, con una forza di \SI{60}{\newton}; quello anteriore ha massa \SI{10}{\kilo\gram}. La forza che il carrello posteriore esercita su quello anteriore vale \completa\ \si{\newton}.'''
calcolo = "10 * 60 / (20 + 10)"
risposta = "20"
soluzione = '''I due carrelli si muovono insieme, con la stessa accelerazione. Per il sistema dei due carrelli l'unica forza orizzontale esterna è la spinta:
\[
  a = \frac{F}{m_1 + m_2} = \frac{\SI{60}{\newton}}{\SI{30}{\kilo\gram}} = \SI{2}{\metre\per\second\squared}
\]
Sul carrello anteriore agisce in orizzontale solo la forza del carrello posteriore, che gli dà questa accelerazione:
\[
  F_{\text{contatto}} = m_2\,a = \SI{10}{\kilo\gram} \cdot \SI{2}{\metre\per\second\squared} = \SI{20}{\newton}
\]
Chi scrive 60 pensa che la spinta arrivi intera al carrello anteriore; chi scrive 40 ha calcolato la forza risultante sul carrello posteriore, $20 \cdot 2$.'''

[[quesito]]
id = "sim2-ud2-elastico-lavoro"
simulazione = 2
ud = 2
tipo = "completamento"
testo = '''Un elastico da riabilitazione si comporta come una molla ideale di costante elastica \SI{1000}{\newton\per\metre}. Il paziente lo tiene già allungato di \SI{2}{\centi\metre} e lo allunga ancora, fino a \SI{4}{\centi\metre}. Il lavoro che compie in questo tratto vale \completa\ \si{\milli\joule}.'''
calcolo = "0.5 * 1000 * (0.04**2 - 0.02**2) * 1000"
risposta = "600"
soluzione = '''Il lavoro per allungare la molla è l'aumento della sua energia potenziale elastica, $E_p = \frac12 kx^2$, fra $x_1 = \SI{0,02}{\metre}$ e $x_2 = \SI{0,04}{\metre}$:
\[
  W = \frac12 k x_2^2 - \frac12 k x_1^2 = \frac12 \cdot \SI{1000}{\newton\per\metre} \cdot (16 - 4) \cdot 10^{-4}\,\si{\metre\squared} = 500 \cdot \SI{12e-4}{\joule} = \SI{0,6}{\joule} = \SI{600}{\milli\joule}
\]
Chi scrive 200 ha usato l'allungamento in più, $\frac12 k (\Delta x)^2 = 500 \cdot \SI{4e-4}{\joule}$: la forza della molla cresce con l'allungamento totale, e il secondo tratto costa più del primo.'''

[[quesito]]
id = "sim3-ud2-rotonda"
simulazione = 3
ud = 2
tipo = "multipla"
testo = '''Un'ambulanza percorre una rotonda circolare con il tachimetro fermo su \SI{30}{\kilo\metre\per\hour}. Durante il giro la sua accelerazione'''
corretta = "E"
soluzione = '''Il modulo della velocità è costante, ma la sua direzione cambia di continuo: il moto è circolare uniforme, ed è accelerato. L'accelerazione è quella centripeta, diretta in ogni istante verso il centro della rotonda, con modulo $a_c = v^2/r$, costante perché $v$ ed $r$ non cambiano.'''

  [[quesito.opzione]]
  testo = '''è nulla, perché il modulo della velocità non cambia'''
  commento = '''Confonde il moto circolare uniforme con il rettilineo uniforme. Anche una velocità che cambia solo direzione è una velocità che cambia.'''
  [[quesito.opzione]]
  testo = '''è diretta come la velocità, tangente alla rotonda'''
  commento = '''Un'accelerazione tangente farebbe cambiare il modulo della velocità, che qui è costante. Per cambiare solo la direzione l'accelerazione deve essere perpendicolare alla velocità.'''
  [[quesito.opzione]]
  testo = '''è diretta verso l'esterno della rotonda'''
  commento = '''Scambia l'accelerazione con la sensazione dei passeggeri, che si sentono spinti verso l'esterno perché tendono a proseguire in linea retta. L'accelerazione punta verso il centro.'''
  [[quesito.opzione]]
  testo = '''è diretta verso il centro, e a parità di velocità è più grande se la rotonda è più larga'''
  commento = '''La direzione è giusta, ma $a_c = v^2/r$: a parità di velocità, una rotonda più larga dà un'accelerazione più piccola.'''
  [[quesito.opzione]]
  testo = '''è diretta verso il centro della rotonda e ha modulo costante'''

[[quesito]]
id = "sim3-ud2-inseguimento"
simulazione = 3
ud = 2
tipo = "multipla"
testo = '''Su una strada rettilinea un'ambulanza a \SI{90}{\kilo\metre\per\hour} segue un'auto che va a \SI{60}{\kilo\metre\per\hour}, nello stesso verso, \SI{1}{\kilo\metre} più avanti. Entrambe vanno a velocità costante. L'ambulanza raggiunge l'auto dopo'''
corretta = "D"
calcolo = "1 / (90 - 60) * 60"
soluzione = '''Le due vanno nello stesso verso: ogni ora l'ambulanza guadagna sull'auto $90 - 60 = \SI{30}{\kilo\metre}$. La raggiunge quando ha recuperato il chilometro di distacco:
\[
  90\,t = 1 + 60\,t \quad\Longrightarrow\quad t = \frac{\SI{1}{\kilo\metre}}{\SI{30}{\kilo\metre\per\hour}} = \frac{1}{30}\,\si{\hour} = \frac{60}{30}\,\si{\minute} = \SI{2}{\minute}
\]'''

  [[quesito.opzione]]
  testo = '''\SI{40}{\second}'''
  commento = '''Usa solo la velocità dell'ambulanza, come se l'auto fosse ferma: $1/90$ di ora, cioè \SI{40}{\second}.'''
  [[quesito.opzione]]
  testo = '''\SI{1}{\minute}'''
  commento = '''Divide la distanza per la velocità dell'auto: $1/60$ di ora. Non c'è un motivo fisico per usare quella velocità da sola.'''
  [[quesito.opzione]]
  testo = '''\SI{24}{\second}'''
  commento = '''Somma le velocità, $90 + 60 = \SI{150}{\kilo\metre\per\hour}$, come se i veicoli si venissero incontro: $1/150$ di ora. Nello stesso verso conta la differenza.'''
  [[quesito.opzione]]
  testo = '''\SI{2}{\minute}'''
  valore = 2
  [[quesito.opzione]]
  testo = '''\SI{48}{\second}'''
  commento = '''Usa la media delle due velocità, \SI{75}{\kilo\metre\per\hour}: $1/75$ di ora, cioè \SI{48}{\second}.'''

[[quesito]]
id = "sim3-ud2-armadio"
simulazione = 3
ud = 2
tipo = "multipla"
testo = '''Per smuovere un armadio fermo sul pavimento serve una spinta orizzontale di poco più di \SI{200}{\newton}; una volta in moto, per farlo scorrere a velocità costante basta una spinta di \SI{150}{\newton}. Il motivo è che'''
corretta = "B"
soluzione = '''Per smuoverlo la spinta deve superare l'attrito statico massimo, $\mu_s F_N \approx \SI{200}{\newton}$. Una volta in moto, a velocità costante la risultante è nulla per il primo principio: la spinta bilancia l'attrito dinamico, che vale quindi $\mu_d F_N = \SI{150}{\newton}$. La forza normale è la stessa nei due casi, quindi $\mu_d < \mu_s$: per i due materiali a contatto il coefficiente di attrito dinamico è minore di quello statico.'''

  [[quesito.opzione]]
  testo = '''mentre l'armadio scorre il suo peso diminuisce'''
  commento = '''Il peso non dipende dal moto. Su un pavimento orizzontale anche la forza normale resta uguale al peso; cambia il coefficiente di attrito.'''
  [[quesito.opzione]]
  testo = '''il coefficiente di attrito dinamico è minore di quello statico'''
  [[quesito.opzione]]
  testo = '''mentre l'armadio scorre l'attrito non agisce più, e la spinta serve solo a mantenere il moto'''
  commento = '''Senza attrito non servirebbe nessuna spinta per mantenere il moto, per il primo principio. A velocità costante la spinta di \SI{150}{\newton} bilancia proprio l'attrito dinamico.'''
  [[quesito.opzione]]
  testo = '''una volta in moto l'inerzia aiuta l'armadio, mentre l'attrito resta lo stesso'''
  commento = '''L'inerzia non è una forza. A velocità costante la risultante è nulla: se la spinta è diversa, è diverso l'attrito che bilancia.'''
  [[quesito.opzione]]
  testo = '''l'attrito statico vale sempre \SI{200}{\newton}, anche quando nessuno spinge l'armadio'''
  commento = '''L'attrito statico vale quanto basta a bilanciare la spinta, fino a un massimo. Se nessuno spinge, è nullo: \SI{200}{\newton} è il suo valore massimo.'''

[[quesito]]
id = "sim3-ud2-rampa"
simulazione = 3
ud = 2
tipo = "multipla"
testo = '''Una barella con il paziente, di \SI{100}{\kilo\gram} in tutto, scende dal primo piano al piano terra, con un dislivello di \SI{4}{\metre}: una volta in ascensore, un'altra volta lungo una rampa lunga \SI{40}{\metre}. Con $g = \SI{10}{\metre\per\second\squared}$, il lavoro compiuto dalla forza peso è'''
corretta = "A"
calcolo = "100 * g * 4"
soluzione = '''Il peso è una forza conservativa: il suo lavoro dipende solo dalla posizione iniziale e da quella finale, non dal percorso. Scendendo di $h$ il peso, verso il basso, compie un lavoro positivo
\[
  W = m g h = \SI{100}{\kilo\gram} \cdot \SI{10}{\metre\per\second\squared} \cdot \SI{4}{\metre} = \SI{4000}{\joule}
\]
sia in ascensore sia lungo la rampa. Lungo la rampa il percorso è più lungo, ma la componente del peso lungo la rampa è più piccola: il prodotto è lo stesso.'''

  [[quesito.opzione]]
  testo = '''\SI{4000}{\joule} in tutti e due i casi'''
  valore = 4000
  [[quesito.opzione]]
  testo = '''\SI{4000}{\joule} in ascensore e \SI{40000}{\joule} lungo la rampa'''
  commento = '''Moltiplica il peso intero per la lunghezza della rampa. Lungo la rampa agisce nella direzione del moto solo la componente del peso parallela alla rampa, dieci volte più piccola.'''
  [[quesito.opzione]]
  testo = '''zero in tutti e due i casi'''
  commento = '''Confonde il lavoro del peso con il lavoro totale. Se la barella scende a velocità costante il lavoro totale è zero, ma il peso compie un lavoro positivo, bilanciato da quello negativo di chi la frena.'''
  [[quesito.opzione]]
  testo = '''\SI{4000}{\joule} in ascensore e \SI{400}{\joule} lungo la rampa'''
  commento = '''Calcola bene la componente del peso lungo la rampa, $mg \cdot 4/40 = \SI{100}{\newton}$, ma la moltiplica per il dislivello invece che per la lunghezza della rampa: $100 \cdot 4 = 400$. Va moltiplicata per \SI{40}{\metre}, e si ritrova \SI{4000}{\joule}.'''
  [[quesito.opzione]]
  testo = '''\SI{-4000}{\joule} in tutti e due i casi'''
  commento = '''Il modulo è giusto, ma il segno no: in discesa il peso ha la componente nel verso dello spostamento, e il suo lavoro è positivo. È negativo in salita.'''

[[quesito]]
id = "sim3-ud2-carrelli-energia"
simulazione = 3
ud = 2
tipo = "multipla"
testo = '''Un carrello di \SI{4}{\kilo\gram} e uno di \SI{1}{\kilo\gram} hanno la stessa energia cinetica. Il rapporto fra il modulo della quantità di moto del carrello pesante e quello del carrello leggero è'''
corretta = "C"
calcolo = "math.sqrt(4 / 1)"
soluzione = '''Dall'energia cinetica si ricava la velocità, e da questa la quantità di moto: $E_c = \frac12 mv^2 = \dfrac{(mv)^2}{2m} = \dfrac{p^2}{2m}$, quindi $p = \sqrt{2mE_c}$. A parità di energia cinetica
\[
  \frac{p_1}{p_2} = \sqrt{\frac{m_1}{m_2}} = \sqrt{\frac{4}{1}} = 2
\]
In numeri: con $E_c = \SI{2}{\joule}$, il carrello leggero va a \SI{2}{\metre\per\second} e ha $p = \SI{2}{\kilo\gram\metre\per\second}$; quello pesante va a \SI{1}{\metre\per\second} e ha $p = \SI{4}{\kilo\gram\metre\per\second}$.'''

  [[quesito.opzione]]
  testo = '''4'''
  commento = '''Prende la quantità di moto proporzionale alla massa, come se i carrelli avessero la stessa velocità. A parità di energia il carrello pesante va più piano.'''
  [[quesito.opzione]]
  testo = '''$1/2$'''
  commento = '''Rovescia il rapporto: è quello fra le velocità del carrello pesante e del leggero, non fra le quantità di moto.'''
  [[quesito.opzione]]
  testo = '''2'''
  valore = 2
  [[quesito.opzione]]
  testo = '''1'''
  commento = '''Pensa che stessa energia cinetica voglia dire stessa quantità di moto. Sono grandezze diverse: $E_c = p^2/(2m)$ dipende anche dalla massa.'''
  [[quesito.opzione]]
  testo = '''16'''
  commento = '''Eleva al quadrato il rapporto delle masse invece di prenderne la radice: $4^2$.'''

[[quesito]]
id = "sim3-ud2-porta"
simulazione = 3
ud = 2
tipo = "multipla"
testo = '''Per aprire la porta pesante di un reparto, spingendo perpendicolarmente alla porta a \SI{75}{\centi\metre} dai cardini, serve una forza di \SI{8}{\newton}. Spingendo sempre in direzione perpendicolare, ma a \SI{25}{\centi\metre} dai cardini, serve una forza di'''
corretta = "B"
calcolo = "8 * 75 / 25"
soluzione = '''Per aprire la porta serve lo stesso momento rispetto all'asse dei cardini. Con la forza perpendicolare il braccio è la distanza dai cardini:
\[
  \tau = F_1 b_1 = \SI{8}{\newton} \cdot \SI{0,75}{\metre} = \SI{6}{\newton\metre}
  \qquad\Longrightarrow\qquad
  F_2 = \frac{\tau}{b_2} = \frac{\SI{6}{\newton\metre}}{\SI{0,25}{\metre}} = \SI{24}{\newton}
\]
Il braccio è tre volte più corto, e la forza deve essere tre volte più grande.'''

  [[quesito.opzione]]
  testo = '''\SI{8}{\newton}'''
  commento = '''Pensa che conti solo la forza e non il punto in cui la si applica. A far ruotare la porta è il momento, forza per braccio.'''
  [[quesito.opzione]]
  testo = '''\SI{24}{\newton}'''
  valore = 24
  [[quesito.opzione]]
  testo = '''\SI{2,7}{\newton}'''
  commento = '''Rovescia la proporzione: $8 \cdot 25/75 \approx 2{,}7$. Più vicino ai cardini serve una forza più grande, non più piccola.'''
  [[quesito.opzione]]
  testo = '''\SI{72}{\newton}'''
  commento = '''Usa il quadrato del rapporto dei bracci, $8 \cdot 3^2$. Il momento è proporzionale al braccio, non al suo quadrato.'''
  [[quesito.opzione]]
  testo = '''\SI{16}{\newton}'''
  commento = '''Usa la differenza delle distanze, $8 \cdot (75 - 25)/25$, invece del loro rapporto.'''

[[quesito]]
id = "sim3-ud1-angolo"
simulazione = 3
ud = 1
tipo = "completamento"
testo = '''Due vettori hanno modulo $a = 3$ e $b = 4$, e il loro prodotto scalare vale $\vec a \cdot \vec b = 6$. L'angolo fra i due vettori vale \completa\ gradi.'''
calcolo = "math.degrees(math.acos(6 / (3 * 4)))"
risposta = "60"
soluzione = '''Dalla definizione del prodotto scalare, $\vec a \cdot \vec b = ab\cos\theta$:
\[
  \cos\theta = \frac{\vec a \cdot \vec b}{ab} = \frac{6}{3 \cdot 4} = \frac{6}{12} = 0{,}5
\]
L'angolo fra \ang{0} e \ang{180} con coseno $0{,}5$ è $\theta = \ang{60}$. Chi scrive 30 ha confuso il coseno con il seno.'''

[[quesito]]
id = "sim3-ud2-molla-carrello"
simulazione = 3
ud = 2
tipo = "completamento"
testo = '''Su una rotaia orizzontale senza attrito un carrello di \SI{2}{\kilo\gram} è tirato da una molla ideale orizzontale di costante elastica \SI{200}{\newton\per\metre}, allungata di \SI{5}{\centi\metre}. In quell'istante l'accelerazione del carrello vale \completa\ \si{\metre\per\second\squared}.'''
calcolo = "200 * 0.05 / 2"
risposta = "5"
soluzione = '''Per la legge di Hooke, con $x = \SI{5}{\centi\metre} = \SI{0,05}{\metre}$, la molla tira il carrello con una forza di modulo
\[
  F = kx = \SI{200}{\newton\per\metre} \cdot \SI{0,05}{\metre} = \SI{10}{\newton}
\]
È l'unica forza orizzontale, quindi è la risultante. Per il secondo principio
\[
  a = \frac{F}{m} = \frac{\SI{10}{\newton}}{\SI{2}{\kilo\gram}} = \SI{5}{\metre\per\second\squared}
\]
Chi scrive 500 ha lasciato l'allungamento in centimetri.'''

[[quesito]]
id = "sim3-ud2-pendio"
simulazione = 3
ud = 2
tipo = "completamento"
testo = '''Una slitta passa sulla cima di un pendio innevato a \SI{4}{\metre\per\second} e scende fino in fondo, \SI{45}{\centi\metre} più in basso. Trascurando gli attriti e usando $g = \SI{10}{\metre\per\second\squared}$, in fondo al pendio la slitta ha una velocità di \completa\ \si{\metre\per\second}.'''
calcolo = "math.sqrt(4**2 + 2 * g * 0.45)"
risposta = "5"
soluzione = '''Senza attriti l'energia meccanica si conserva; la forza normale della neve è perpendicolare al moto e non compie lavoro. Con lo zero dell'energia potenziale in fondo e $h = \SI{0,45}{\metre}$:
\[
  \frac12 m v_i^2 + mgh = \frac12 m v_f^2
  \quad\Longrightarrow\quad
  v_f^2 = v_i^2 + 2gh = 16 + 2 \cdot 10 \cdot 0{,}45 = (16 + 9)\,\si{\metre\squared\per\second\squared} = \SI{25}{\metre\squared\per\second\squared}
\]
quindi $v_f = \SI{5}{\metre\per\second}$. Chi scrive 7 ha sommato le velocità, $4 + 3$, invece delle energie; chi scrive 3 ha dimenticato la velocità iniziale.'''

[[quesito]]
id = "sim1-ud3-tonometria"
simulazione = 1
ud = 3
tipo = "multipla"
testo = '''La pressione all'interno dell'occhio di un paziente supera quella atmosferica di {{p}}. Con $\SI{1}{\mmHg} \approx \SI{133}{\pascal}$, la forza in più che il liquido dell'occhio esercita dall'interno sulla cornea, che si può trattare come una superficie piana di area {{S}}, è circa'''
dati.p = { valore = 15, unita = "\\mmHg" }
dati.S = { valore = "1,0", unita = "\\centi\\metre\\squared" }
corretta = "D"
calcolo = "p * mmHg * S * 1e-4"
soluzione = '''La pressione in pascal è $p = 15 \cdot \SI{133}{\pascal} = \SI{1995}{\pascal} \approx \SI{2,0e3}{\pascal}$. L'area nel SI è $\SI{1,0}{\centi\metre\squared} = (\SI{e-2}{\metre})^2 = \SI{1,0e-4}{\metre\squared}$. Dalla definizione di pressione:
\[
  F = p\,S = \SI{1995}{\pascal} \cdot \SI{1,0e-4}{\metre\squared} = 1995 \cdot 10^{-4}\,\si{\newton} \approx \SI{0,20}{\newton}
\]'''

  [[quesito.opzione]]
  testo = '''\SI{20}{\newton}'''
  commento = '''Converte i centimetri quadrati con $10^{-2}$ invece di $10^{-4}$: $1995 \cdot 10^{-2} \approx 20$. Un centimetro quadrato è $(10^{-2}\,\si{\metre})^2 = \SI{e-4}{\metre\squared}$.'''
  [[quesito.opzione]]
  testo = '''\SI{2,0e3}{\newton}'''
  commento = '''Lascia l'area in centimetri quadrati, $S = 1$, in una formula in unità del SI: $1995 \cdot 1 \approx \num{2,0e3}$.'''
  [[quesito.opzione]]
  testo = '''\SI{1,5e-3}{\newton}'''
  commento = '''Dimentica di convertire i millimetri di mercurio in pascal: $15 \cdot 10^{-4} = \num{1,5e-3}$.'''
  [[quesito.opzione]]
  testo = '''\SI{0,20}{\newton}'''
  valore = 0.1995
  [[quesito.opzione]]
  testo = '''\SI{2,0e7}{\newton}'''
  commento = '''Divide la pressione per l'area invece di moltiplicarla: $1995/10^{-4} \approx \num{2,0e7}$. Da $p = F/S$ si ricava $F = pS$.'''

[[quesito]]
id = "sim1-ud3-torricelli"
simulazione = 1
ud = 3
tipo = "multipla"
testo = '''Si ripete l'esperimento di Torricelli al livello del mare con un tubo di diametro doppio, tenuto inclinato di \ang{30} rispetto alla verticale. Rispetto a quella che si ha in un tubo verticale più stretto, l'altezza verticale della colonna di mercurio sopra il livello della bacinella'''
corretta = "C"
soluzione = '''Alla quota della superficie della bacinella la pressione dentro il tubo è uguale a quella atmosferica. Dentro il tubo, sopra la colonna, c'è il vuoto, quindi per la legge di Stevino $p_\text{atm} = \rho_\text{Hg}\,g\,h$, dove $h$ è il dislivello verticale fra la superficie della bacinella e la cima della colonna. Questa relazione non contiene né la sezione del tubo né la sua inclinazione: $h$ resta di circa \SI{760}{\milli\metre}. Nel tubo inclinato il mercurio occupa un tratto più lungo, ma la sua cima è sempre \SI{760}{\milli\metre} più in alto della bacinella.'''

  [[quesito.opzione]]
  testo = '''diventa un quarto, perché la sezione del tubo è quattro volte più grande'''
  commento = '''Pensa che conti il peso della colonna. Con una sezione quattro volte più grande il peso del mercurio è quattro volte più grande, ma lo è anche la superficie su cui preme: la pressione dipende solo dall'altezza.'''
  [[quesito.opzione]]
  testo = '''aumenta, perché nel tubo inclinato il mercurio occupa un tratto più lungo'''
  commento = '''Confonde la lunghezza della colonna lungo il tubo con il dislivello verticale. Nella legge di Stevino conta solo il dislivello verticale.'''
  [[quesito.opzione]]
  testo = '''resta di circa \SI{760}{\milli\metre}'''
  [[quesito.opzione]]
  testo = '''si dimezza, perché il diametro del tubo è doppio'''
  commento = '''Confonde con la capillarità, in cui l'altezza è inversamente proporzionale al raggio. Nel tubo di Torricelli la capillarità è trascurabile, e la colonna è sostenuta dalla pressione atmosferica.'''
  [[quesito.opzione]]
  testo = '''diminuisce, perché nel tubo inclinato una parte del peso del mercurio è sostenuta dalla parete'''
  commento = '''La pressione alla base della colonna dipende solo dal dislivello verticale, non da come è inclinato il tubo: l'equilibrio si ha di nuovo quando la cima è \SI{760}{\milli\metre} sopra la bacinella.'''

[[quesito]]
id = "sim1-ud3-siringa-ago"
simulazione = 1
ud = 3
tipo = "multipla"
testo = '''Lo stantuffo di una siringa ha diametro {{D}}, l'ago ha diametro interno {{d}}. Si spinge lo stantuffo in modo uniforme, a {{v1}}. Il farmaco, incomprimibile, esce dall'ago con una velocità media di'''
dati.D = { valore = "1,0", unita = "cm" }
dati.d = { valore = "0,50", unita = "mm" }
dati.v1 = { valore = "1,0", unita = "\\milli\\metre\\per\\second" }
corretta = "E"
calcolo = "v1 * 1e-3 * (D * 10 / d)**2"
soluzione = '''Per l'equazione di continuità $S_1 v_1 = S_2 v_2$: la velocità è inversamente proporzionale all'area, e l'area è proporzionale al quadrato del diametro. Con i diametri nella stessa unità, $D = \SI{1,0}{\centi\metre} = \SI{10}{\milli\metre}$:
\[
  \frac{D}{d} = \frac{\SI{10}{\milli\metre}}{\SI{0,50}{\milli\metre}} = 20
  \qquad\qquad
  \frac{S_1}{S_2} = 20^2 = 400
\]
\[
  v_2 = v_1\,\frac{S_1}{S_2} = \SI{1,0}{\milli\metre\per\second} \cdot 400 = \SI{400}{\milli\metre\per\second} = \SI{0,40}{\metre\per\second}
\]'''

  [[quesito.opzione]]
  testo = '''\SI{0,020}{\metre\per\second}'''
  commento = '''Usa il rapporto dei diametri, 20, invece di quello delle aree, $20^2 = 400$: $20 \cdot \SI{1,0}{\milli\metre\per\second} = \SI{20}{\milli\metre\per\second}$.'''
  [[quesito.opzione]]
  testo = '''\SI{2,5e-6}{\metre\per\second}'''
  commento = '''Rovescia il rapporto delle aree, $\SI{1,0}{\milli\metre\per\second}/400 = \SI{2,5e-3}{\milli\metre\per\second}$: nel tratto stretto il fluido accelera, non rallenta.'''
  [[quesito.opzione]]
  testo = '''\SI{4,0e-3}{\metre\per\second}'''
  commento = '''Confronta i diametri in unità diverse, $1{,}0/0{,}50 = 2$ e $2^2 = 4$, senza portare il centimetro in millimetri.'''
  [[quesito.opzione]]
  testo = '''\SI{40}{\metre\per\second}'''
  commento = '''Sbaglia la conversione, $\SI{1}{\centi\metre} = \SI{100}{\milli\metre}$: il rapporto dei diametri viene 200 e quello delle aree \num{40000}. Un centimetro è \SI{10}{\milli\metre}.'''
  [[quesito.opzione]]
  testo = '''\SI{0,40}{\metre\per\second}'''
  valore = 0.4

[[quesito]]
id = "sim1-ud3-menisco"
simulazione = 1
ud = 3
tipo = "multipla"
testo = '''Si immerge un tubicino di vetro sottile in una bacinella di mercurio, che non bagna il vetro. Nel tubicino il mercurio'''
corretta = "B"
soluzione = '''Il mercurio non bagna il vetro: la coesione fra le sue molecole prevale sull'adesione al vetro, e l'angolo di contatto è maggiore di \ang{90} (circa \ang{140}). Il menisco è convesso. Nella legge di Jurin, $h = 2\gamma\cos\theta/(\rho g r)$, il coseno di un angolo fra \ang{90} e \ang{180} è negativo, e così anche $h$: nel tubicino il mercurio si ferma più in basso del livello esterno.'''

  [[quesito.opzione]]
  testo = '''sale sopra il livello esterno, con il menisco concavo'''
  commento = '''È il comportamento dell'acqua, che bagna il vetro. Il mercurio non lo bagna, e fa il contrario.'''
  [[quesito.opzione]]
  testo = '''si ferma più in basso del livello esterno, con il menisco convesso'''
  [[quesito.opzione]]
  testo = '''sale sopra il livello esterno, con il menisco convesso'''
  commento = '''La forma del menisco è giusta, ma un liquido che non bagna il vetro si abbassa: con $\theta > \ang{90}$ l'altezza $h$ della legge di Jurin è negativa.'''
  [[quesito.opzione]]
  testo = '''si ferma allo stesso livello esterno, perché tubicino e bacinella sono vasi comunicanti'''
  commento = '''Trascura la tensione superficiale. I vasi comunicanti si portano allo stesso livello solo se i tubi sono larghi; in un tubo sottile conta la capillarità.'''
  [[quesito.opzione]]
  testo = '''si ferma più in basso del livello esterno, con il menisco concavo'''
  commento = '''Il livello è giusto, ma il menisco concavo è quello di un liquido che bagna la parete. Il menisco del mercurio nel vetro è convesso.'''

[[quesito]]
id = "sim1-ud4-ambulanza"
simulazione = 1
ud = 4
tipo = "multipla"
testo = '''Un'ambulanza con la sirena accesa viene dritta verso un pedone fermo, a velocità costante. Mentre l'ambulanza si avvicina, il suono che il pedone sente'''
corretta = "A"
soluzione = '''La sorgente si avvicina all'osservatore: davanti a lei i fronti d'onda si addensano, la lunghezza d'onda è più corta e la frequenza che arriva al pedone è più alta di quella emessa. Lo spostamento di frequenza dipende dalla velocità con cui la distanza diminuisce, che qui è costante: il suono resta ugualmente acuto per tutto l'avvicinamento. Cambia invece l'intensità, che cresce man mano che la distanza diminuisce.'''

  [[quesito.opzione]]
  testo = '''è più acuto di quello emesso, con un'altezza che resta costante, e diventa sempre più forte'''
  [[quesito.opzione]]
  testo = '''è sempre più acuto man mano che l'ambulanza si avvicina'''
  commento = '''Confonde la distanza con la velocità. L'effetto Doppler dipende dalla velocità con cui la distanza cambia, che qui è costante; con la distanza cambia solo l'intensità.'''
  [[quesito.opzione]]
  testo = '''ha la stessa frequenza di quello emesso, perché la velocità dell'ambulanza è costante'''
  commento = '''Pensa che serva un'accelerazione. Basta che sorgente e osservatore si avvicinino, anche a velocità costante.'''
  [[quesito.opzione]]
  testo = '''è più grave di quello emesso, con un'altezza che resta costante'''
  commento = '''Rovescia l'effetto: quando sorgente e osservatore si avvicinano la frequenza percepita è più alta, non più bassa.'''
  [[quesito.opzione]]
  testo = '''è più acuto perché il suono emesso da una sorgente in moto viaggia più veloce'''
  commento = '''La velocità del suono dipende solo dal mezzo, non dal moto della sorgente. Cambia la lunghezza d'onda: i fronti d'onda davanti all'ambulanza sono più vicini.'''

[[quesito]]
id = "sim1-ud3-embolo"
simulazione = 1
ud = 3
tipo = "completamento"
testo = '''Un'arteria di resistenza idraulica {{R0}} porta il sangue a due rami uguali in parallelo, ciascuno di resistenza {{R1}}, che sboccano nella stessa vena. Un embolo chiude uno dei due rami. Se la differenza di pressione fra l'inizio dell'arteria e la vena non cambia e il moto resta laminare, la portata totale diventa il \completa\ \% di quella di prima.'''
dati.R0 = { valore = "2,0e8", unita = "\\pascal\\second\\per\\metre\\cubed" }
dati.R1 = { valore = "2,0e8", unita = "\\pascal\\second\\per\\metre\\cubed" }
calcolo = "100 * (R0 + R1 / 2) / (R0 + R1)"
risposta = "75"
soluzione = '''Si lavora in unità di \SI{e8}{\pascal\second\per\metre\cubed}. Prima dell'embolo i due rami uguali in parallelo hanno resistenza $R_1/2 = 1{,}0$, in serie con l'arteria: $R = 2{,}0 + 1{,}0 = 3{,}0$. Dopo, resta un ramo solo, in serie con l'arteria: $R' = 2{,}0 + 2{,}0 = 4{,}0$. Da $Q = \Delta p/R$, a parità di $\Delta p$:
\[
  \frac{Q'}{Q} = \frac{R}{R'} = \frac{3{,}0}{4{,}0} = 0{,}75 = 75\%
\]
Chi scrive 50 dimentica l'arteria in serie con i rami.'''

[[quesito]]
id = "sim1-ud3-tubo-u"
simulazione = 1
ud = 3
tipo = "completamento"
testo = '''Un tubo a U aperto contiene acqua ({{rhoa}}). In un ramo si versa uno strato di olio d'oliva ({{rhoo}}) alto {{ho}}, che non si mescola con l'acqua. All'equilibrio, nell'altro ramo la superficie dell'acqua sta più in alto della superficie di separazione fra olio e acqua di \completa\ \si{\centi\metre}.'''
dati.rhoa = { valore = 1000, unita = "\\kilo\\gram\\per\\metre\\cubed" }
dati.rhoo = { valore = 920, unita = "\\kilo\\gram\\per\\metre\\cubed" }
dati.ho = { valore = 25, unita = "cm" }
calcolo = "ho * rhoo / rhoa"
risposta = "23"
soluzione = '''Alla quota della superficie di separazione la pressione è la stessa nei due rami. Sopra quella quota c'è, da una parte, la colonna di olio alta $h_\text{o}$, dall'altra una colonna d'acqua alta $h_\text{a}$, tutte e due con la pressione atmosferica in cima. Quindi $\rho_\text{o} g h_\text{o} = \rho_\text{a} g h_\text{a}$ e
\[
  h_\text{a} = h_\text{o}\,\frac{\rho_\text{o}}{\rho_\text{a}} = \SI{25}{\centi\metre} \cdot \frac{920}{1000} = 25 \cdot 0{,}92\,\si{\centi\metre} = \SI{23}{\centi\metre}
\]
Il liquido meno denso forma la colonna più alta. Chi scrive 27 ha rovesciato il rapporto delle densità.'''

[[quesito]]
id = "sim1-ud4-conversazioni"
simulazione = 1
ud = 4
tipo = "completamento"
testo = '''Nella mensa di un ospedale ogni conversazione produce al centro della sala un livello sonoro di {{b1}}. Le conversazioni sono sorgenti indipendenti con la stessa intensità. Il livello al centro della sala arriva a {{b2}} quando le conversazioni sono \completa.'''
dati.b1 = { valore = 50, unita = "\\deci\\bel" }
dati.b2 = { valore = 70, unita = "\\deci\\bel" }
calcolo = "10**((b2 - b1) / 10)"
risposta = "100"
soluzione = '''Le sorgenti sono indipendenti, quindi si sommano le intensità: con $N$ conversazioni l'intensità è $N$ volte quella di una sola. Il livello aumenta di
\[
  \beta_N - \beta_1 = 10\log_{10} N = \SI{70}{\deci\bel} - \SI{50}{\deci\bel} = \SI{20}{\deci\bel}
\]
quindi $\log_{10} N = 2$ e $N = 10^{2} = 100$. Due conversazioni non bastano: danno solo $50 + 3 = \SI{53}{\deci\bel}$, perché si sommano le intensità, non i livelli.'''

[[quesito]]
id = "sim2-ud3-protesi"
simulazione = 2
ud = 3
tipo = "multipla"
testo = '''Una protesi d'anca appesa a un dinamometro segna {{P}} in aria e {{Papp}} quando è completamente immersa in acqua ({{rho}}). La densità del materiale della protesi è'''
dati.P = { valore = "9,0", unita = "\\newton" }
dati.Papp = { valore = "7,0", unita = "\\newton" }
dati.rho = { valore = 1000, unita = "\\kilo\\gram\\per\\metre\\cubed" }
corretta = "A"
calcolo = "rho * P / (P - Papp)"
soluzione = '''Il dinamometro in acqua segna il peso apparente, il peso meno la spinta. La spinta è quindi
\[
  F_A = P - P_\text{app} = \SI{9,0}{\newton} - \SI{7,0}{\newton} = \SI{2,0}{\newton}
\]
Il peso è $P = \rho V g$, la spinta $F_A = \rho_\text{acqua} V g$, con lo stesso volume $V$ perché la protesi è tutta immersa. Dividendo, $V$ e $g$ si semplificano:
\[
  \frac{\rho}{\rho_\text{acqua}} = \frac{P}{F_A} = \frac{9{,}0}{2{,}0} = 4{,}5
  \qquad\qquad
  \rho = 4{,}5 \cdot \SI{1000}{\kilo\gram\per\metre\cubed} = \SI{4500}{\kilo\gram\per\metre\cubed}
\]
È la densità del titanio, con cui si fanno molte protesi.'''

  [[quesito.opzione]]
  testo = '''\SI{4500}{\kilo\gram\per\metre\cubed}'''
  valore = 4500.0
  [[quesito.opzione]]
  testo = '''\SI{1300}{\kilo\gram\per\metre\cubed}'''
  commento = '''Divide il peso per il peso apparente invece che per la spinta: $9{,}0/7{,}0 \approx 1{,}3$. La spinta è la differenza fra le due letture, \SI{2,0}{\newton}.'''
  [[quesito.opzione]]
  testo = '''\SI{220}{\kilo\gram\per\metre\cubed}'''
  commento = '''Rovescia il rapporto, $F_A/P = 2{,}0/9{,}0 \approx 0{,}22$: una densità minore di quella dell'acqua farebbe galleggiare la protesi.'''
  [[quesito.opzione]]
  testo = '''\SI{3500}{\kilo\gram\per\metre\cubed}'''
  commento = '''Mette al numeratore il peso apparente invece del peso: $7{,}0/2{,}0 = 3{,}5$. Il peso del corpo è quello misurato in aria.'''
  [[quesito.opzione]]
  testo = '''\SI{4,5}{\kilo\gram\per\metre\cubed}'''
  commento = '''Usa per l'acqua la densità in \si{\gram\per\centi\metre\cubed}, $\rho_\text{acqua} = 1$, e scrive il risultato in \si{\kilo\gram\per\metre\cubed}: $\SI{4,5}{\gram\per\centi\metre\cubed} = \SI{4500}{\kilo\gram\per\metre\cubed}$.'''

[[quesito]]
id = "sim2-ud3-tubo-verticale"
simulazione = 2
ud = 3
tipo = "multipla"
testo = '''Una soluzione, che si può trattare come un fluido ideale di densità {{rho}}, sale in moto stazionario in un tubo verticale di sezione costante. Con $g = \SI{10}{\metre\per\second\squared}$, rispetto alla pressione in un punto del tubo, la pressione in un punto {{h}} più in alto'''
dati.rho = { valore = 1000, unita = "\\kilo\\gram\\per\\metre\\cubed" }
dati.h = { valore = 50, unita = "cm" }
corretta = "E"
calcolo = "rho * 10 * h / 100"
soluzione = '''La sezione è costante, quindi per l'equazione di continuità la velocità è la stessa nei due punti, e nel teorema di Bernoulli i termini $\frac{1}{2}\rho v^2$ si semplificano. Resta $p_1 + \rho g h_1 = p_2 + \rho g h_2$, cioè
\[
  p_1 - p_2 = \rho g\,(h_2 - h_1) = \SI{1000}{\kilo\gram\per\metre\cubed} \cdot \SI{10}{\metre\per\second\squared} \cdot \SI{0,50}{\metre} = \SI{5,0e3}{\pascal}
\]
La pressione in alto è \SI{5,0e3}{\pascal} più bassa, come in un liquido fermo: con la velocità costante vale la stessa relazione della legge di Stevino.'''

  [[quesito.opzione]]
  testo = '''è la stessa, perché la portata è la stessa in tutto il tubo'''
  commento = '''Dalla continuità segue che la velocità è la stessa, non la pressione: nel teorema di Bernoulli resta il termine $\rho g h$, che cambia con la quota.'''
  [[quesito.opzione]]
  testo = '''è \SI{5,0e3}{\pascal} più alta'''
  commento = '''Sbaglia il segno: salendo la quota aumenta, e la pressione diminuisce. Il punto più basso è quello a pressione maggiore.'''
  [[quesito.opzione]]
  testo = '''è \SI{5,0e5}{\pascal} più bassa'''
  commento = '''Lascia il dislivello in centimetri, $h = 50$: $1000 \cdot 10 \cdot 50 = \num{5e5}$. Nel SI il dislivello è \SI{0,50}{\metre}.'''
  [[quesito.opzione]]
  testo = '''è \SI{2,5e3}{\pascal} più bassa'''
  commento = '''Mette davanti a $\rho g h$ il fattore $\frac{1}{2}$, che appartiene solo al termine cinetico $\frac{1}{2}\rho v^2$.'''
  [[quesito.opzione]]
  testo = '''è \SI{5,0e3}{\pascal} più bassa'''
  valore = 5000.0

[[quesito]]
id = "sim2-ud3-insetto"
simulazione = 2
ud = 3
tipo = "multipla"
testo = '''Un insetto sta fermo sulla superficie dell'acqua, sostenuto dalla tensione superficiale lungo il bordo delle sue zampe. Si immagina un insetto della stessa forma e dello stesso materiale, con tutte le dimensioni 10 volte più grandi. Rispetto al primo insetto, il rapporto fra la forza di tensione superficiale che può sostenerlo e il suo peso'''
corretta = "B"
calcolo = "10 / 10**3"
soluzione = '''La forza di tensione superficiale è $F = \gamma \ell$, proporzionale alla lunghezza del bordo: con le dimensioni per 10, diventa 10 volte più grande. Il peso è proporzionale al volume: diventa $10^3 = 1000$ volte più grande. Il rapporto fra forza e peso si moltiplica quindi per
\[
  \frac{10}{10^{3}} = 10^{-2} = \frac{1}{100}
\]
Per questo la tensione superficiale conta per gli oggetti piccoli, e non regge un animale grande.'''

  [[quesito.opzione]]
  testo = '''resta lo stesso, perché la forma è la stessa'''
  commento = '''A parità di forma le grandezze crescono con potenze diverse delle dimensioni: la lunghezza del bordo come $10$, il volume come $10^3$.'''
  [[quesito.opzione]]
  testo = '''diventa 100 volte più piccolo'''
  valore = 0.01
  [[quesito.opzione]]
  testo = '''diventa 10 volte più piccolo'''
  commento = '''Fa crescere il peso come una superficie, $10^2$, invece che come un volume, $10^3$: $10/10^2 = 1/10$.'''
  [[quesito.opzione]]
  testo = '''diventa 1000 volte più piccolo'''
  commento = '''Fa crescere il peso di $10^3$ ma lascia invariata la forza di tensione superficiale, che invece cresce di 10 con la lunghezza del bordo delle zampe.'''
  [[quesito.opzione]]
  testo = '''diventa 10 volte più grande'''
  commento = '''Considera solo la forza di tensione superficiale, che cresce di 10, e dimentica che il peso cresce molto di più.'''

[[quesito]]
id = "sim2-ud4-velocita-punto"
simulazione = 2
ud = 4
tipo = "multipla"
testo = '''Su una corda tesa viaggia un'onda armonica trasversale. Un punto della corda si muove con la velocità più grande quando'''
corretta = "C"
soluzione = '''Al passaggio di un'onda armonica ogni punto della corda è un oscillatore armonico, che oscilla fra $-A$ e $+A$. Agli estremi, cioè su una cresta o su un avvallamento, il punto si ferma e torna indietro: la sua velocità è nulla. La velocità è massima quando passa per la posizione di equilibrio. Questa velocità non va confusa con la velocità di propagazione dell'onda, che è la stessa in tutti i punti e non cambia nel tempo.'''

  [[quesito.opzione]]
  testo = '''si trova su una cresta'''
  commento = '''Confonde lo spostamento massimo con la velocità massima: sulla cresta il punto inverte il moto, e la sua velocità è nulla.'''
  [[quesito.opzione]]
  testo = '''si trova su un avvallamento'''
  commento = '''Anche nell'avvallamento lo spostamento è massimo (verso il basso) e il punto inverte il moto: la sua velocità è nulla.'''
  [[quesito.opzione]]
  testo = '''passa per la posizione di equilibrio'''
  [[quesito.opzione]]
  testo = '''si muove alla velocità di propagazione dell'onda, sempre uguale'''
  commento = '''Confonde la velocità con cui avanza la forma dell'onda con quella con cui oscillano i punti della corda, che cambia di continuo.'''
  [[quesito.opzione]]
  testo = '''si muove con velocità costante fra $-A$ e $+A$: la velocità è la stessa in ogni posizione'''
  commento = '''Tratta l'oscillazione come un moto uniforme. Nel moto armonico il punto rallenta avvicinandosi agli estremi, dove si ferma, e accelera tornando verso l'equilibrio.'''

[[quesito]]
id = "sim2-ud4-fonendoscopio"
simulazione = 2
ud = 4
tipo = "multipla"
testo = '''I toni cardiaci raccolti dalla membrana del fonendoscopio arrivano alle orecchie del medico lungo i tubi dello strumento senza indebolirsi molto. Il motivo è che nei tubi'''
corretta = "D"
soluzione = '''All'aperto l'energia di un'onda sonora si distribuisce su superfici sempre più grandi, e l'intensità cala con l'inverso del quadrato della distanza. Dentro un tubo l'onda non può allargarsi: la sua energia resta concentrata sulla piccola sezione del tubo, e l'intensità resta quasi la stessa lungo il tubo.'''

  [[quesito.opzione]]
  testo = '''il suono viaggia più veloce che nell'aria libera'''
  commento = '''La velocità del suono dipende dal mezzo, e nei tubi c'è la stessa aria. In ogni caso una velocità maggiore non impedirebbe all'onda di allargarsi.'''
  [[quesito.opzione]]
  testo = '''la frequenza del suono aumenta, e con lei l'intensità'''
  commento = '''La frequenza è fissata dalla sorgente e non cambia lungo il percorso dell'onda.'''
  [[quesito.opzione]]
  testo = '''il suono diventa un'onda trasversale, che non si attenua'''
  commento = '''Nell'aria, come in ogni fluido, si propagano solo onde longitudinali.'''
  [[quesito.opzione]]
  testo = '''l'energia dell'onda resta concentrata sulla piccola sezione del tubo, e l'intensità non cala con l'inverso del quadrato della distanza'''
  [[quesito.opzione]]
  testo = '''l'aria dei tubi si sposta dalla membrana alle orecchie, e porta con sé l'energia del suono'''
  commento = '''Un'onda trasporta energia, non materia: gli strati d'aria oscillano avanti e indietro intorno alla loro posizione.'''

[[quesito]]
id = "sim2-ud3-densita-sangue"
simulazione = 2
ud = 3
tipo = "completamento"
testo = '''In un campione di sangue con un ematocrito del 40\%, i globuli rossi occupano il 40\% del volume e hanno densità {{rhog}}; il resto del volume è plasma, di densità {{rhop}}. La densità del sangue del campione è \completa\ \si{\kilo\gram\per\metre\cubed}.'''
dati.rhog = { valore = 1100, unita = "\\kilo\\gram\\per\\metre\\cubed" }
dati.rhop = { valore = 1025, unita = "\\kilo\\gram\\per\\metre\\cubed" }
calcolo = "0.40 * rhog + 0.60 * rhop"
risposta = "1055"
soluzione = '''Si considera $\SI{1}{\metre\cubed}$ di sangue. I globuli rossi ne occupano \SI{0,40}{\metre\cubed}, con massa $\SI{1100}{\kilo\gram\per\metre\cubed} \cdot \SI{0,40}{\metre\cubed} = \SI{440}{\kilo\gram}$; il plasma \SI{0,60}{\metre\cubed}, con massa $\SI{1025}{\kilo\gram\per\metre\cubed} \cdot \SI{0,60}{\metre\cubed} = \SI{615}{\kilo\gram}$. La densità è la massa totale divisa per il volume:
\[
  \rho = \frac{m}{V} = \frac{\SI{440}{\kilo\gram} + \SI{615}{\kilo\gram}}{\SI{1}{\metre\cubed}} = \SI{1055}{\kilo\gram\per\metre\cubed}
\]
Chi scrive 1062,5 fa la media semplice delle due densità, senza pesarle con i volumi.'''

[[quesito]]
id = "sim2-ud3-flusso"
simulazione = 2
ud = 3
tipo = "completamento"
testo = '''In un vaso il sangue scorre con velocità {{v}}, uguale in tutti i punti e nella stessa direzione. Si considera una superficie piana immaginaria di area {{S}}, tutta dentro il vaso, la cui perpendicolare forma un angolo di \ang{60} con la velocità ($\cos\ang{60} = 0{,}5$). Il flusso della velocità attraverso la superficie vale \completa\ \si{\centi\metre\cubed\per\second}.'''
dati.v = { valore = 20, unita = "\\centi\\metre\\per\\second" }
dati.S = { valore = "3,0", unita = "\\centi\\metre\\squared" }
calcolo = "S * v * 0.5"
risposta = "30"
soluzione = '''Il flusso è l'area per la componente della velocità perpendicolare alla superficie, $\Phi = S\,v\cos\alpha$. Con le grandezze in centimetri:
\[
  \Phi = \SI{3,0}{\centi\metre\squared} \cdot \SI{20}{\centi\metre\per\second} \cdot 0{,}5 = \SI{30}{\centi\metre\cubed\per\second}
\]
Chi scrive 60 dimentica il coseno: il conto $Sv$ vale solo per una superficie perpendicolare alla velocità.'''

[[quesito]]
id = "sim2-ud3-velocita-arteriola"
simulazione = 2
ud = 3
tipo = "completamento"
testo = '''Per una vasocostrizione il raggio di un'arteriola si dimezza, mentre la differenza di pressione ai suoi capi e la sua lunghezza restano le stesse e il moto resta laminare. La velocità media del sangue nell'arteriola diventa \completa\ volte più piccola.'''
calcolo = "2**4 / 2**2"
risposta = "4"
soluzione = '''Per la legge di Poiseuille la portata è proporzionale a $r^4$: con il raggio dimezzato diventa $2^4 = 16$ volte più piccola. L'area della sezione è proporzionale a $r^2$, e diventa $2^2 = 4$ volte più piccola. La velocità media è la portata divisa per l'area, $v = Q/S$:
\[
  \frac{v'}{v} = \frac{Q'/Q}{S'/S} = \frac{1/16}{1/4} = \frac{1}{4}
\]
Lo stesso risultato viene da $v_\text{media} = r^2\,\Delta p/(8\eta L)$. Chi scrive 16 confonde la velocità con la portata.'''

[[quesito]]
id = "sim3-ud3-pascal-ago"
simulazione = 3
ud = 3
tipo = "multipla"
testo = '''Una siringa piena di soluzione, con la punta dell'ago tappata, è tenuta ferma in orizzontale. Spingendo lo stantuffo, di area {{S1}}, la pressione nella soluzione sotto lo stantuffo aumenta di {{dp}}. La sezione della punta dell'ago è 100 volte più piccola di quella dello stantuffo. Sul tappo, alla punta dell'ago, la pressione aumenta di'''
dati.S1 = { valore = "2,0", unita = "\\centi\\metre\\squared" }
dati.dp = { valore = "1,0e5", unita = "\\pascal" }
corretta = "C"
calcolo = "dp"
soluzione = '''Il liquido è fermo e incomprimibile. Per il principio di Pascal una variazione di pressione prodotta in un punto si trasmette invariata a tutti i punti del liquido e alle pareti: sul tappo la pressione aumenta di \SI{1,0e5}{\pascal}, come sotto lo stantuffo. A essere 100 volte più piccola è la forza sul tappo: sullo stantuffo $F = \Delta p\,S_1 = \SI{1,0e5}{\pascal} \cdot \SI{2,0e-4}{\metre\squared} = \SI{20}{\newton}$, sul tappo $\SI{20}{\newton}/100 = \SI{0,20}{\newton}$.'''

  [[quesito.opzione]]
  testo = '''\SI{1,0e7}{\pascal}'''
  commento = '''Moltiplica per il rapporto delle aree, come se la sezione stretta concentrasse la pressione. Per il principio di Pascal la variazione di pressione è la stessa in tutto il liquido; cambia la forza, proporzionale all'area.'''
  [[quesito.opzione]]
  testo = '''\SI{1,0e3}{\pascal}'''
  commento = '''Divide per il rapporto delle aree: tratta la pressione come una forza, che sulla sezione più piccola è 100 volte minore.'''
  [[quesito.opzione]]
  testo = '''\SI{1,0e5}{\pascal}'''
  valore = 1.0e5
  [[quesito.opzione]]
  testo = '''\SI{20}{\pascal}'''
  commento = '''Calcola la forza sullo stantuffo, $\SI{1,0e5}{\pascal} \cdot \SI{2,0e-4}{\metre\squared} = \SI{20}{\newton}$, e la scambia per una pressione.'''
  [[quesito.opzione]]
  testo = '''zero, perché il liquido è fermo'''
  commento = '''Il principio di Pascal vale proprio per i fluidi fermi: la pressione aumenta in tutto il liquido anche se non si muove.'''

[[quesito]]
id = "sim3-ud3-korotkoff"
simulazione = 3
ud = 3
tipo = "multipla"
testo = '''Durante la misura della pressione con lo sfigmomanometro, quando la pressione del manicotto è fra la sistolica e la diastolica, con il fonendoscopio sull'arteria si sentono dei colpi, i toni di Korotkoff. Si sentono perché il sangue che passa a scatti nell'arteria schiacciata'''
corretta = "A"
soluzione = '''A ogni battito l'arteria schiacciata dal manicotto si apre per un istante, e il sangue passa per un'apertura stretta con grande velocità. A velocità alte il moto diventa turbolento: il sangue forma vortici e si rimescola, e le vibrazioni che ne nascono si sentono con il fonendoscopio. Quando la pressione del manicotto scende sotto la diastolica l'arteria resta aperta, il flusso torna laminare e i colpi spariscono.'''

  [[quesito.opzione]]
  testo = '''scorre in moto turbolento, formando vortici che fanno vibrare la parete'''
  [[quesito.opzione]]
  testo = '''scorre in moto laminare, in strati che sfregano l'uno sull'altro'''
  commento = '''Il moto laminare è ordinato e silenzioso: è il flusso che c'è quando i colpi spariscono, sotto la pressione diastolica.'''
  [[quesito.opzione]]
  testo = '''scorre in moto stazionario, perché la velocità è la stessa a ogni battito'''
  commento = '''Un flusso a scatti non è stazionario, perché la velocità in ogni punto cambia nel tempo. E «stazionario» non dice nulla sul rumore: conta se il moto è laminare o turbolento.'''
  [[quesito.opzione]]
  testo = '''rallenta nel tratto schiacciato, e l'accumulo di sangue fa vibrare la parete'''
  commento = '''Per l'equazione di continuità nel tratto ristretto il sangue accelera, non rallenta.'''
  [[quesito.opzione]]
  testo = '''ha nel tratto schiacciato una pressione più alta, che fa vibrare la parete'''
  commento = '''Per il teorema di Bernoulli, dove il sangue è più veloce la pressione è più bassa, non più alta.'''

[[quesito]]
id = "sim3-ud3-cannula-sangue"
simulazione = 3
ud = 3
tipo = "multipla"
testo = '''Con una cannula si infonde soluzione fisiologica, di viscosità {{eta1}}. Si vuole infondere sangue, di viscosità {{eta2}}, con la stessa portata e la stessa differenza di pressione, usando una cannula della stessa lunghezza, in moto laminare. Rispetto a quello della prima cannula, il raggio interno della nuova cannula deve essere'''
dati.eta1 = { valore = "1,0e-3", unita = "\\pascal\\second" }
dati.eta2 = { valore = "4,0e-3", unita = "\\pascal\\second" }
corretta = "D"
calcolo = "(eta2 / eta1)**0.25"
soluzione = '''Per la legge di Poiseuille $Q = \pi r^4 \Delta p/(8\eta L)$. Con $Q$, $\Delta p$ e $L$ fissati, deve restare uguale il rapporto $r^4/\eta$. La viscosità è $4{,}0/1{,}0 = 4$ volte più grande, quindi $r^4$ deve diventare 4 volte più grande:
\[
  r_2 = \sqrt[4]{4}\; r_1 = \sqrt{\sqrt{4}}\; r_1 = \sqrt{2}\; r_1 \approx 1{,}4\, r_1
\]'''

  [[quesito.opzione]]
  testo = '''4 volte più grande'''
  commento = '''Fa crescere il raggio quanto la viscosità, come se la portata fosse proporzionale a $r$. È proporzionale a $r^4$.'''
  [[quesito.opzione]]
  testo = '''2 volte più grande'''
  commento = '''Usa la radice quadrata, $\sqrt{4} = 2$, come se la portata andasse con l'area della sezione, $r^2$. Con $r^4$ serve la radice quarta.'''
  [[quesito.opzione]]
  testo = '''uguale, perché la differenza di pressione è la stessa'''
  commento = '''Dimentica la viscosità: a parità di cannula e di differenza di pressione il sangue, quattro volte più viscoso, passerebbe con una portata quattro volte più piccola.'''
  [[quesito.opzione]]
  testo = '''circa 1,4 volte più grande'''
  valore = 1.4142135623730951
  [[quesito.opzione]]
  testo = '''circa 1,4 volte più piccolo'''
  commento = '''Il fattore è giusto ma il verso è rovesciato: un fluido più viscoso, per passare con la stessa portata, ha bisogno di una cannula più larga.'''

[[quesito]]
id = "sim3-ud3-goccia-bolla"
simulazione = 3
ud = 3
tipo = "multipla"
testo = '''Una goccia d'acqua saponata e una bolla di sapone hanno lo stesso raggio, {{r}}; la tensione superficiale dell'acqua saponata è {{gamma}}. La pressione interna supera quella esterna'''
dati.r = { valore = "1,0", unita = "cm" }
dati.gamma = { valore = "0,025", unita = "\\newton\\per\\metre" }
corretta = "E"
calcolo = "4 * gamma / (r * 1e-2)"
soluzione = '''Per la legge di Laplace, con $r = \SI{1,0e-2}{\metre}$. La goccia ha una sola superficie curva:
\[
  \Delta p_\text{goccia} = \frac{2\gamma}{r} = \frac{2 \cdot \SI{0,025}{\newton\per\metre}}{\SI{1,0e-2}{\metre}} = \frac{0{,}050}{0{,}010}\,\si{\pascal} = \SI{5,0}{\pascal}
\]
La bolla di sapone ha due superfici, l'interna e l'esterna della lamina, e la pressione di curvatura raddoppia:
\[
  \Delta p_\text{bolla} = \frac{4\gamma}{r} = \SI{10}{\pascal}
\]'''

  [[quesito.opzione]]
  testo = '''di \SI{5,0}{\pascal} nella goccia e di \SI{5,0}{\pascal} nella bolla'''
  commento = '''Usa $2\gamma/r$ anche per la bolla, dimenticando che la lamina di una bolla di sapone ha due superfici.'''
  [[quesito.opzione]]
  testo = '''di \SI{10}{\pascal} nella goccia e di \SI{5,0}{\pascal} nella bolla'''
  commento = '''Scambia le due formule: il fattore 4 spetta alla bolla, che ha due superfici, non alla goccia.'''
  [[quesito.opzione]]
  testo = '''di \SI{2,5}{\pascal} nella goccia e di \SI{5,0}{\pascal} nella bolla'''
  commento = '''Usa $\gamma/r$ per una superficie, dimenticando il fattore 2 della legge di Laplace per una superficie sferica.'''
  [[quesito.opzione]]
  testo = '''di \SI{5,0}{\pascal} nella goccia, mentre nella bolla non la supera, perché la lamina è sottilissima'''
  commento = '''La pressione di curvatura non dipende dallo spessore della lamina, ma dal raggio e dalla tensione superficiale delle sue due superfici.'''
  [[quesito.opzione]]
  testo = '''di \SI{5,0}{\pascal} nella goccia e di \SI{10}{\pascal} nella bolla'''
  valore = 10.0

[[quesito]]
id = "sim3-ud4-due-voci"
simulazione = 3
ud = 4
tipo = "multipla"
testo = '''Due persone parlano insieme nella stessa stanza, con voci di intensità simile. Nella stanza non si trovano punti di silenzio dovuti all'interferenza, come capita invece con due altoparlanti collegati allo stesso amplificatore che emettono lo stesso suono. Il motivo è che le due voci'''
corretta = "B"
soluzione = '''Per avere una figura di interferenza stabile, con punti fissi di interferenza distruttiva, le due sorgenti devono avere la stessa frequenza e mantenere la stessa differenza di fase, cioè oscillare sempre con lo stesso ritardo l'una rispetto all'altra. Due altoparlanti collegati allo stesso amplificatore lo fanno; due voci no: frequenze e fasi cambiano di continuo, e i punti di interferenza costruttiva e distruttiva si spostano troppo in fretta per essere notati.'''

  [[quesito.opzione]]
  testo = '''non rispettano il principio di sovrapposizione, perché sono troppo intense'''
  commento = '''Il principio di sovrapposizione vale per le onde di piccola ampiezza, e le voci lo sono: in ogni punto gli spostamenti delle due onde si sommano.'''
  [[quesito.opzione]]
  testo = '''non hanno la stessa frequenza, né una differenza di fase che resta costante'''
  [[quesito.opzione]]
  testo = '''si propagano nell'aria con velocità diverse'''
  commento = '''La velocità del suono dipende dal mezzo, non dalla sorgente: le due voci viaggiano nell'aria con la stessa velocità.'''
  [[quesito.opzione]]
  testo = '''hanno ampiezze un po' diverse, e l'interferenza distruttiva richiede ampiezze esattamente uguali'''
  commento = '''Con ampiezze diverse l'interferenza distruttiva c'è lo stesso: l'onda non si annulla, ma resta un'ampiezza $|A_1 - A_2|$ piccola. Due altoparlanti un po' diversi danno comunque punti di suono molto attenuato.'''
  [[quesito.opzione]]
  testo = '''trasportano energia, e l'energia non si può annullare'''
  commento = '''L'interferenza non annulla l'energia: la sposta dai punti di interferenza distruttiva a quelli di interferenza costruttiva. Non impedisce quindi i punti di silenzio.'''

[[quesito]]
id = "sim3-ud3-zavorra"
simulazione = 3
ud = 3
tipo = "completamento"
testo = '''Un subacqueo con la sua attrezzatura ha massa {{m}} e volume {{V}}. In acqua dolce ({{rho}}) vuole restare in equilibrio a qualsiasi profondità. Trascurando il volume della zavorra, la massa di zavorra che deve aggiungere è \completa\ \si{\kilo\gram}.'''
dati.m = { valore = 90, unita = "\\kilo\\gram" }
dati.V = { valore = 95, unita = "\\litre" }
dati.rho = { valore = 1000, unita = "\\kilo\\gram\\per\\metre\\cubed" }
calcolo = "rho * V * 1e-3 - m"
risposta = "5"
soluzione = '''Un corpo immerso resta in equilibrio a qualsiasi profondità quando il suo peso è uguale alla spinta di Archimede, cioè quando la sua densità media è quella dell'acqua. Il volume nel SI è $V = 95 \cdot \SI{e-3}{\metre\cubed} = \SI{0,095}{\metre\cubed}$. Il peso dell'acqua spostata è quello di una massa
\[
  \rho V = \SI{1000}{\kilo\gram\per\metre\cubed} \cdot \SI{0,095}{\metre\cubed} = \SI{95}{\kilo\gram}
\]
Il subacqueo con la zavorra deve avere questa massa: $m_\text{z} = \SI{95}{\kilo\gram} - \SI{90}{\kilo\gram} = \SI{5}{\kilo\gram}$. Senza zavorra la sua densità media è $90/0{,}095 \approx \SI{950}{\kilo\gram\per\metre\cubed}$, minore di quella dell'acqua, e tornerebbe a galla.'''

[[quesito]]
id = "sim3-ud3-aria-polmoni"
simulazione = 3
ud = 3
tipo = "completamento"
testo = '''Dopo un'inspirazione profonda i polmoni di un adulto contengono circa {{V}} d'aria, di densità {{rho}}. La massa di quest'aria è \completa\ \si{\gram}.'''
dati.V = { valore = "5,0", unita = "\\litre" }
dati.rho = { valore = "1,2", unita = "\\kilo\\gram\\per\\metre\\cubed" }
calcolo = "rho * V * 1e-3 * 1e3"
risposta = "6"
soluzione = '''Il volume nel SI è $V = 5{,}0 \cdot \SI{e-3}{\metre\cubed} = \SI{5,0e-3}{\metre\cubed}$. Dalla definizione di densità:
\[
  m = \rho V = \SI{1,2}{\kilo\gram\per\metre\cubed} \cdot \SI{5,0e-3}{\metre\cubed} = 6{,}0 \cdot 10^{-3}\,\si{\kilo\gram} = \SI{6}{\gram}
\]
Chi scrive \num{6000} ha lasciato il volume in litri: $1{,}2 \cdot 5{,}0 = 6{,}0$, letto come chilogrammi. Un litro è \SI{e-3}{\metre\cubed}.'''

[[quesito]]
id = "sim3-ud4-equazione"
simulazione = 3
ud = 4
tipo = "completamento"
testo = '''Su una corda viaggia un'onda descritta, in unità del SI, da $y(x,t) = 0{,}040\,\sin(0{,}50\,x - 15\,t)$. La velocità di propagazione dell'onda vale \completa\ \si{\metre\per\second}.'''
calcolo = "15 / 0.50"
risposta = "30"
soluzione = '''Si confronta con $y = A\sin(kx - \omega t)$: il numero d'onda è $k = \SI{0,50}{\radian\per\metre}$, la pulsazione $\omega = \SI{15}{\radian\per\second}$. La velocità è il loro rapporto:
\[
  v = \frac{\omega}{k} = \frac{\SI{15}{\radian\per\second}}{\SI{0,50}{\radian\per\metre}} = \SI{30}{\metre\per\second}
\]
Chi scrive 7,5 ha moltiplicato $\omega$ per $k$ invece di dividere.'''

[[quesito]]
id = "sim1-ud5-funzione-stato"
simulazione = 1
ud = 5
tipo = "multipla"
testo = '''Un gas perfetto passa dallo stato $A$ allo stato $B$ in due modi: una volta con un'isobara seguita da un'isocora, un'altra volta con un'isocora seguita da un'isobara. Quale grandezza ha certamente lo stesso valore nei due casi?'''
corretta = "E"
soluzione = '''L'energia interna è una funzione di stato: la sua variazione dipende solo dagli stati iniziale e finale, che sono gli stessi, quindi $\Delta U = U_B - U_A$ è uguale nei due casi. Il lavoro è l'area sotto la curva nel piano $pV$: nel primo percorso l'isobara è alla pressione $p_A$, nel secondo alla pressione $p_B$, e le aree sono diverse. Allora anche il calore, $Q = \Delta U + W$, è diverso.'''

  [[quesito.opzione]]
  testo = '''il lavoro compiuto dal gas'''
  commento = '''Tratta il lavoro come una funzione di stato. È l'area sotto la curva nel piano $pV$, e i due percorsi hanno l'isobara a pressioni diverse, $p_A$ e $p_B$: le aree sono diverse.'''
  [[quesito.opzione]]
  testo = '''il calore assorbito dal gas'''
  commento = '''Tratta il calore come una funzione di stato. Dal primo principio $Q = \Delta U + W$: $\Delta U$ è uguale, ma $W$ no, quindi neppure $Q$.'''
  [[quesito.opzione]]
  testo = '''la temperatura più alta raggiunta durante la trasformazione'''
  commento = '''Dipende dagli stati intermedi: nel primo percorso il gas passa per lo stato con pressione $p_A$ e volume $V_B$, nel secondo per quello con pressione $p_B$ e volume $V_A$, che in generale hanno temperature diverse.'''
  [[quesito.opzione]]
  testo = '''la pressione del gas durante l'isobara'''
  commento = '''Nel primo percorso l'isobara viene per prima ed è alla pressione dello stato $A$; nel secondo viene dopo l'isocora ed è alla pressione dello stato $B$.'''
  [[quesito.opzione]]
  testo = '''la variazione di energia interna del gas'''

[[quesito]]
id = "sim1-ud5-ghiaccio-impacco"
simulazione = 1
ud = 5
tipo = "multipla"
testo = '''Per un impacco freddo serve acqua a \SI{0}{\celsius}. In un contenitore isolato con \SI{300}{\gram} d'acqua a \SI{20}{\celsius} si aggiunge ghiaccio a \SI{0}{\celsius}, quanto basta perché alla fine il ghiaccio sia appena tutto fuso e l'acqua sia a \SI{0}{\celsius}. Il calore specifico dell'acqua è \SI{1}{\calorie\per\gram\per\celsius}, il calore latente di fusione del ghiaccio \SI{80}{\calorie\per\gram}. Quanto ghiaccio serve?'''
corretta = "A"
calcolo = "300 * 1 * 20 / 80"
soluzione = '''L'acqua, raffreddandosi da \SI{20}{\celsius} a \SI{0}{\celsius}, cede $Q = m c\,\Delta T = 300 \cdot 1 \cdot 20 = \SI{6000}{\calorie}$. Tutto questo calore serve a fondere il ghiaccio, che resta a \SI{0}{\celsius}: $Q = m_g L_f$, quindi
\[
  m_g = \frac{Q}{L_f} = \frac{\SI{6000}{\calorie}}{\SI{80}{\calorie\per\gram}} = \SI{75}{\gram}
\]'''

  [[quesito.opzione]]
  testo = '''\SI{75}{\gram}'''
  valore = 75
  [[quesito.opzione]]
  testo = '''\SI{1200}{\gram}'''
  commento = '''Rovescia il rapporto fra il calore specifico e il calore latente: $300 \cdot 80/20 = 1200$ invece di $300 \cdot 20/80 = 75$.'''
  [[quesito.opzione]]
  testo = '''\SI{60}{\gram}'''
  commento = '''Fa scaldare anche l'acqua di fusione fino a \SI{20}{\celsius}, $m_g \cdot 80 + m_g \cdot 1 \cdot 20 = 6000$, da cui $m_g = 60$: ma la temperatura finale è \SI{0}{\celsius}, e l'acqua di fusione non si scalda.'''
  [[quesito.opzione]]
  testo = '''circa \SI{1100}{\gram}'''
  commento = '''Usa la temperatura in kelvin, \SI{293}{\kelvin}, invece della differenza di temperatura, \SI{20}{\kelvin}: $300 \cdot 293/80 \approx 1100$.'''
  [[quesito.opzione]]
  testo = '''nessuna quantità: se l'acqua finisce a \SI{0}{\celsius}, il ghiaccio non può fondere'''
  commento = '''A \SI{0}{\celsius} ghiaccio e acqua possono stare insieme: il ghiaccio fonde a temperatura costante, prendendo calore dall'acqua più calda finché questa arriva a \SI{0}{\celsius}.'''

[[quesito]]
id = "sim1-ud5-dewar"
simulazione = 1
ud = 5
tipo = "multipla"
testo = '''In un ambulatorio di dermatologia l'azoto liquido si conserva in un recipiente a doppia parete: fra le due pareti c'è il vuoto, e le pareti sono argentate, cioè riflettenti. In che modo il recipiente riduce il calore che arriva all'azoto?'''
corretta = "D"
soluzione = '''La conduzione e la convezione hanno bisogno di un materiale: la conduzione di molecole che si urtano, la convezione di un fluido che si muove. Nel vuoto fra le pareti non ci sono né l'una né l'altra. L'irraggiamento invece attraversa anche il vuoto; lo riducono le pareti argentate, che riflettono la radiazione infrarossa invece di assorbirla.'''

  [[quesito.opzione]]
  testo = '''il vuoto blocca l'irraggiamento, le pareti argentate la conduzione'''
  commento = '''Rovescia i ruoli: l'irraggiamento attraversa il vuoto (così arriva sulla Terra il calore del Sole), e una superficie riflettente agisce sulla radiazione, non sulla conduzione.'''
  [[quesito.opzione]]
  testo = '''il vuoto blocca la convezione, ma la conduzione attraverso il vuoto resta'''
  commento = '''La conduzione ha bisogno di un materiale, le cui molecole si passano energia urtandosi: nel vuoto non c'è.'''
  [[quesito.opzione]]
  testo = '''le pareti argentate assorbono la radiazione infrarossa e la trattengono'''
  commento = '''Una superficie lucida e riflettente ha emissività bassa: assorbe poco e riflette la radiazione. Se l'assorbisse si scalderebbe, e il calore arriverebbe all'interno.'''
  [[quesito.opzione]]
  testo = '''il vuoto blocca conduzione e convezione, le pareti argentate riducono l'irraggiamento'''
  [[quesito.opzione]]
  testo = '''il vuoto blocca tutti e tre i modi di trasmissione; le pareti argentate servono solo a proteggere il vetro'''
  commento = '''L'irraggiamento è l'unico dei tre modi che non ha bisogno di un mezzo: passa anche attraverso il vuoto.'''

[[quesito]]
id = "sim1-ud5-carnot-inventore"
simulazione = 1
ud = 5
tipo = "multipla"
testo = '''Un inventore dichiara di aver costruito una macchina termica che lavora fra una sorgente calda a \SI{327}{\celsius} e una fredda a \SI{27}{\celsius}, con un rendimento del 60\%. Quale affermazione è corretta?'''
corretta = "B"
soluzione = '''Il rendimento massimo fra due sorgenti è quello di Carnot, con le temperature in kelvin: $T_c = 327 + 273 = \SI{600}{\kelvin}$ e $T_f = 27 + 273 = \SI{300}{\kelvin}$.
\[
  \eta_{\text{Carnot}} = 1 - \frac{T_f}{T_c} = 1 - \frac{300}{600} = 1 - \frac12 = 50\%
\]
Il 60\% supera questo limite: per il teorema di Carnot nessuna macchina fra queste temperature ci arriva.'''

  [[quesito.opzione]]
  testo = '''è possibile, perché il rendimento dichiarato è minore del 100\%'''
  commento = '''Guarda solo il primo principio, che vieta di produrre più lavoro del calore assorbito. Il limite più stretto viene dal secondo principio: il rendimento di Carnot, qui il 50\%.'''
  [[quesito.opzione]]
  testo = '''non è possibile: fra quelle temperature il rendimento massimo è il 50\%'''
  [[quesito.opzione]]
  testo = '''è possibile: fra quelle temperature il rendimento massimo è circa il 92\%'''
  commento = '''Usa i gradi Celsius invece dei kelvin: $1 - 27/327 \approx 1 - 0{,}08 = 0{,}92$.'''
  [[quesito.opzione]]
  testo = '''è possibile, purché tutte le trasformazioni della macchina siano reversibili'''
  commento = '''Una macchina reversibile arriva esattamente al rendimento di Carnot, il 50\%, e non lo supera: è il caso migliore possibile.'''
  [[quesito.opzione]]
  testo = '''non è possibile, perché la macchina violerebbe il primo principio'''
  commento = '''Il primo principio è rispettato, basta che il lavoro sia il calore assorbito meno quello ceduto. A vietare il 60\% è il secondo principio.'''

[[quesito]]
id = "sim1-ud7-onde-uguale"
simulazione = 1
ud = 7
tipo = "multipla"
testo = '''Le onde radio di un tomografo a risonanza magnetica e i raggi X di una TC si propagano nel vuoto. Quale grandezza hanno uguale?'''
corretta = "C"
soluzione = '''Onde radio e raggi X sono entrambi onde elettromagnetiche, e nel vuoto tutte le onde elettromagnetiche viaggiano alla velocità della luce, $c \approx \SI{3e8}{\metre\per\second}$. Hanno invece frequenze molto diverse, quindi lunghezze d'onda diverse ($\lambda = c/f$) e fotoni di energia diversa ($E = hf$).'''

  [[quesito.opzione]]
  testo = '''la frequenza'''
  commento = '''Le onde radio stanno all'inizio dello spettro, i raggi X verso la fine: la frequenza dei raggi X è molto più alta.'''
  [[quesito.opzione]]
  testo = '''la lunghezza d'onda'''
  commento = '''Le onde radio hanno lunghezze d'onda dell'ordine del metro, i raggi X sotto \SI{10}{\nano\metre}: con la stessa velocità e frequenze diverse, $\lambda = c/f$ è diversa.'''
  [[quesito.opzione]]
  testo = '''la velocità'''
  [[quesito.opzione]]
  testo = '''l'energia di ciascun fotone'''
  commento = '''L'energia del fotone è $E = hf$: con frequenze diverse è diversa, molto più grande per i raggi X.'''
  [[quesito.opzione]]
  testo = '''nessuna: a differenza dei raggi X, le onde radio non si propagano nel vuoto'''
  commento = '''Confonde le onde radio con le onde sonore, che hanno bisogno di un mezzo. Le onde radio sono onde elettromagnetiche come i raggi X.'''

[[quesito]]
id = "sim1-ud7-lb-cobalto"
simulazione = 1
ud = 7
tipo = "multipla"
testo = '''Per i raggi X di una radiografia lo spessore emivalente del piombo è di qualche decimo di millimetro; per i raggi $\gamma$ del cobalto-60, usati in radioterapia, è di circa \SI{1}{\centi\metre}. Perché la differenza è così grande?'''
corretta = "E"
soluzione = '''Lo spessore emivalente è $x_{1/2} = \ln 2/\mu$: è grande quando il coefficiente di attenuazione $\mu$ è piccolo. Il coefficiente dipende dal materiale e dall'energia dei fotoni. I fotoni $\gamma$ del cobalto hanno un'energia molto più alta di quelli di una radiografia, il piombo li attenua meno, e $\mu$ è più piccolo: serve più spessore per dimezzarli.'''

  [[quesito.opzione]]
  testo = '''i raggi $\gamma$ hanno una lunghezza d'onda più lunga dei raggi X'''
  commento = '''Rovescia l'ordine dello spettro: i raggi $\gamma$ hanno lunghezza d'onda più corta, e quindi fotoni più energetici.'''
  [[quesito.opzione]]
  testo = '''il fascio del cobalto è più intenso di quello della radiografia'''
  commento = '''Lo spessore emivalente non dipende dall'intensità del fascio: ogni strato toglie la stessa frazione di quello che gli arriva, qualunque sia l'intensità.'''
  [[quesito.opzione]]
  testo = '''per i raggi $\gamma$ il coefficiente di attenuazione del piombo è più grande'''
  commento = '''Con $\mu$ più grande lo spessore emivalente, $\ln 2/\mu$, sarebbe più piccolo, non più grande.'''
  [[quesito.opzione]]
  testo = '''i raggi $\gamma$ hanno carica elettrica, i raggi X no'''
  commento = '''Raggi X e raggi $\gamma$ sono entrambi fotoni, senza carica: si distinguono per l'origine e per l'energia.'''
  [[quesito.opzione]]
  testo = '''i fotoni $\gamma$ del cobalto hanno più energia, e per loro il coefficiente di attenuazione del piombo è più piccolo'''

[[quesito]]
id = "sim1-ud5-isobara-frazione"
simulazione = 1
ud = 5
tipo = "completamento"
testo = '''Una certa quantità di gas perfetto monoatomico viene scaldata a pressione costante. La percentuale del calore assorbito che il gas restituisce come lavoro è \completa\,\%.'''
calcolo = "100 * R / (5 / 2 * R)"
risposta = "40"
soluzione = '''A pressione costante il gas assorbe $Q = n c_p\,\Delta T$, con $c_p = \frac52 R$ per un gas monoatomico, e compie il lavoro $W = p\,\Delta V = nR\,\Delta T$. Il rapporto non dipende né da $n$ né da $\Delta T$:
\[
  \frac{W}{Q} = \frac{nR\,\Delta T}{\frac52 nR\,\Delta T} = \frac{2}{5} = 0{,}4 = 40\%
\]
Il restante 60\%, $n c_V\,\Delta T$ con $c_V = \frac32 R$, resta nel gas come energia interna.'''

[[quesito]]
id = "sim1-ud7-iodio-decaduti"
simulazione = 1
ud = 7
tipo = "completamento"
testo = '''Un flacone di iodio-131, che ha un'emivita di 8 giorni, resta in deposito nel reparto di medicina nucleare per 32 giorni. In questo tempo la percentuale dei nuclei di iodio-131 iniziali che sono decaduti vale \completa\,\%.'''
calcolo = "(1 - 0.5**(32 / 8)) * 100"
risposta = "93,75"
soluzione = '''In 32 giorni ci sono $n = 32/8 = 4$ emivite. I nuclei rimasti sono la frazione $1/2^4 = 1/16$ di quelli iniziali, quindi quelli decaduti sono
\[
  1 - \frac{1}{16} = \frac{15}{16} = 0{,}9375 = 93{,}75\%
\]
Chi scrive 6,25 ha calcolato i nuclei rimasti, $1/16$, invece di quelli decaduti.'''

[[quesito]]
id = "sim2-ud5-gas-raddoppio"
simulazione = 2
ud = 5
tipo = "multipla"
testo = '''Un gas perfetto è chiuso in un cilindro da un pistone libero di muoversi, così che la sua pressione resta costante. Il gas è a \SI{27}{\celsius}. A quale temperatura bisogna portarlo perché il suo volume raddoppi?'''
corretta = "B"
calcolo = "2 * (27 + 273) - 273"
soluzione = '''A pressione costante il volume è proporzionale alla temperatura assoluta, $V_1/T_1 = V_2/T_2$. All'inizio $T_1 = 27 + 273 = \SI{300}{\kelvin}$. Perché il volume raddoppi deve raddoppiare la temperatura in kelvin: $T_2 = 2 \cdot \SI{300}{\kelvin} = \SI{600}{\kelvin}$, cioè $600 - 273 = \SI{327}{\celsius}$.'''

  [[quesito.opzione]]
  testo = '''\SI{54}{\celsius}'''
  commento = '''Raddoppia la temperatura in gradi Celsius, $2 \cdot 27 = 54$: il volume è proporzionale alla temperatura in kelvin.'''
  [[quesito.opzione]]
  testo = '''\SI{327}{\celsius}'''
  valore = 327
  [[quesito.opzione]]
  testo = '''\SI{600}{\celsius}'''
  commento = '''Trova bene $T_2 = \SI{600}{\kelvin}$, ma dimentica di togliere 273 per tornare ai gradi Celsius.'''
  [[quesito.opzione]]
  testo = '''\SI{327}{\kelvin}'''
  commento = '''Raddoppia in gradi Celsius, \SI{54}{\celsius}, e poi passa ai kelvin: $54 + 273 = \SI{327}{\kelvin}$, che sono ancora \SI{54}{\celsius}.'''
  [[quesito.opzione]]
  testo = '''\SI{-123}{\celsius}'''
  commento = '''Tratta volume e temperatura come inversamente proporzionali, e dimezza la temperatura: $300/2 = \SI{150}{\kelvin} = \SI{-123}{\celsius}$. Inversamente proporzionali sono pressione e volume, a temperatura costante.'''

[[quesito]]
id = "sim2-ud5-scaldabiberon"
simulazione = 2
ud = 5
tipo = "multipla"
testo = '''Uno scaldabiberon fornisce al latte una potenza di \SI{100}{\watt}. Il calore specifico del latte è circa \SI{4,0}{\kilo\joule\per\kilo\gram\per\kelvin}. Trascurando le perdite, quanto tempo serve per scaldare \SI{200}{\gram} di latte da \SI{7}{\celsius} a \SI{37}{\celsius}?'''
corretta = "D"
calcolo = "0.200 * 4.0e3 * 30 / 100 / 60"
soluzione = '''Il calore che serve è $Q = m c\,\Delta T$, con $m = \SI{0,200}{\kilo\gram}$, $c = \SI{4,0e3}{\joule\per\kilo\gram\per\kelvin}$ e $\Delta T = 37 - 7 = \SI{30}{\kelvin}$:
\[
  Q = 0{,}200 \cdot \num{4,0e3} \cdot 30\,\si{\joule} = 800 \cdot 30\,\si{\joule} = \SI{24000}{\joule}
\]
Con una potenza di \SI{100}{\joule\per\second}, il tempo è $\Delta t = Q/P = 24000/100 = \SI{240}{\second} = \SI{4}{\minute}$.'''

  [[quesito.opzione]]
  testo = '''circa \SI{8}{\second}'''
  commento = '''Dimentica la differenza di temperatura: $0{,}200 \cdot 4000/100 = \SI{8}{\second}$ è il tempo per scaldare il latte di un solo kelvin.'''
  [[quesito.opzione]]
  testo = '''circa \SI{0,24}{\second}'''
  commento = '''Usa il calore specifico in kilojoule e la potenza in watt: $0{,}200 \cdot 4{,}0 \cdot 30/100 = 0{,}24$. Il calore viene in kilojoule, e va portato in joule prima di dividere per i watt.'''
  [[quesito.opzione]]
  testo = '''circa \SI{41}{\minute}'''
  commento = '''Usa la temperatura finale in kelvin, \SI{310}{\kelvin}, invece della differenza di temperatura: $0{,}200 \cdot 4000 \cdot 310/100 = \SI{2480}{\second} \approx \SI{41}{\minute}$.'''
  [[quesito.opzione]]
  testo = '''\SI{4}{\minute}'''
  valore = 4
  [[quesito.opzione]]
  testo = '''circa \SI{67}{\hour}'''
  commento = '''Mette la massa in grammi con il calore specifico in \si{\joule\per\kilo\gram\per\kelvin}: $200 \cdot 4000 \cdot 30/100 = \SI{2,4e5}{\second} \approx \SI{67}{\hour}$, mille volte troppo.'''

[[quesito]]
id = "sim2-ud5-sangue-convezione"
simulazione = 2
ud = 5
tipo = "multipla"
testo = '''Il sangue, spinto dal cuore, porta il calore prodotto negli organi profondi fino alla pelle, dove il calore si disperde. Questo trasporto di calore è un esempio di'''
corretta = "E"
soluzione = '''Il calore viaggia con un fluido che si sposta, il sangue: è convezione. Il sangue non si muove da solo per differenze di densità, lo spinge una pompa, il cuore: la convezione è forzata.'''

  [[quesito.opzione]]
  testo = '''conduzione'''
  commento = '''Nella conduzione il calore passa attraverso un materiale che resta fermo. Qui il calore viaggia insieme al sangue, che si sposta.'''
  [[quesito.opzione]]
  testo = '''irraggiamento'''
  commento = '''L'irraggiamento è lo scambio di calore con la radiazione infrarossa, senza un mezzo. Il sangue è un fluido che trasporta il calore muovendosi.'''
  [[quesito.opzione]]
  testo = '''convezione naturale'''
  commento = '''Il tipo di trasmissione è giusto, ma nella convezione naturale il fluido si muove da solo, per le differenze di densità. Il sangue lo spinge il cuore.'''
  [[quesito.opzione]]
  testo = '''evaporazione'''
  commento = '''L'evaporazione toglie calore alla pelle con il sudore che diventa vapore. Il sangue porta il calore alla pelle senza cambiare stato.'''
  [[quesito.opzione]]
  testo = '''convezione forzata'''

[[quesito]]
id = "sim2-ud5-adiabatica-valvola"
simulazione = 2
ud = 5
tipo = "multipla"
testo = '''Il gas compresso di una bombola esce dalla valvola e si espande così in fretta da non scambiare calore con l'ambiente. Trattandolo come un gas perfetto, durante l'espansione la sua temperatura'''
corretta = "A"
soluzione = '''L'espansione è adiabatica, $Q = 0$. Il primo principio dà $\Delta U = Q - W = -W$. Espandendosi il gas compie un lavoro positivo, quindi la sua energia interna diminuisce. Per un gas perfetto l'energia interna dipende solo dalla temperatura: la temperatura diminuisce.'''

  [[quesito.opzione]]
  testo = '''diminuisce, perché il gas compie lavoro a spese della sua energia interna'''
  [[quesito.opzione]]
  testo = '''resta costante, perché il gas non scambia calore'''
  commento = '''Confonde l'adiabatica con l'isoterma: senza calore la temperatura cambia, perché il lavoro compiuto toglie energia interna.'''
  [[quesito.opzione]]
  testo = '''aumenta, perché il lavoro compiuto dal gas si aggiunge alla sua energia interna'''
  commento = '''Sbaglia il segno del lavoro: con $W$ compiuto dal gas il primo principio è $\Delta U = Q - W$, e un lavoro positivo fa diminuire $U$.'''
  [[quesito.opzione]]
  testo = '''aumenta, perché il volume del gas aumenta'''
  commento = '''Usa la proporzionalità fra volume e temperatura, che vale solo a pressione costante. Qui anche la pressione diminuisce, e il primo principio dice che $U$, quindi $T$, scende.'''
  [[quesito.opzione]]
  testo = '''diminuisce, perché il gas cede calore all'ambiente'''
  commento = '''La conclusione è giusta, ma il motivo no: in un'adiabatica il gas non scambia calore. Si raffredda perché compie lavoro.'''

[[quesito]]
id = "sim2-ud7-spettro-usi"
simulazione = 2
